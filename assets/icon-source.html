<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a74d8"/>
      <stop offset="55%" stop-color="#3a52b8"/>
      <stop offset="100%" stop-color="#1e2c6e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#f0b94a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 (스퀴클) -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <rect x="0" y="0" width="1024" height="520" rx="228" fill="url(#gloss)"/>

  <!-- 워드마크: 도도 -->
  <text x="512" y="500"
        font-family="'Malgun Gothic','Segoe UI',sans-serif"
        font-size="340"
        font-weight="800"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-28">도도</text>

  <!-- 숫자 배지: 32 -->
  <rect x="317" y="592" width="390" height="234" rx="64" fill="url(#badge)"/>
  <text x="512" y="765"
        font-family="'Segoe UI','Malgun Gothic',sans-serif"
        font-size="212"
        font-weight="800"
        fill="#2b3f96"
        text-anchor="middle">32</text>
</svg>
</body>
</html>
