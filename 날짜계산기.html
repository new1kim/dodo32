<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대출 업무용 영업일 날짜 계산기</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        :root {
            --ink: #1b2a4a;
            --ink-soft: #4c5876;
            --paper: #f4efe3;
            --card: #fffdf8;
            --gold: #a9812f;
            --gold-soft: rgba(169, 129, 47, 0.14);
            --stamp: #b23a2f;
            --stamp-soft: rgba(178, 58, 47, 0.10);
            --line: #ddd2b8;
            --sat: #2f5fa8;
            --receipt-blue: #3b6bb0;
            --exec-red: #b97a72;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background:
                radial-gradient(circle at 1px 1px, rgba(27,42,74,0.06) 1px, transparent 0) 0 0/22px 22px,
                linear-gradient(160deg, #f7f2e6 0%, #f2ece0 55%, #eee7d9 100%);
            color: var(--ink);
            margin: 0;
            padding: 32px 16px 40px;
            min-height: 100vh;
        }

        .calculator-container {
            background: var(--card);
            border: 1px solid rgba(27, 42, 74, 0.08);
            border-radius: 6px;
            box-shadow: 0 24px 48px rgba(27, 42, 74, 0.12), 0 2px 0 var(--gold);
            width: 100%;
            max-width: 460px;
            padding: 36px 32px 28px;
            margin: 0 auto;
            position: relative;
        }

        .calculator-container::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(169, 129, 47, 0.25);
            border-radius: 3px;
            pointer-events: none;
        }

        .calculator-header {
            margin-bottom: 26px;
            text-align: center;
        }

        .eyebrow {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h2 {
            font-family: 'Noto Serif KR', serif;
            margin: 0 0 10px;
            font-size: 25px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .rule {
            width: 48px;
            height: 3px;
            background: var(--gold);
            margin: 0 auto 14px;
            border-radius: 2px;
        }

        .header-subtitle {
            margin: 0;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.6;
        }

        .ledger {
            padding: 0;
            margin-bottom: 26px;
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 6px;
        }

        /* 0행: 블록 제목 (날짜구간 날짜계산) */
        .ledger-block-title {
            padding: 11px 10px 9px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--line);
            background: rgba(169, 129, 47, 0.06);
        }

        /* 1행: 제목행 (접수일 | 구분 | 실행일) */
        .ledger-title-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            padding: 10px 6px 8px;
            border-bottom: 1px dashed var(--line);
            background: rgba(169, 129, 47, 0.04);
        }

        .ledger-title-cell {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.04em;
        }

        .ledger-title-divider {
            color: var(--line);
            font-size: 13px;
            user-select: none;
            padding: 0 4px;
        }

        /* 2행: 날짜선택행 (접수일 날짜입력 | ~ | 실행일 날짜입력) */
        .ledger-date-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            padding: 10px 6px;
        }

        .ledger-date-cell {
            min-width: 0;
        }

        .ledger-date-cell input[type="text"] {
            width: 100%;
            text-align: center;
            padding: 6px 2px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Noto Serif KR', serif;
            color: var(--ink);
            border: none;
            border-bottom: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .ledger-date-cell input[type="text"]::placeholder {
            font-family: 'Pretendard', sans-serif;
            font-weight: 400;
            color: #b7ae9a;
            font-size: 13px;
        }

        .ledger-date-cell input[type="text"]:focus {
            outline: none;
            border-bottom-color: var(--gold);
        }

        .ledger-date-divider {
            color: var(--line);
            font-size: 14px;
            user-select: none;
            padding: 0 4px;
        }

        #startDate {
            color: var(--receipt-blue);
        }

        #endDate {
            color: var(--exec-red);
        }

        /* --- 결과 테이블 : 영업일 / 단순일수 / 제외일수 --- */
        .result-table-wrap {
            padding: 10px 14px 8px;
            background: transparent;
            border-top: 1px solid var(--line);
            border-radius: 0;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .result-table th {
            padding: 0 4px 9px;
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.02em;
            text-align: center;
            border-bottom: 1px solid var(--line);
        }

        .result-table td {
            padding: 8px 4px 2px;
            text-align: center;
            font-family: 'Noto Serif KR', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .result-table th + th,
        .result-table td + td {
            border-left: 1px dashed var(--line);
        }

        .result-table td.hero {
            color: var(--gold);
            font-size: 28px;
        }

        .result-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 8px 4px 4px;
            width: 100%;
        }

        .ledger-result-row {
            padding: 6px 2px;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .result-item.plain {
            align-items: flex-start;
            flex: 1;
        }

        .result-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.03em;
        }

        .result-label small {
            font-weight: 500;
            color: #9a9480;
            font-size: 10px;
        }

        #totalDays {
            font-family: 'Noto Serif KR', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        /* --- 실행일 기준 접수가능일 빠른 계산 (신규) --- */
        .quick-calc {
            margin-bottom: 20px;
            padding: 14px 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(169, 129, 47, 0.04);
        }

        .quick-calc-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.06em;
            margin-bottom: 10px;
            text-align: center;
        }

        .quick-calc-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quick-calc-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 0;
            min-width: 0;
        }

        .quick-calc-col label {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink-soft);
            text-align: center;
        }

        /* 역산 영역: 실행일 라벨 + 선택기를 한 행로 배치 */
        .qc-exec-wrap {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: stretch;
            gap: 10px;
            margin-bottom: 10px;
        }

        .qc-exec-label {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            background: rgba(169, 129, 47, 0.10);
            border: 1px solid rgba(169, 129, 47, 0.32);
            border-radius: 4px;
            letter-spacing: 0.04em;
            white-space: nowrap;
            word-break: keep-all;
            user-select: none;
        }

        /* 3) 결과 테이블 (하단 배치, 1개 행) */
        .qc-result-table-wrap {
            margin-top: 14px;
            padding: 12px 14px 10px;
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 6px;
        }

        .qc-result-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .qc-result-table td {
            padding: 4px;
            height: 30px;
            vertical-align: middle;
            text-align: center;
            font-family: 'Noto Serif KR', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--receipt-blue);
            font-variant-numeric: tabular-nums;
        }

        .qc-result-table td.qc-result-label-cell {
            padding: 4px;
            height: 30px;
            vertical-align: middle;
            border-top: 1px solid var(--line);
        }

        .qc-result-label-cell span {
            font-family: 'Pretendard', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.02em;
        }

        .quick-calc-date-display {
            width: 100%;
            text-align: center;
            padding: 7px 4px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Noto Serif KR', serif;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 4px;
            cursor: pointer;
            white-space: normal;
            word-break: keep-all;
            line-height: 1.3;
            transition: border-color 0.2s, background 0.2s;
        }

        .quick-calc-date-display:not(.placeholder):hover {
            border-color: var(--gold);
            background: #ffffff;
        }

        .quick-calc-date-display.placeholder {
            font-family: 'Pretendard', sans-serif;
            font-weight: 400;
            color: #b7ae9a;
        }

        .quick-calc-picker-wrap {
            display: grid;
            width: 100%;
        }

        /* 실제 flatpickr 입력과 보이는 텍스트(줄바꿈 포함)를 같은 grid 셀에 겹쳐서
           position:absolute 없이 flatpickr의 위치 계산이 어긋나지 않도록 한다 */
        .quick-calc-picker-wrap > * {
            grid-area: 1 / 1;
        }

        /* 날짜 표시용 레이어가 실제 flatpickr 입력의 클릭을 가로채지 않도록 한다. */
        .quick-calc-picker-wrap .quick-calc-date-display {
            pointer-events: none;
        }

        .quick-calc-picker-wrap input[type="text"] {
            width: 100%;
            height: 100%;
            opacity: 0;
            border: 0;
            padding: 0;
            margin: 0;
            background: transparent;
            cursor: pointer;
        }

        /* --- 구간별 필렛 + 날짜 카드 --- */
        .qc-range-group + .qc-range-group {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--line);
        }

        .qc-range-head {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .qc-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 24px;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--gold);
            background: rgba(169, 129, 47, 0.10);
            border: 1px solid rgba(169, 129, 47, 0.32);
            border-radius: 999px;
        }

        .qc-pill.biz,
        .qc-pill.mid,
        .qc-pill.end { background: rgba(169, 129, 47, 0.10); }

        .qc-range-caption {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        /* 구간 바 */
        .qc-range {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        .qc-value-badge {
            display: inline-block;
            font-family: 'Noto Serif KR', serif;
            font-size: 15.5px;
            font-weight: 700;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
            word-break: keep-all;
        }

        .qc-value-badge.empty {
            color: #b7ae9a;
            font-family: 'Pretendard', sans-serif;
            font-weight: 500;
            font-size: 12.5px;
        }

        .qc-range-item {
            flex: 1 1 0;
            min-width: 0;
            text-align: center;
        }

        .qc-range-item strong {
            display: block;
            font-family: 'Noto Serif KR', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* 계산된 날짜가 휴일(주말/공휴일)이면 빨간색으로 경고 */
        .qc-range-item strong.is-holiday { color: var(--stamp); }

        /* 휴일 이름 표시 */
        .qc-holiday-name {
            display: block;
            font-family: 'Pretendard', sans-serif;
            font-size: 10.5px;
            font-weight: 600;
            line-height: 1.3;
            color: var(--stamp);
            margin-top: 2px;
        }

        .qc-holiday-name:empty { display: none; }

        /* 기준 미달 안내 문구 */
        .qc-missing {
            display: block;
            font-family: 'Pretendard', sans-serif;
            font-size: 10.5px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--stamp);
            margin-top: 3px;
        }

        .qc-missing:empty { display: none; }

        .qc-range-arrow {
            flex: 0 0 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 특수문자 대신 CSS로 그린 양방향 구간 표시선 */
        .qc-range-arrow .range-line {
            display: block;
            width: 38px;
            height: 1px;
            background: var(--gold);
            position: relative;
        }

        .qc-range-arrow .range-line::before,
        .qc-range-arrow .range-line::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 7px;
            height: 7px;
            border-top: 1.5px solid var(--gold);
            border-bottom: 1.5px solid var(--gold);
            transform: translateY(-50%);
        }

        .qc-range-arrow .range-line::before {
            left: -1px;
            border-right: 1.5px solid var(--gold);
            transform: translateY(-50%) rotate(45deg);
        }

        .qc-range-arrow .range-line::after {
            right: -1px;
            border-left: 1.5px solid var(--gold);
            transform: translateY(-50%) rotate(45deg);
        }

        .qc-range-arrow .bar { width: 42px; height: 1px; background: var(--line); position: relative; }

        .qc-range-arrow .bar::before {
            content: "";
            position: absolute;
            left: 0;
            top: -3px;
            border: 3.5px solid transparent;
            border-right-color: var(--line);
        }

        .qc-range-arrow .bar::after {
            content: "";
            position: absolute;
            right: 0;
            top: -3px;
            border: 3.5px solid transparent;
            border-left-color: var(--line);
        }

        .qc-range-arrow span {
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.72);
        }

        .qc-range-arrow .sym {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
        }

        .quick-calc-hint {
            margin: 12px 2px 0;
            font-size: 11px;
            color: #8b8570;
            line-height: 1.6;
        }

        .quick-calc-buttons {
            display: none;
        }

        .day-select-btn {
            width: 100%;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            color: var(--ink-soft);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .day-select-btn:hover {
            border-color: var(--gold);
        }

        .day-select-btn.active {
            background: var(--ink);
            border-color: var(--ink);
            color: #ffffff;
        }

        .quick-calc-result {
            width: 100%;
            text-align: center;
            padding: 8px 4px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Noto Serif KR', serif;
            color: var(--receipt-blue);
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--card);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }

        @media (max-width: 480px) {
            .quick-calc { padding: 12px 10px; }
            .qc-result-table td { font-size: 16px; }
            .qc-exec-label { padding: 0 9px; font-size: 12px; }
            .qc-pill { height: 22px; font-size: 11px; padding: 0 10px; }
            .qc-range-caption { font-size: 10.5px; }
            .qc-range-item strong { font-size: 13px; }
            .qc-range { padding: 9px 8px; gap: 5px; }
            .qc-range-arrow { flex-basis: 28px; }
            .qc-range-arrow .range-line { width: 24px; }
            .qc-range-arrow .bar { width: 22px; }
            .qc-range-arrow .sym { font-size: 14px; }
            .qc-holiday-name { font-size: 9.5px; }
        }

        .notice {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            font-size: 11.5px;
            color: #8b8570;
            line-height: 1.7;
        }

        .notice strong {
            color: var(--ink-soft);
            font-weight: 700;
        }

        .notice-list {
            margin-bottom: 12px;
        }

        .notice-row {
            text-align: left;
        }

        .notice-row strong {
            margin-right: 3px;
        }

        .notice-footnote {
            margin: 0;
            text-align: center;
        }

        /* --- 달력 스타일 커스텀 --- */
        /* body에 붙인 달력을 viewport 기준으로 고정 배치 */
        .flatpickr-calendar {
            position: fixed !important;
            z-index: 9999 !important;
        }

        .flatpickr-calendar .flatpickr-day { overflow: visible; }

        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            visibility: hidden !important;
        }

        .flatpickr-day.today,
        .flatpickr-day.today:hover {
            background: transparent !important;
            border: none !important;
            color: inherit !important;
        }

        .flatpickr-day:not(.selected):not(.startRange):not(.endRange):hover {
            background: var(--gold-soft) !important;
            border-color: var(--gold-soft) !important;
        }

        .flatpickr-day.selected,
        .flatpickr-day.startRange,
        .flatpickr-day.endRange,
        .flatpickr-day.selected:hover,
        .flatpickr-day.startRange:hover,
        .flatpickr-day.endRange:hover {
            background: var(--ink) !important;
            border-color: var(--ink) !important;
            color: #ffffff !important;
            font-weight: bold;
        }

        .flatpickr-day {
            position: relative;
        }

        .flatpickr-day.sat {
            color: var(--sat) !important;
        }
        .flatpickr-day.sun,
        .flatpickr-day.holiday {
            color: var(--stamp) !important;
        }

        .flatpickr-day.sat.selected,
        .flatpickr-day.sun.selected,
        .flatpickr-day.holiday.selected {
            color: #ffffff !important;
        }

        .flatpickr-day .holiday-label {
            position: absolute;
            left: 50%;
            bottom: 1px;
            transform: translateX(-50%);
            width: 100%;
            font-size: 10px;
            line-height: 1.1;
            color: var(--stamp);
            font-weight: 600;
            text-align: center;
            pointer-events: none;
        }

        .flatpickr-calendar {
            max-width: min(100vw - 24px, 360px);
            border-radius: 8px !important;
            box-shadow: 0 16px 32px rgba(27,42,74,0.18) !important;
        }

        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-current-month input.cur-year {
            font-weight: 700;
        }

        @media (max-width: 480px) {
            body { padding: 20px 10px 28px; }

            .calculator-container {
                padding: 28px 20px 22px;
            }

            h2 { font-size: 21px; }

            .ledger-title-row {
                padding: 8px 4px 6px;

    <!-- Flatpickr JS -->

    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script>
        const holidayData = {};

        async function fetchHolidayData(startYear, endYear) {
            const fetchPromises = [];
            for (let year = startYear; year <= endYear; year++) {
                const url = `https://date.nager.at/api/v3/PublicHolidays/${year}/KR`;
                fetchPromises.push(
                    fetch(url)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`Nager.Date API error: ${response.status} ${response.statusText}`);
                            }
                            return response.json();
                        })
                        .then(items => {
                            if (Array.isArray(items)) {
                                items.forEach(item => {
                                    if (item && item.date) {
                                        holidayData[item.date] = item.localName || item.name || '공휴일';
                                    }
                                });
                            }
                        })
                );
            }
            await Promise.all(fetchPromises);
        }

        function getHolidayLabel(dateString) {
            return holidayData[dateString] || '';
        }

        function isHoliday(dateStr) {
            return !!holidayData[dateStr];
        }

        // 공휴일 키 조작용 (4자리 연도)
        function toFullDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 화면 표시용 (2자리 연도)
        function toDateString(date) {
            const year = String(date.getFullYear()).slice(-2);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];

        function toDateStringWithWeekday(date) {
            return `${toDateString(date)} (${WEEKDAY_KO[date.getDay()]})`;
        }

        // 달력을 입력창 아래에 붙이고, 화면 밖으로 나가지 않도록 viewport 안으로 보정한다
        function positionCalendar(calendarEl, inputEl) {
            if (!calendarEl || !inputEl) return;

            calendarEl.style.position = 'fixed';
            calendarEl.style.right = 'auto';
            calendarEl.style.bottom = 'auto';
            calendarEl.style.margin = '0';

            const margin = 8;
            const gap = 4;
            const inputRect = inputEl.getBoundingClientRect();
            const calWidth = calendarEl.offsetWidth;
            const calHeight = calendarEl.offsetHeight;
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            let left = inputRect.left;
            if (left + calWidth + margin > vw) left = vw - calWidth - margin;
            if (left < margin) left = margin;

            let top = inputRect.bottom + gap;
            if (top + calHeight + margin > vh) {
                const above = inputRect.top - calHeight - gap;
                top = above >= margin ? above : Math.max(margin, vh - calHeight - margin);
            }

            calendarEl.style.left = Math.round(left) + 'px';
            calendarEl.style.top = Math.round(top) + 'px';
        }

        // 실행일부터 거꾸로 영업일을 count 개 채우는 접수가능일을 찾는다 (실행일 포함, 접수가능일 제외)
        function findDateByBusinessDaysBack(endDate, count) {
            let cur = new Date(endDate.getTime());
            let remaining = count;
            while (remaining > 0) {
                const dayOfWeek = cur.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !isHoliday(toFullDateString(cur))) {
                    remaining--;
                    if (remaining === 0) break;
                }
                cur.setDate(cur.getDate() - 1);
            }
            cur.setDate(cur.getDate() - 1);
            return cur;
        }

        // 실행일부터 거꾸로 단순 일수(count)를 채우는 접수가능일을 찾는다 (실행일 포함, 접수가능일 제외)
        function findDateBySimpleDaysBack(endDate, count) {
            const cur = new Date(endDate.getTime());
            cur.setDate(cur.getDate() - count);
            return cur;
        }

        // 접수일로부터 정방향으로 단순 일수(count) 뒤 날짜를 찾는다 (접수일 제외)
        function findDateBySimpleDaysForward(startDate, count) {
            const cur = new Date(startDate.getTime());
            cur.setDate(cur.getDate() + count);
            return cur;
        }

        // 접수일로부터 정방향으로 영업일 count 개 뒤 날짜를 찾는다 (접수일 제외)
        function findDateByBusinessDaysForward(startDate, count) {
            const cur = new Date(startDate.getTime());
            let remaining = count;
            while (remaining > 0) {
                cur.setDate(cur.getDate() + 1);
                const dayOfWeek = cur.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !isHoliday(toFullDateString(cur))) {
                    remaining--;
                }
            }
            return cur;
        }

        // 시작일 다음날부터 종료일까지의 영업일 수를 센다 (시작일 제외, 종료일 포함)
        function countBusinessDaysBetween(startDate, endDate) {
            if (!startDate || !endDate || startDate > endDate) return 0;

            let count = 0;
            const cur = new Date(startDate.getTime());
            while (cur < endDate) {
                cur.setDate(cur.getDate() + 1);
                const dayOfWeek = cur.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !isHoliday(toFullDateString(cur))) {
                    count++;
                }
            }
            return count;
        }

        // ==========================================================
        // [미사용] 접수 시작일을 영업일로 보정하는 헬퍼
        // ==========================================================
        // function adjustToBusinessDayOnOrAfter(date) {
        //     const cur = new Date(date.getTime());
        //     for (let i = 0; i < 15; i++) {
        //         const dayOfWeek = cur.getDay();
        //         if (dayOfWeek !== 0 && dayOfWeek !== 6 && !isHoliday(toDateString(cur))) {
        //             return cur;
        //         }
        //         cur.setDate(cur.getDate() + 1);
        //     }
        //     return cur;
        // }

        // 접수일자는 제외하고 계산 (start 다음 날 ~ end 구간을 카운트)
        function calculateBusinessDays(startDate, endDate) {
            let start = new Date(startDate);
            let end = new Date(endDate);
            if (start > end) return { total: 0, business: 0, excluded: 0 };

            let totalDays = Math.round((end - start) / (1000 * 60 * 60 * 24));
            let businessDays = 0;
            let curDate = new Date(start.getTime());
            curDate.setDate(curDate.getDate() + 1);

            while (curDate <= end) {
                const dayOfWeek = curDate.getDay();
                const dateString = toFullDateString(curDate);
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !isHoliday(dateString)) {
                    businessDays++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return { total: totalDays, business: businessDays, excluded: totalDays - businessDays };
        }

        document.addEventListener('DOMContentLoaded', function() {
            const pickerConfig = {
                locale: "ko",
                dateFormat: "Y-m-d",
                disableMobile: true,
                // 달력을 body에 붙여 카드의 overflow/z-index 영향을 받지 않게 한다.
                // static:true는 입력 래퍼 내부에 달력을 넣으므로 모바일에서 잘릴 수 있다.
                appendTo: document.body,
                onClose: function(selectedDates, dateStr, instance) {
                    instance.calendarContainer.style.left = '';
                    instance.calendarContainer.style.top = '';
                },
                onOpen: function(selectedDates, dateStr, instance) {
                    // flatpickr 인스턴스의 실제 원본 입력 요소는 `input`이다.
                    const inputEl = instance.altInput || instance.input;
                    requestAnimationFrame(() => positionCalendar(instance.calendarContainer, inputEl));
                },
                onDayCreate: function(dObj, dStr, fp, dayElem) {
                    const date = dayElem.dateObj;
                    const dayOfWeek = date.getDay();

                    if (dayOfWeek === 6) dayElem.classList.add('sat');
                    else if (dayOfWeek === 0) dayElem.classList.add('sun');

                    if (dayOfWeek === 0 || dayOfWeek === 6) return;
                    const holidayName = getHolidayLabel(toFullDateString(date));
                    if (!holidayName) return;

                    dayElem.classList.add('holiday');
                    const labelElem = document.createElement('span');
                    labelElem.className = 'holiday-label';
                    labelElem.innerText = holidayName;
                    dayElem.appendChild(labelElem);
                },
                onChange: function() {
                    triggerCalculation();
                }
            };

            async function initializeCalendar() {
                // 공휴일 API 응답을 기다리느라 날짜 선택기 자체가 늦게 생성되지 않도록
                // 달력은 먼저 생성하고 공휴일 데이터는 백그라운드에서 보강한다.
                const startPicker = flatpickr("#startDate", {
                    ...pickerConfig,
                    defaultDate: "today"
                });

                const endPicker = flatpickr("#endDate", pickerConfig);

                const execPicker = flatpickr("#execDate", {
                    ...pickerConfig,
                    onChange: function(selectedDates) {
                        const displayEl = document.getElementById('execDateDisplay');
                        if (selectedDates[0]) {
                            displayEl.innerText = toDateStringWithWeekday(selectedDates[0]);
                            displayEl.classList.remove('placeholder');
                        }
                        triggerReceiptCalculation();
                    }
                });

                const rcptPicker = flatpickr("#rcptDate", {
                    ...pickerConfig,
                    onChange: function(selectedDates) {
                        const displayEl = document.getElementById('rcptDateDisplay');
                        if (selectedDates[0]) {
                            displayEl.innerText = toDateStringWithWeekday(selectedDates[0]);
                            displayEl.classList.remove('placeholder');
                        }
                        renderReceiptRange(document.getElementById('rcptDate').value);
                    }
                });

                const year = new Date().getFullYear();
                try {
                    await fetchHolidayData(year - 1, year + 2);
                    // 이미 열린 달력도 공휴일 표시를 즉시 반영한다.
                    [startPicker, endPicker, execPicker, rcptPicker].forEach(picker => picker.redraw());
                } catch (error) {
                    console.warn('Holiday fetch failed:', error);
                }
            }

            initializeCalendar();

            function triggerCalculation() {
                const startVal = document.getElementById('startDate').value;
                const endVal = document.getElementById('endDate').value;
                if (startVal && endVal) {
                    const result = calculateBusinessDays(startVal, endVal);
                    document.getElementById('totalDays').innerText = result.total;
                    document.getElementById('businessDays').innerText = result.business;
                    document.getElementById('excludedDays').innerText = result.excluded;
                } else {
                    document.getElementById('totalDays').innerText = '-';
                    document.getElementById('businessDays').innerText = '-';
                    document.getElementById('excludedDays').innerText = '-';
                }
            }

            // ==========================================================
            // [미사용] 영업일접수/휴일접수 토글 상태
            // ==========================================================
            // const bizFixApplied = { 1: false, 2: false, 3: false };

            // 구간 정의: 시작일/마감일 역산 함수 (순수 단순일수 + 영업일 역산)
            const rangeDefinitions = {
                s1: (d) => findDateBySimpleDaysBack(d, 60),
                e1: (d) => findDateByBusinessDaysBack(d, 10),
                s2: (d) => findDateBySimpleDaysBack(d, 45),
                e2: (d) => findDateByBusinessDaysBack(d, 30),
                s3: (d) => findDateBySimpleDaysBack(d, 60),
                e3: (d) => findDateByBusinessDaysBack(d, 30)
            };

            // ==========================================================
            // [미사용] 영업일 판정 함수
            // ==========================================================
            // function isBusinessDay(date) {
            //     const dow = date.getDay();
            //     return dow !== 0 && dow !== 6 && !isHoliday(toDateString(date));
            // }

            function renderMatrix(execVal) {
                const execDate = execVal ? new Date(execVal) : null;
                const results = {};

                Object.keys(rangeDefinitions).forEach(key => {
                    const date = execDate ? rangeDefinitions[key](execDate) : null;
                    results[key] = date;
                    const el = document.querySelector(`[data-range="${key}"]`);
                    el.innerText = date ? toDateStringWithWeekday(date) : '-';
                    // 주말/법정공휴일/대체공휴일이면 빨간색으로 표시
                    const nameEl = document.querySelector(`[data-hname="${key}"]`);
                    if (date) {
                        const dayOfWeek = date.getDay();
                        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                        const dateString = toFullDateString(date);
                        const holidayName = getHolidayLabel(dateString);
                        const isHolidayDate = !!holidayName;
                        el.classList.toggle('is-holiday', isWeekend || isHolidayDate);

                        // 휴일 이름 표시 (법정공휴일/대체공휴일만, 주말은 제외)
                        nameEl.innerText = holidayName || '';
                    } else {
                        el.classList.remove('is-holiday');
                        nameEl.innerText = '';
                    }
                });

                // 기준일이 마감일보다 늦으면 계산상 구간이 성립하지 않음
                const executionRangePairs = [['s1', 'e1'], ['s2', 'e2'], ['s3', 'e3']];
                executionRangePairs.forEach(([startKey, endKey]) => {
                    const startDate = results[startKey];
                    const endDate = results[endKey];
                    const startMissingEl = document.querySelector(`[data-emiss="${startKey}"]`);
                    const endMissingEl = document.querySelector(`[data-emiss="${endKey}"]`);

                    if (!startDate || !endDate) {
                        startMissingEl.innerText = '';
                        endMissingEl.innerText = '';
                        return;
                    }

                    if (startDate > endDate) {
                        startMissingEl.innerText = '구간 없음';
                        endMissingEl.innerText = '구간 없음';
                    } else {
                        startMissingEl.innerText = '';
                        endMissingEl.innerText = '';
                    }
                });

                // [미사용] 각 구간의 접수 가능 기간(일수) 계산
                /* ['1', '2', '3'].forEach(idx => {
                    const el = document.querySelector(`[data-span="${idx}"]`);
                    const start = results[`s${idx}`];
                    const end = results[`e${idx}`];
                    if (!start || !end) {
                        el.innerText = '-';
                        return;
                    }
                    const days = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
                    el.innerText = `${days}일`;
                }); */

                // 접수가능일 시작이 영업일이 아니면 '영업일기준' 버튼 노출
                /* [미사용] 버튼 노출 로직 */
                /* ['1', '2', '3'].forEach(idx => {
                    const item = document.querySelector(`[data-start-item="${idx}"]`);
                    const btn = document.querySelector(`.qc-biz-toggle[data-fix="${idx}"]`);
                    const start = results[`s${idx}`];

                    if (!start) {
                        btn.hidden = true;
                        item.classList.remove('needs-fix');
                        return;
                    }

                    if (isBusinessDay(start) && !bizFixApplied[idx]) {
                        // 원래 시작일이 영업일이면 보정 불필요 → 버튼 숨김
                        btn.hidden = true;
                        item.classList.remove('needs-fix');
                        return;
                    }

                    // 영업일이 아닌 경우: 버튼을 항상 노출
                    // 버튼은 '클릭 시 전환될 기준'을 안내한다
                    //   - 현재 휴일접수(순수 단순일수) 표시 중: '영업일접수 보기' (금색)
                    //   - 현재 영업일접수(보정) 표시 중    : '휴일접수 보기'  (옅은 빨강)
                    btn.hidden = false;
                    item.classList.add('needs-fix');

                    if (bizFixApplied[idx]) {
                        btn.classList.add('active');
                        btn.innerText = '휴일접수 보기';
                    } else {
                        btn.classList.remove('active');
                        btn.innerText = '영업일접수 보기';
                    }
                }); */
            }

            // ==========================================================
            // [미사용] 토글 버튼 클릭 핸들러
            // ==========================================================
            // document.querySelectorAll('.qc-biz-toggle').forEach(btn => {
            //     btn.addEventListener('click', function() {
            //         const idx = this.dataset.fix;
            //         bizFixApplied[idx] = !bizFixApplied[idx];
            //         renderMatrix(document.getElementById('execDate').value);
            //     });
            // });

            let selectedMode = null;
            const dayButtons = document.querySelectorAll('.day-select-btn');
            dayButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    dayButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedMode = btn.dataset.mode;
                    triggerReceiptCalculation();
                });
            });

            function triggerReceiptCalculation() {
                const execVal = document.getElementById('execDate').value;
                const resultEl = document.getElementById('receiptDate');
                const labelEl = document.getElementById('receiptDateLabel');
                renderMatrix(execVal);
                if (!execVal || !selectedMode) {
                    resultEl.innerText = '-';
                    return;
                }
                const execDate = new Date(execVal);
                let receiptDate;
                let labelText = '까지 접수가능';
                if (selectedMode === 'biz30') {
                    receiptDate = findDateByBusinessDaysBack(execDate, 30);
                } else if (selectedMode === 'biz10') {
                    receiptDate = findDateByBusinessDaysBack(execDate, 10);
                } else if (selectedMode === 'simple45') {
                    receiptDate = findDateBySimpleDaysBack(execDate, 45);
                    labelText = '부터 접수가능';
                } else if (selectedMode === 'simple60') {
                    receiptDate = findDateBySimpleDaysBack(execDate, 60);
                    labelText = '부터 접수가능';
                }
                resultEl.innerText = toDateStringWithWeekday(receiptDate);
                labelEl.innerText = labelText;
            }

            // 접수일 기준: 좌 = 영업 30일, 우 = 단순 60/45일
            // 좌(영업 30일)가 우(단순 60/45일)보다 늦으면 계산상 기준 미달 → '구간 없음'
            const receiptRangeDefinitions = {
                r1: (d) => findDateByBusinessDaysForward(d, 30),
                r2: (d) => findDateBySimpleDaysForward(d, 60),
                r3: (d) => findDateByBusinessDaysForward(d, 30),
                r4: (d) => findDateBySimpleDaysForward(d, 45)
            };

            // 구간별 미달 문구 (좌 = 기준일, 우 = 마감일)
            const receiptMissingLabels = {
                r1: { left: '영업일 기준 미달', right: '60일 기준 미달' },
                r2: { left: '', right: '' },
                r3: { left: '영업일 기준 미달', right: '45일 기준 미달' },
                r4: { left: '', right: '' }
            };

            function renderReceiptRange(rcptVal) {
                const rcptDate = rcptVal ? new Date(rcptVal) : null;

                const results = {};

                Object.keys(receiptRangeDefinitions).forEach(key => {
                    const date = rcptDate ? receiptRangeDefinitions[key](rcptDate) : null;
                    results[key] = date;
                    const el = document.querySelector(`[data-rrange="${key}"]`);
                    const nameEl = document.querySelector(`[data-rhname="${key}"]`);
                    el.innerText = date ? toDateStringWithWeekday(date) : '-';

                    if (date) {
                        const dayOfWeek = date.getDay();
                        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                        const holidayName = getHolidayLabel(toFullDateString(date));
                        el.classList.toggle('is-holiday', isWeekend || !!holidayName);
                        nameEl.innerText = holidayName || '';
                    } else {
                        el.classList.remove('is-holiday');
                        nameEl.innerText = '';
                    }
                });

                // 기준 미달 판정 (접수일 제외 기준)
                //  - r1: 접수일 + 30영업일이 접수일 + 60일보다 늦으면 60일 기준 미달
                //  - r3: 접수일 + 30영업일이 접수일 + 45일보다 늦으면 45일 기준 미달
                const pairs = [
                    { bizKey: 'r1', simpleKey: 'r2', days: 60 },
                    { bizKey: 'r3', simpleKey: 'r4', days: 45 }
                ];

                pairs.forEach(({ bizKey, simpleKey, days }) => {
                    const bizDate = results[bizKey];
                    const simpleDate = results[simpleKey];
                    const bizMissEl = document.querySelector(`[data-rmiss="${bizKey}"]`);
                    const simpleMissEl = document.querySelector(`[data-rmiss="${simpleKey}"]`);

                    if (!bizDate || !simpleDate) {
                        bizMissEl.innerText = '';
                        simpleMissEl.innerText = '';
                        return;
                    }

                    // 단순일수 마감일까지 남은 영업일을 세어 30영업일에 못 미치면 기준 미달
                    const businessDaysUntilDeadline = countBusinessDaysBetween(rcptDate, simpleDate);
                    const isMissing = bizDate > simpleDate || businessDaysUntilDeadline < 30;

                    if (isMissing) {
                        bizMissEl.innerText = '영업일 기준 미달';
                        simpleMissEl.innerText = `${days}일 기준 미달`;
                        return;
                    }

                    bizMissEl.innerText = '';
                    simpleMissEl.innerText = '';
                });
            }

            // 초기 렌더: 실행일 선택 전에는 모든 값/버튼을 초기 상태로
            renderMatrix('');
            renderReceiptRange('');
        });
    </script>
