<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대출 업무용 영업일 날짜 계산기</title>
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e1e8ed;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #f4f7ff 0%, #f8fafc 45%, #eef4ff 100%);
            color: var(--text-color);
            margin: 0;
            padding: 24px 16px 32px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .calculator-container {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 500px;
            padding: 28px;
            box-sizing: border-box;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }

        .calculator-header {
            margin-bottom: 24px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
        }

        .header-subtitle {
            margin: 0;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fafbfc;
            transition: border-color 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .result-box {
            margin-top: 30px;
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        .result-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .result-value.total {
            color: #0056b3;
        }

        .notice {
            margin-top: 16px;
            font-size: 12px;
            color: #888;
            text-align: center;
            line-height: 1.4;
        }

        /* --- 달력 스타일 커스텀 --- */
        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            visibility: hidden !important;
        }

        .flatpickr-day.today,
        .flatpickr-day.today:hover {
            background: transparent !important;
            border: none !important;
            color: inherit !important;
        }

        .flatpickr-day:not(.selected):not(.startRange):not(.endRange):hover {
            background: #e9ecef !important;
            border-color: #e9ecef !important;
        }

        .flatpickr-day.selected,
        .flatpickr-day.startRange,
        .flatpickr-day.endRange,
        .flatpickr-day.selected:hover,
        .flatpickr-day.startRange:hover,
        .flatpickr-day.endRange:hover {
            background: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
            color: #ffffff !important;
            font-weight: bold;
        }

        .flatpickr-day {
            position: relative;
        }

        .flatpickr-day.sat {
            color: #0066cc !important;
        }
        .flatpickr-day.sun,
        .flatpickr-day.holiday {
            color: #e53935 !important;
        }

        .flatpickr-day.sat.selected,
        .flatpickr-day.sun.selected,
        .flatpickr-day.holiday.selected {
            color: #ffffff !important;
        }

        .flatpickr-day .holiday-label {
            position: absolute;
            left: 50%;
            bottom: 1px;
            transform: translateX(-50%);
            width: 100%;
            font-size: 10px;
            line-height: 1.1;
            color: #b91c1c;
            font-weight: 600;
            text-align: center;
            pointer-events: none;
        }

        .holiday-legend {
            margin-top: 18px;
            font-size: 13px;
            color: #475569;
            line-height: 1.6;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
        }

        .holiday-legend strong {
            display: block;
            margin-bottom: 6px;
            color: #e53935;
        }

        .holiday-legend span {
            display: inline-block;
            background: rgba(229, 57, 53, 0.08);
            color: #b91c1c;
            padding: 4px 8px;
            border-radius: 999px;
            font-weight: 600;
        }

        .flatpickr-calendar {
            max-width: min(100vw - 24px, 360px);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px 24px;
            }

            .calculator-container {
                padding: 20px 16px;
                border-radius: 16px;
            }

            h2 {
                font-size: 20px;
            }

            .result-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .result-value {
                font-size: 16px;
            }

            .flatpickr-day .holiday-label {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="calculator-header">
            <h2>대출 영업일 날짜 계산기</h2>
        </div>
        
        <div class="input-group">
            <label for="startDate">접수일</label>
            <input type="text" id="startDate" readonly placeholder="날짜를 선택하세요">
        </div>

        <div class="input-group">
            <label for="endDate">실행일</label>
            <input type="text" id="endDate" readonly placeholder="날짜를 선택하세요">
        </div>

        <div class="result-box">
            <div class="result-item">
                <span class="result-label">단순 날짜 차이</span>
                <span class="result-value total" id="totalDays">- 일</span>
            </div>
            <div class="result-item">
                <span class="result-label">영업일 기준 차이 (*휴일 제외)</span>
                <span class="result-value" id="businessDays">- 일</span>
            </div>
        </div>

        <div class="notice">
            * 휴일 [ 주말, 법정, 대체 공휴일을 영업일수에서 제외 ]<br>
            * 접수일을 제외한 날짜를 카운트합니다.<br>
        </div>


    </div>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script>
        const holidayData = {};

        async function fetchHolidayData(startYear, endYear) {
            const fetchPromises = [];
            for (let year = startYear; year <= endYear; year++) {
                const url = `https://date.nager.at/api/v3/PublicHolidays/${year}/KR`;
                fetchPromises.push(
                    fetch(url)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`Nager.Date API error: ${response.status} ${response.statusText}`);
                            }
                            return response.json();
                        })
                        .then(items => {
                            if (Array.isArray(items)) {
                                items.forEach(item => {
                                    if (item && item.date) {
                                        holidayData[item.date] = item.localName || item.name || '공휴일';
                                    }
                                });
                            }
                        })
                );
            }
            await Promise.all(fetchPromises);
        }

        function getHolidayLabel(dateString) {
            return holidayData[dateString] || '';
        }

        function isHoliday(dateStr) {
            return !!holidayData[dateStr];
        }

        function calculateBusinessDays(startDate, endDate) {
            let start = new Date(startDate);
            let end = new Date(endDate);
            if (start > end) return { total: 0, business: 0 };
            let totalDays = Math.round((end - start) / (1000 * 60 * 60 * 24));
            let businessDays = 0;
            let curDate = new Date(start.getTime());
            curDate.setDate(curDate.getDate() + 1);
            while (curDate <= end) {
                const dayOfWeek = curDate.getDay();
                const year = curDate.getFullYear();
                const month = String(curDate.getMonth() + 1).padStart(2, '0');
                const day = String(curDate.getDate()).padStart(2, '0');
                const dateString = `${year}-${month}-${day}`;
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !isHoliday(dateString)) {
                    businessDays++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return { total: totalDays, business: businessDays };
        }

        document.addEventListener('DOMContentLoaded', function() {
            const pickerConfig = {
                locale: "ko",
                dateFormat: "Y-m-d",
                disableMobile: true,
                onDayCreate: function(dObj, dStr, fp, dayElem) {
                    const date = dayElem.dateObj;
                    const dateString = fp.formatDate(date, "Y-m-d");
                    const dayOfWeek = date.getDay();

                    if (dayOfWeek === 6) dayElem.classList.add('sat');
                    else if (dayOfWeek === 0) dayElem.classList.add('sun');

                    if (isHoliday(dateString)) {
                        dayElem.classList.add('holiday');
                        const holidayLabel = getHolidayLabel(dateString);
                        if (holidayLabel) {
                            const labelElem = document.createElement('span');
                            labelElem.className = 'holiday-label';
                            labelElem.innerText = holidayLabel;
                            dayElem.appendChild(labelElem);
                        }
                    }
                },
                onChange: function() {
                    triggerCalculation();
                }
            };

            async function initializeCalendar() {
                const year = new Date().getFullYear();
                try {
                    await fetchHolidayData(year - 1, year + 2);
                } catch (error) {
                    console.warn('Google Calendar holiday fetch failed:', error);
                }

                flatpickr("#startDate", {
                    ...pickerConfig,
                    defaultDate: "today"
                });

                flatpickr("#endDate", pickerConfig);
            }

            initializeCalendar();

            function triggerCalculation() {
                const startVal = document.getElementById('startDate').value;
                const endVal = document.getElementById('endDate').value;
                if (startVal && endVal) {
                    const result = calculateBusinessDays(startVal, endVal);
                    document.getElementById('totalDays').innerText = result.total + " 일";
                    document.getElementById('businessDays').innerText = result.business + " 일";
                }
            }
        });
    </script>
</body>
</html>
