<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전세 DTI 계산</title>
  <style>
    /* 기본 글로벌 스타일 리셋 및 세련된 폰트 적용 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 20px 14px;
      display: flex;
      justify-content: center;
    }

    /* 메인 컨테이너 디자인 */
    .container {
      width: 100%;
      max-width: 400px; /* S24+ 뷰포트에 맞춘 최적화 크기 */
      background: #ffffff;
      padding: 21px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 12px -6px rgba(15, 23, 42, 0.08);
    }

    /* 상단 헤더/타이틀 영역 */
    /* 버튼 3개와 제목을 한 줄에 놓는다.
       예전에는 버튼을 position:absolute로 띄워놨는데, 버튼이 하나 늘자
       가운데 제목 글자를 덮어버렸다("전세 DTI 계산" → "세 DTI 계산").
       flex로 자리를 나눠 가지면 버튼 개수가 바뀌어도 겹치지 않는다. */
    .title {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      color: #0369a1;
      padding: 12px 12px;
      border-radius: 11px;
      font-weight: 800;
      border: 1px solid #bae6fd;
      transition: transform 0.2s;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title:active {
      transform: scale(0.98);
    }
    .title-left {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .title-text {
      flex: 1;
      text-align: center;
      /* 좁은 화면에서 버튼에 밀려 잘리지 않도록 글자를 살짝 줄인다 */
      font-size: clamp(14px, 4.2vw, 18px);
      white-space: nowrap;
    }

    /* 초기화 버튼 스타일 (빨간색 테마로 변경) */
    .reset-btn-left {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(220, 38, 38, 0.5);
      background: rgba(254, 226, 226, 0.8);
      color: #dc2626;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .reset-btn-left:active {
      transform: scale(0.95);
      background: rgba(254, 226, 226, 1);
    }
    .reset-btn-left:hover {
      background: rgba(254, 226, 226, 1);
      border-color: #dc2626;
    }

    /* 전환비율 설정 열기.
       기존에는 이 버튼이 없어서 설정 팝업(카드/건보/연금/전월세 비율)에
       들어갈 방법이 아예 없었다 - 기능은 살아있는데 UI만 빠져 있었다. */
    .settings-btn {
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      border: 1px solid rgba(3, 105, 161, 0.5);
      background: rgba(224, 242, 254, 0.8);
      color: #0369a1;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .settings-btn:active {
      transform: scale(0.95);
      background: rgba(224, 242, 254, 1);
    }
    .settings-btn:hover {
      background: rgba(224, 242, 254, 1);
      border-color: #0369a1;
    }

    /* 신용점수 버튼 스타일 (오른쪽 아래) */
    .credit-score-btn {
      flex-shrink: 0;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(3, 105, 161, 0.5);
      background: rgba(224, 242, 254, 0.8);
      color: #0369a1;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .credit-score-btn:active {
      transform: scale(0.95);
      background: rgba(224, 242, 254, 1);
    }
    .credit-score-btn:hover {
      background: rgba(224, 242, 254, 1);
      border-color: #0369a1;
    }

    /* 입력 폼 필드 스타일 - 구분을 더 선명하게 보정 */
    .input-box {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #94a3b8; /* 흐릿한 선에서 확실하고 선명한 테두리로 변경 */
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: #2563eb; /* 포커스 시 더 짙고 명확한 블루 */
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .input-box label {
      background: #e2e8f0; /* 배경을 좀 더 어둡게 하여 흰색 입력창과 완벽 분리 */
      color: #334155;
      font-weight: 700;
      font-size: 13px;
      width: 84px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      border-right: 1px solid #94a3b8; /* 라벨과 인풋창 사이의 수직 구분선 추가 */
      transition: background 0.2s;
    }
    .input-box label:active {
      background: #cbd5e1;
    }

    /* 라벨을 누르면 값이 지워진다는 힌트.
       글자 흐름에 넣으면 '대출 금액 ×'가 84px 라벨을 넘겨 두 줄로 접히므로,
       글자와 무관한 모서리에 띄워 배치한다. */
    .input-box label[onclick] {
      position: relative;
      white-space: nowrap;
    }
    .input-box label[onclick]::after {
      content: "×";
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .input-box.has-value label[onclick]::after {
      opacity: 0.5;
    }

    .input-box input {
      flex: 1;
      padding: 12px 10px;
      text-align: right;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      background: #ffffff;
    }
    /* 자동 계산창(Readonly)의 구분감 확실하게 변경 */
    .input-box input[readonly] {
      background: #f1f5f9; /* 어두운 톤으로 변경하여 입력 불가함을 명시 */
      color: #334155;
    }

    /* 하단 연사용액/환산금액 커스텀 디자인 (블루 영역 테두리 극대화) */
    .input-box.blue {
      border-color: #0284c7; /* 테두리 자체를 블루로 둘러서 확실히 구분 */
      border-width: 1.5px;
    }
    .input-box.blue label {
      background: #e0f2fe;
      color: #0369a1;
      border-right: 1px solid #0284c7;
    }
    .input-box.blue input {
      color: #0284c7;
      font-weight: 700;
    }

    /* 탭/버튼 그룹 스타일 */
    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin: 15px 0;
    }

    .button-group button {
      flex: 1;
      padding: 10px 2px;
      font-weight: 700;
      font-size: clamp(10px, 3.2vw, 13px);
      white-space: nowrap;
      border: 1px solid rgba(15, 23, 42, 0.08); /* 버튼 윤곽선 추가 */
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* 각 버튼별 컬러 셋 */
    .카드버튼 { background: #e0e7ff; color: #4338ca; }
    .건보버튼 { background: #f1f5f9; color: #475569; }
    .연금버튼 { background: #d1fae5; color: #065f46; }
    .전월세버튼 { background: #f3e8ff; color: #6b21a8; }
    .주신보 { background: #fef9c3; color: #854d0e; }

    /* 활성화 / 비활성화 애니메이션 효과 */
    .activeButton {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      outline: 2px solid currentColor;
      opacity: 1 !important;
      z-index: 2;
    }

    .inactiveButton {
      opacity: 0.35;
      transform: scale(0.96);
    }

    /* 팝업 모달창 스타일 */
    .popup-container {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .popup-content {
      background-color: #ffffff;
      padding: 15px;
      border: none;
      width: 100%;
      max-width: 400px;
      border-radius: 14px;
      box-sizing: border-box;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .popup-content img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }

    /* 설정 테이블 디자인 선명도 대폭 향상 */
    .popup-content table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: center;
      table-layout: fixed;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #94a3b8; /* 외부 마감선 선명화 */
    }

    .popup-content td {
      border-bottom: 1px solid #cbd5e1; /* 그리드 라인 선명화 */
      border-right: 1px solid #cbd5e1;
      padding: 8px 5px;
      font-size: 13px;
    }
    .popup-content tr:first-child td {
      background: #e2e8f0; /* 헤더 대비 확실하게 어둡게 변경 */
      font-weight: 800;
      color: #1e293b;
      border-bottom: 1px solid #94a3b8; /* 헤더 하단 굵은 구분선 */
    }
    .popup-content tr:last-child td {
      border-bottom: none;
    }
    .popup-content td:last-child {
      border-right: none;
    }

    .popup-content input {
      width: 100%;
      padding: 6px 4px;
      border: 1px solid #94a3b8; /* 내부 인풋창 테두리 선명화 */
      border-radius: 5px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      background: #ffffff;
    }
    .popup-content input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .popup-hint {
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.5;
      color: #64748b;
      text-align: center;
    }
  </style>

<script>
  "use strict";

  let selectedType = "";

  const $ = (id) => document.getElementById(id);

  /* 소득 환산 방식별 설정을 한 곳에 모았다.
     기존에는 updateFields()와 updateConversionAmount() 두 함수에 똑같은 5갈래 분기가
     각각 들어 있어서, 비율 하나를 고치려면 양쪽을 같이 손봐야 했다. */
  const 방식설정 = {
    카드사용액: {
      비율id: "카드전환비율", 기본비율: 40.9, 라벨: "연 사용액", 버튼: ".카드버튼",
      수식: (r) => `연 사용액 ÷ ${r}% × 90%`,
      환산: (v, r) => (v / (r / 100)) * 0.9, 소득반영: true
    },
    건강보험: {
      비율id: "건보전환비율", 기본비율: 3.595, 라벨: "평균 금액", 버튼: ".건보버튼",
      수식: (r) => `3개월 평균 ÷ ${r}% × 12 × 95%`,
      환산: (v, r) => (v / (r / 100)) * 12 * 0.95, 소득반영: true
    },
    연금납부: {
      비율id: "연금전환비율", 기본비율: 9.5, 라벨: "평균 금액", 버튼: ".연금버튼",
      수식: (r) => `3개월 평균 ÷ ${r}% × 12 × 95%`,
      환산: (v, r) => (v / (r / 100)) * 12 * 0.95, 소득반영: true
    },
    전월세: {
      비율id: "전월세전환비율", 기본비율: 6.4, 라벨: "1년 월세", 버튼: ".전월세버튼",
      수식: (r) => `HF,HUG 전환율 ${r}% + 보증금`,
      환산: (v, r) => v / (r / 100), 소득반영: false
    },
    주신보: {
      비율id: null, 기본비율: null, 라벨: "연소득", 버튼: ".주신보",
      수식: () => "연소득 × 3.5 ÷ 90% × 110% / 120%",
      환산: null, 소득반영: false // 110%/120% 두 값을 함께 보여줘야 해서 별도 처리
    }
  };

  const 설정_IDS = ["카드전환비율", "건보전환비율", "연금전환비율", "전월세전환비율"];
  const 소득상한 = 50000000; // 환산소득으로 인정하는 최대 연소득

  // 설정 팝업에 값을 넣지 않았으면 기본비율을 쓴다(빈칸·0·문자 모두 기본값으로 떨어짐)
  function 비율읽기(type) {
    const cfg = 방식설정[type];
    if (!cfg || !cfg.비율id) return null;
    const el = $(cfg.비율id);
    return parseFloat(el && el.value) || cfg.기본비율;
  }

  function 저장(key, value) {
    localStorage.setItem(`main_${key}`, value);
  }

  function formatNumber(input) {
    let value = input.value.replace(/,/g, '');
    if (!isNaN(value) && value !== '') {
      input.value = parseInt(value).toLocaleString();
    }
  }

  function formatPercentage(input) {
    let value = input.value.replace('%', '');
    const regex = /^\d{0,2}(\.\d{0,2})?$/;
    if (value === '' || regex.test(value)) {
      input.value = value + '%';
      input.dataset.previousValidValue = input.value;
    } else {
      input.value = input.dataset.previousValidValue || '';
    }
    if (input.value === '%') input.value = '';
  }

  function handlePercentageBackspace(input, event) {
    if (event.keyCode === 8) {
      let value = input.value;
      let caretPosition = input.selectionStart;
      if (caretPosition > 0 && caretPosition === value.length && value.endsWith('%')) {
        input.value = value.slice(0, -1);
        input.selectionStart = caretPosition - 1;
        input.selectionEnd = caretPosition - 1;
        event.preventDefault();
      }
    }
  }

  function 월납부액계산() {
    let 대출금액 = $("대출금액").value.replace(/,/g, '');
    let 대출금리 = $("대출금리").value.replace('%', '');
    if (대출금액 && 대출금리 && !isNaN(대출금액) && !isNaN(대출금리)) {
      let 월상환액 = (대출금액 * (parseFloat(대출금리) / 100)) / 12;
      $("월상환액").value = parseInt(월상환액).toLocaleString();
      calculateDTI();
    } else {
      $("월상환액").value = "";
      $("DTI").value = "";
      calculateDTI(); // DTI 칸의 경고 스타일까지 확실히 풀어준다
    }
  }

  function calculateDTI() {
    let 월상환액 = $("월상환액").value.replace(/,/g, '') || 0;
    let 부채금액 = $("부채금액").value.replace(/,/g, '') || 0;
    let 부채금리 = $("부채금리").value.replace('%', '') || 0;
    let 연소득 = $("연소득").value.replace(/,/g, '') || 0;
    let 부채상환액 = (parseFloat(부채금액) * parseFloat(부채금리)) / 1200;
    let 총월부채상환액 = parseFloat(월상환액) + 부채상환액;
    let 월소득 = parseFloat(연소득) / 12;

    /* 연소득이 비었거나 0이면 월소득이 0이 되어 DTI가 Infinity가 된다.
       Infinity는 isNaN을 통과해버려서, 예전에는 화면에 'Infinity%'가 붉게 찍혔다.
       0으로 나누는 경우를 먼저 걸러내고, 유한한 값일 때만 표시한다. */
    let DTI = 월소득 > 0 ? (총월부채상환액 / 월소득) * 100 : NaN;

    let dtiField = $("DTI");
    let dtiContainer = dtiField.parentElement;

    if (Number.isFinite(DTI)) {
      dtiField.value = DTI.toFixed(2) + "%";
      if (DTI >= 40) {
        dtiField.style.color = "#ef4444";
        dtiField.style.fontWeight = "bold";
        dtiContainer.style.backgroundColor = "#fef2f2";
        dtiContainer.style.borderColor = "#ef4444";
        dtiContainer.style.borderWidth = "1.5px";
      } else {
        dtiField.style.color = "#1e293b";
        dtiField.style.fontWeight = "600";
        dtiContainer.style.backgroundColor = "#ffffff";
        dtiContainer.style.borderColor = "#94a3b8";
        dtiContainer.style.borderWidth = "1px";
      }
    } else {
      dtiField.value = "";
      dtiField.style.color = "#1e293b";
      dtiField.style.fontWeight = "normal";
      dtiContainer.style.backgroundColor = "#ffffff";
      dtiContainer.style.borderColor = "#94a3b8";
      dtiContainer.style.borderWidth = "1px";
    }
  }

  /* 화면 표시(라벨·수식·버튼 강조)만 바꾸고 입력값은 건드리지 않는다.
     재방문 복원에서 이 함수만 따로 부르기 위해 updateFields에서 떼어냈다.
     예전에는 이 둘이 붙어 있어서, 복원 때 부르면 입력값이 지워지고
     안 부르면 라벨·수식·버튼 강조가 통째로 빠지는 문제가 있었다. */
  function applyTypeUI(type) {
    const cfg = 방식설정[type];
    if (!cfg) return;
    selectedType = type;

    $("conversionFormula").value = cfg.수식(비율읽기(type));
    document.querySelector(".blue label").textContent = cfg.라벨;

    const buttons = document.querySelectorAll(".button-group button");
    buttons.forEach(btn => btn.classList.remove("activeButton", "inactiveButton"));
    document.querySelector(cfg.버튼).classList.add("activeButton");
    buttons.forEach(btn => {
      if (!btn.classList.contains("activeButton")) btn.classList.add("inactiveButton");
    });

    저장("selectedType", type);
  }

  // 버튼을 눌러 방식을 새로 고를 때: 이전 방식의 입력/결과를 비우고 UI를 갱신한다
  function updateFields(type) {
    $("annualUsage").value = "";
    $("conversionAmount").value = "";
    저장("annualUsage", "");
    applyTypeUI(type);
    updateConversionAmount();
    삭제힌트_전체갱신();
  }

  function updateConversionAmount() {
    const annualUsage = $("annualUsage").value.replace(/,/g, '');
    const conversionAmount = $("conversionAmount");
    const incomeField = $("연소득");

    if (!annualUsage || isNaN(annualUsage)) {
      conversionAmount.value = "";
      incomeField.value = "";
      저장("연소득", "");
      calculateDTI(); // 연소득을 지웠으니 DTI도 같이 정리 (예전에는 옛 DTI가 남아 있었다)
      삭제힌트_전체갱신();
      return;
    }

    const cfg = 방식설정[selectedType];
    if (!cfg) return;

    // 주신보만 110%/120% 두 값을 한 칸에 보여주므로 별도 처리
    if (selectedType === "주신보") {
      const 주신보110 = Math.floor(annualUsage * 3.5 / 0.9 * 1.1);
      const 주신보120 = Math.floor(annualUsage * 3.5 / 0.9 * 1.2);
      conversionAmount.value = 주신보110.toLocaleString() + " / " + 주신보120.toLocaleString();
      return;
    }

    const convertedValue = cfg.환산(annualUsage, 비율읽기(selectedType));
    conversionAmount.value = parseInt(convertedValue).toLocaleString();

    if (cfg.소득반영) {
      const incomeValue = Math.min(convertedValue, 소득상한);
      incomeField.value = parseInt(incomeValue).toLocaleString();
      저장("연소득", incomeField.value);
      calculateDTI();
      삭제힌트_전체갱신();
    }
  }

  function resetFields() {
    ["conversionAmount", "conversionFormula", "월상환액", "대출금액", "대출금리", "연소득", "부채금액", "부채금리", "DTI", "annualUsage"].forEach(id => {
      $(id).value = "";
    });
    $("conversionFormula").value = "계산할 방법 선택하세요";
    selectedType = "";
    document.querySelectorAll(".button-group button").forEach(btn => btn.classList.remove("activeButton", "inactiveButton"));

    let dtiContainer = $("DTI").parentElement;
    dtiContainer.style.backgroundColor = "#ffffff";
    dtiContainer.style.borderColor = "#94a3b8";
    dtiContainer.style.borderWidth = "1px";

    /* 저장된 값도 같이 비운다. 예전에는 화면만 지우고 localStorage는 그대로 둬서,
       초기화한 뒤 새로고침하면 지웠던 값이 되살아났다.
       전환비율 설정은 '입력값'이 아니라 사용자 설정이라 남긴다. */
    clearSessionStorageData();
    삭제힌트_전체갱신();
  }

  function clearInputField(inputId) {
    $(inputId).value = "";
    저장(inputId, "");
    if (inputId === "대출금액" || inputId === "대출금리") 월납부액계산();
    else calculateDTI();
    삭제힌트_전체갱신();
  }

  function setupPopupButton() {
    const popupContainer = $("imagePopup");
    const settingsPopupContainer = $("settingsPopup");

    $("showPopup").addEventListener("click", () => { popupContainer.style.display = "flex"; });
    $("showSettingsPopup").addEventListener("click", () => { settingsPopupContainer.style.display = "flex"; });

    window.addEventListener("click", event => {
      if (event.target === popupContainer) popupContainer.style.display = "none";
      if (event.target === settingsPopupContainer) settingsPopupContainer.style.display = "none";
    });
    // 배경을 정확히 눌러야만 닫히면 답답해서 ESC로도 닫히게 한다
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        popupContainer.style.display = "none";
        settingsPopupContainer.style.display = "none";
      }
    });
  }

  /* -------------------- 저장 / 복원 -------------------- */

  // 저장 대상: id가 있고 읽기전용이 아닌 입력창. 계산 결과(DTI/월상환액/환산금액)는
  // 저장하지 않고 복원 시 다시 계산한다.
  function 저장대상() {
    return [...document.querySelectorAll('input[type="text"], input[type="number"], textarea')]
      .filter(el => el.id && !el.hasAttribute('readonly'));
  }

  function loadAllInputs() {
    // 예전에는 전환비율을 접두사 없는 키에도 중복 저장했다. 한 번만 옮기고 지운다.
    for (const id of 설정_IDS) {
      const 옛값 = localStorage.getItem(id);
      if (옛값 !== null) {
        if (localStorage.getItem(`main_${id}`) === null) localStorage.setItem(`main_${id}`, 옛값);
        localStorage.removeItem(id);
      }
    }
    for (const input of 저장대상()) {
      const saved = localStorage.getItem(`main_${input.id}`);
      if (saved !== null) input.value = saved;
    }
  }

  // 초기화 버튼용 - 입력값만 비우고 전환비율 설정은 남긴다
  function clearSessionStorageData() {
    Object.keys(localStorage)
      .filter(key => key.startsWith('main_'))
      .filter(key => !설정_IDS.includes(key.slice(5)))
      .forEach(key => localStorage.removeItem(key));
  }

  // 전환비율 설정까지 포함해 전부 비운다 (index.html의 전체 초기화용)
  function clearAllStorageData() {
    Object.keys(localStorage)
      .filter(key => key.startsWith('main_'))
      .forEach(key => localStorage.removeItem(key));
  }

  /* 바뀐 칸 하나만 저장한다. 예전에는 글자 하나 칠 때마다 모든 입력창을 순회하며
     11개 키를 다시 썼고, 'input'과 'change' 양쪽에 걸려 있어 중복 저장까지 됐다. */
  function setupAutoSave() {
    for (const input of 저장대상()) {
      input.addEventListener('input', () => {
        저장(input.id, input.value);
        삭제힌트(input);
      });
    }
  }

  /* -------------------- 라벨 클릭 삭제 힌트 -------------------- */
  /* 라벨을 누르면 값이 지워지는데 예전에는 아무 표시가 없었다.
     값이 들어있을 때만 라벨에 ×를 흐리게 띄워 지울 수 있음을 알린다. */
  function 삭제힌트(input) {
    const box = input.closest('.input-box');
    if (box && box.querySelector('label[onclick]')) {
      box.classList.toggle('has-value', input.value.trim() !== '');
    }
  }

  function 삭제힌트_전체갱신() {
    document.querySelectorAll('.input-box label[onclick]').forEach(label => {
      const input = label.parentElement.querySelector('input');
      if (input) 삭제힌트(input);
    });
  }

  /* -------------------- 시작 -------------------- */

  document.addEventListener("DOMContentLoaded", () => {
    const savedType = localStorage.getItem('main_selectedType');

    setupPopupButton();
    loadAllInputs();
    setupAutoSave();

    if (savedType && 방식설정[savedType]) {
      // 재방문: 입력값은 그대로 두고 화면 상태(라벨/수식/버튼)만 되살린다
      applyTypeUI(savedType);
      // 연 사용액이 있을 때만 환산을 다시 돌린다.
      // 비어 있는데 부르면 직접 입력해둔 연소득까지 지워버린다.
      if ($("annualUsage").value.trim()) updateConversionAmount();
    } else {
      resetFields();
      updateFields("카드사용액");
    }

    // 계산 결과 칸(DTI/월상환액)은 저장하지 않으므로 여기서 다시 계산해 채운다.
    // 예전에는 이 호출이 없어서 재방문 시 두 칸이 계속 비어 있었다.
    월납부액계산();
    삭제힌트_전체갱신();
  });
</script>

</head>

<body>
  <div class="container">
    <div class="title">
      <div class="title-left">
        <button class="reset-btn-left" onclick="resetFields()">초기화</button>
        <button class="settings-btn" id="showSettingsPopup" title="전환비율 설정">설정</button>
      </div>
      <span class="title-text">전세 DTI 계산</span>
      <button class="credit-score-btn" id="showPopup">신용점수</button>
    </div>

    <div class="input-box"><label onclick="clearInputField('연소득')" title="눌러서 지우기">연 소득</label><input type="text" id="연소득" inputmode="numeric" oninput="formatNumber(this); calculateDTI();"></div>
    <div class="input-box"><label onclick="clearInputField('대출금액')" title="눌러서 지우기">대출 금액</label><input type="text" id="대출금액" inputmode="numeric" oninput="formatNumber(this); 월납부액계산();"></div>
    <div class="input-box"><label onclick="clearInputField('대출금리')" title="눌러서 지우기">대출 금리</label><input type="text" id="대출금리" inputmode="decimal" oninput="formatPercentage(this); 월납부액계산();" onkeydown="handlePercentageBackspace(this, event);"></div>
    <div class="input-box"><label onclick="clearInputField('부채금액')" title="눌러서 지우기">부채 금액</label><input type="text" id="부채금액" inputmode="numeric" oninput="formatNumber(this); calculateDTI();"></div>
    <div class="input-box"><label onclick="clearInputField('부채금리')" title="눌러서 지우기">부채 금리</label><input type="text" id="부채금리" inputmode="decimal" oninput="formatPercentage(this); calculateDTI();" onkeydown="handlePercentageBackspace(this, event);"></div>
    <div class="input-box"><label>DTI</label><input type="text" id="DTI" readonly></div>
    <div class="input-box"><label>월 상환액</label><input type="text" id="월상환액" readonly></div>

    <div class="button-group">
      <button class="카드버튼" onclick="updateFields('카드사용액')">카드</button>
      <button class="건보버튼" onclick="updateFields('건강보험')">건보</button>
      <button class="연금버튼" onclick="updateFields('연금납부')">연금</button>
      <button class="전월세버튼" onclick="updateFields('전월세')">전.월세</button>
      <button class="주신보" onclick="updateFields('주신보')">주신보</button>
    </div>

    <div class="input-box blue"><label>연 사용액</label><input type="text" inputmode="numeric" id="annualUsage" oninput="formatNumber(this); updateConversionAmount();"></div>
    <div class="input-box blue"><label>환산 금액</label><input type="text" id="conversionAmount" readonly></div>
    <div class="input-box">
      <label>환산 수식</label>
      <input
        type="text"
        id="conversionFormula"
        value="계산할 방법 선택하세요"
        style="text-align:center;font-weight: bold; width:100%; font-size:min(13px,3.2vw); overflow:auto;"
        readonly
      >
    </div>

    <div id="imagePopup" class="popup-container">
      <div class="popup-content">
        <img id="popupImg" src="신용점수기준.png" alt="신용점수 기준표">
      </div>
    </div>

    <div id="settingsPopup" class="popup-container">
      <div class="popup-content">
        <table>
          <tbody>
            <tr>
              <td>카드(%)</td>
              <td>건보(%)</td>
              <td>연금(%)</td>
              <td>전월세(%)</td>
            </tr>
            <tr>
              <!-- placeholder에 기본값을 그대로 적어둔다. 비워두면 어떤 비율이
                   적용 중인지 알 수 없어서, 예전에는 설정창을 열어도 '비율'이라고만 보였다. -->
              <td><input id="카드전환비율" type="number" placeholder="40.9"></td>
              <td><input id="건보전환비율" type="number" placeholder="3.595"></td>
              <td><input id="연금전환비율" type="number" placeholder="9.5"></td>
              <td><input id="전월세전환비율" type="number" placeholder="6.4"></td>
            </tr>
          </tbody>
        </table>
        <p class="popup-hint">비워두면 표시된 기본값이 적용됩니다. 배경을 누르거나 ESC로 닫습니다.</p>
      </div>
    </div>
  </div>
  <script>
    // 부모(index.html)에서 iframe 안의 이 화면을 통째로 초기화할 때 호출한다.
    // index.html:729 에서 frame.contentWindow.resetAllFields() 로 부르고 있으므로 지우면 안 된다.
    function resetAllFields() {
      resetFields();                 // 입력값·버튼 상태·저장값 초기화
      ['카드전환비율', '건보전환비율', '연금전환비율', '전월세전환비율'].forEach(id => {
        const field = document.getElementById(id);
        if (field) field.value = '';
      });
      clearAllStorageData();         // 전환비율 설정까지 전부 비운다
      updateConversionAmount();
    }
  </script>
</body>
</html>
