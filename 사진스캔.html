<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3355f5">
<title>사진 스캔 도우미</title>
<style>
:root{
  --primary:#3355f5;--primary-dark:#233ed6;--accent:#7c5cff;
  --ink:#0f1729;--muted:#64748b;--muted-2:#94a3b8;
  --line:#e7eaf3;--bg:#f2f4f9;--card:#fff;--surface-2:#eef1f8;
  --success:#12b76a;--success-bg:#e9f9f1;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --sh-sm:0 1px 2px rgba(15,23,42,.05);
  --sh-md:0 10px 26px rgba(20,30,60,.08);
  --sh-lg:0 18px 40px rgba(20,30,60,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
body{min-height:100vh}
button,label,input{font:inherit}
button{cursor:pointer}
button:active,.upload:active,label.upload:active{transform:scale(.975)}
.icon{width:1em;height:1em;display:block}
.app{width:100%;max-width:520px;margin:auto;min-height:100vh;background:var(--bg)}

/* ===== HEADER ===== */
.top{
  position:relative;overflow:hidden;color:#fff;padding:22px 18px 20px;
  padding-top:max(22px,env(safe-area-inset-top));border-radius:0 0 28px 28px;
  background:linear-gradient(150deg,var(--primary),var(--accent) 130%);
}
.top:before{
  content:"";position:absolute;inset:-40% -20% auto auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none;
}
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.logo-icon .icon{width:23px;height:23px}
.title{font-size:20px;font-weight:800;letter-spacing:-.4px}
.subtitle{font-size:12px;opacity:.85;margin-top:3px}

/* ===== LAYOUT / CARDS ===== */
main{padding:16px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-md)}
.card-title{font-size:14.5px;font-weight:800;letter-spacing:-.2px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* ===== 모드 선택 ===== */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.mode-btn .mode-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--primary);box-shadow:var(--sh-sm)}
.mode-btn .mode-icon .icon{width:26px;height:26px}
.mode-btn b{font-size:14px;font-weight:800}
.mode-btn span{font-size:11px;color:var(--muted);text-align:center}

/* 현재 모드 표시 + 변경 - 시작화면 맨 위에 얹어 언제든 모드를 바꿀 수 있게 한다 */
.mode-chip{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:999px;padding:6px 6px 6px 14px;margin-bottom:14px;font-size:12px;font-weight:800;color:var(--primary)}
.mode-chip button{background:#fff;border:0;border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:800;color:var(--muted);box-shadow:var(--sh-sm)}

/* ===== HOME: UPLOAD ===== */
.hero-buttons{display:grid;gap:10px}
.upload{
  display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);transition:transform .12s ease;
}
.upload.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:0;box-shadow:var(--sh-md)}
.upload-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#fff;color:var(--primary);flex:0 0 42px;box-shadow:var(--sh-sm)}
.upload-icon .icon{width:21px;height:21px}
.upload.primary .upload-icon{color:var(--primary)}
.upload b{display:block;font-size:14.5px;font-weight:800}
.upload span{font-size:11.5px;opacity:.8;display:block;margin-top:3px}
input[type=file]{display:none}

/* ===== WORKSPACE / PHOTO ===== */
#workspace{display:none}
.photo-viewport{max-height:56vh;overflow:auto;border-radius:var(--r-md);-webkit-overflow-scrolling:touch;padding:34px;background:var(--surface-2)}
.photo-box{position:relative;width:100%}
.canvas-clip{position:relative;background:#0d1526;border-radius:var(--r-md);overflow:hidden}
#sourceCanvas{width:100%;display:block}

.reselect-row{display:flex;gap:8px;margin-bottom:14px}
.reselect-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:999px;border:0;background:var(--surface-2);color:var(--primary);font-weight:800;font-size:12.5px}
.reselect-row button .icon{width:15px;height:15px}
.corner-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.toolbar-btn-group{display:flex;gap:8px;flex-wrap:wrap}
.toolbar-btn{display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;border:0;background:var(--surface-2);color:var(--primary);font-weight:800;font-size:12.5px}
.toolbar-btn .icon{width:15px;height:15px}
.zoom-controls{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface-2);border-radius:999px;padding:6px}
.zoom-controls button{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:#fff;color:var(--primary);box-shadow:var(--sh-sm)}
.zoom-controls button .icon{width:15px;height:15px}
.zoom-controls span{font-size:12px;font-weight:800;color:var(--muted);min-width:40px;text-align:center}

.manual-quad{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.manual-handles{position:absolute;inset:0;display:none}
.corner-marker{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--primary);border:1.5px solid #fff;box-shadow:0 1px 3px rgba(15,23,42,.45);pointer-events:none}
.corner-dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 3px 10px rgba(15,23,42,.35);touch-action:none;pointer-events:auto}
.edge-bar{position:absolute;background:#fff;border:3px solid var(--primary);box-shadow:0 3px 10px rgba(15,23,42,.35);touch-action:none;pointer-events:auto;border-radius:999px}
.edge-bar-h{width:34px;height:14px;margin:-7px 0 0 -17px}
.edge-bar-v{width:14px;height:34px;margin:-17px 0 0 -7px}

/* ===== 처리 파이프라인 표시 ===== */
.pipeline-card{background:var(--surface-2);border-radius:var(--r-md);padding:14px 10px 12px;margin-top:10px}
.pipeline{display:flex;align-items:flex-start}
.pl-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
.pl-dot{width:26px;height:26px;border-radius:50%;background:#dde3f2;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;transition:.25s}
.pl-label{font-size:9.5px;color:var(--muted-2);font-weight:700;white-space:nowrap}
.pl-line{flex:1 1 auto;height:2px;background:#dde3f2;margin:12px 2px 0;transition:.25s}
.pl-step.active .pl-dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(51,85,245,.18);animation:plPulse 1.2s ease-in-out infinite}
.pl-step.active .pl-label{color:var(--primary)}
.pl-step.complete .pl-dot{background:var(--success);color:#fff}
.pl-step.complete .pl-label{color:var(--success)}
.pl-step.complete + .pl-line{background:var(--success)}
@keyframes plPulse{0%,100%{box-shadow:0 0 0 4px rgba(51,85,245,.18)}50%{box-shadow:0 0 0 7px rgba(51,85,245,.08)}}
.pipeline-caption{margin-top:10px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.pipeline-caption.success{color:#0d8c56}

/* ===== 보정 미리보기 ===== */
.preview-card{background:var(--surface-2);border-radius:var(--r-md);padding:12px;text-align:center;margin-top:12px}
.preview-card img{max-width:100%;max-height:44vh;border-radius:6px;box-shadow:var(--sh-sm);background:#fff;display:inline-block}

/* ===== CONTROLS (색상/밝기/대비) ===== */
.segment{display:flex;flex:1;min-width:0;background:var(--surface-2);border-radius:12px;padding:3px;container-type:inline-size}
.segment button{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;border:0;background:transparent;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap;min-width:0}
.segment button{gap:clamp(3px,3.5cqw,6px);padding:clamp(6px,5cqw,9px) clamp(3px,5.6cqw,10px);font-size:clamp(9.5px,6.7cqw,12px)}
.segment button .icon{width:15px;height:15px;flex-shrink:0}
.segment button .icon{width:clamp(11px,8.5cqw,15px);height:clamp(11px,8.5cqw,15px)}
.segment button.active{background:#fff;color:var(--primary);box-shadow:var(--sh-sm)}
.ctrl-row{display:flex;align-items:center;gap:12px;margin:14px 0}
.ctrl-label{width:45px;font-size:12px;font-weight:700;color:var(--muted)}
.range{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;background:var(--surface-2);outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 2px 6px rgba(15,23,42,.25);cursor:pointer}
.range::-moz-range-track{height:6px;border-radius:999px;background:var(--surface-2)}
.range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 2px 6px rgba(15,23,42,.25);cursor:pointer}
.value{width:30px;text-align:right;font-size:11.5px;font-weight:700;color:var(--muted)}
.reset-btn{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.reset-btn .icon{width:12px;height:12px}
.reset-btn:active{background:var(--surface-2)}

/* ===== 페이지 목록 ===== */
#pagesCard{display:none}
.page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.page-thumb{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:3/4;cursor:pointer}
.page-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.page-thumb .page-num{position:absolute;left:5px;top:5px;background:rgba(15,23,42,.65);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px}
.page-thumb .page-del{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:rgba(15,23,42,.65);color:#fff;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.page-del .icon{width:12px;height:12px}
.page-add-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1.5px dashed #c7cfe8;border-radius:var(--r-sm);aspect-ratio:3/4;color:var(--primary);font-weight:800;font-size:11px;background:var(--surface-2)}
.page-add-tile .icon{width:18px;height:18px}

/* ===== BUTTONS ===== */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;container-type:inline-size}
.action{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:13px;white-space:nowrap;min-width:0}
.action{gap:clamp(4px,3.5cqw,7px);padding:clamp(9px,6.5cqw,13px);font-size:clamp(10.5px,6.5cqw,13px)}
.action .icon{width:16px;height:16px;flex-shrink:0}
.action .icon{width:clamp(12px,8cqw,16px);height:clamp(12px,8cqw,16px)}
.action.primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--sh-sm)}
.action.full{grid-column:1/-1}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.small-note{font-size:10.5px;color:var(--muted-2);line-height:1.6;margin-top:10px}

/* ===== BROWSER HINT ===== */
.browser-hint{display:none;align-items:center;gap:10px;background:#1f2a44;color:#fff;padding:10px 14px;font-size:12px;font-weight:600;line-height:1.4}
.browser-hint b{color:#8fb4ff}
.browser-hint-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.browser-hint-actions button{border:0;border-radius:8px;font-weight:800;cursor:pointer}
#openInChromeBtn{background:var(--primary);color:#fff;padding:7px 12px;font-size:12px;white-space:nowrap}
#dismissBrowserHint{background:transparent;color:#aab4c8;font-size:15px;padding:4px 6px}

/* ===== 인쇄 전용 영역 ===== */
#printArea{display:none}

@media(min-width:521px){body{padding:18px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(20,30,60,.16)}}
@media print{
  body{background:#fff!important;padding:0!important}
  .app{max-width:none;border-radius:0!important;box-shadow:none!important;overflow:visible!important}
  .top,main,.toast,#browserHintBar{display:none!important}
  #printArea{display:block!important}
  .print-page{width:210mm;height:297mm;padding:10mm;box-sizing:border-box;display:flex;align-items:center;justify-content:center;break-after:page;page-break-after:always}
  .print-page:last-child{break-after:auto;page-break-after:auto}
  .print-page img{max-width:100%;max-height:100%;object-fit:contain}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div class="app">
<div id="browserHintBar" class="browser-hint" style="display:none">
  <span>원활한 공유 기능을 위해 <b>크롬</b> 사용을 권장합니다.</span>
  <div class="browser-hint-actions">
    <button type="button" id="openInChromeBtn">크롬으로 열기</button>
    <button type="button" id="dismissBrowserHint" aria-label="닫기">✕</button>
  </div>
</div>
<header class="top">
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/>
          <path d="M8.5 13h7M8.5 16.5h7M8.5 9.5h3"/>
        </svg>
      </div>
      <div><div class="title">사진 스캔 도우미</div><div class="subtitle">신분증·문서 사진을 깔끔하게 정리해서 A4로 만들어보세요.</div></div>
    </div>
  </div>
</header>

<main>
<section class="card" id="modeCard">
  <div class="card-title">무엇을 스캔할까요?</div>
  <div class="mode-grid">
    <button type="button" class="mode-btn" id="modeIdCardBtn">
      <div class="mode-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8" cy="12" r="2.2"/><path d="M13 10.5h6M13 13.5h4"/>
        </svg>
      </div>
      <b>신분증</b>
      <span>실제 크기로 A4에 배치</span>
    </button>
    <button type="button" class="mode-btn" id="modeDocBtn">
      <div class="mode-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M8.5 13h7M8.5 16.5h7M8.5 9.5h3"/>
        </svg>
      </div>
      <b>문서</b>
      <span>A4에 꽉 차게 배치</span>
    </button>
  </div>
</section>

<section class="card" id="homeCard">
  <div class="mode-chip"><span id="modeIndicator">모드</span><button type="button" id="modeSwitchBtn">모드 변경</button></div>
  <div class="card-title" id="homeCardTitle">준비</div>
  <div class="hero-buttons">
    <label class="upload primary">
      <div class="upload-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h3l1.4-2h7.2L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
      </div>
      <div><b>카메라로 촬영하기</b><span id="cameraSubtitle">전체가 나오게 촬영해주세요.</span></div>
      <input id="camera" type="file" accept="image/*" capture="environment">
    </label>
    <label class="upload">
      <div class="upload-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2.5"/>
          <circle cx="8.5" cy="9.5" r="1.6"/>
          <path d="M21 15.5l-5.2-5-6 6"/>
        </svg>
      </div>
      <div><b>사진 선택하기</b><span>여러 장을 한 번에 선택할 수 있어요.</span></div>
      <input id="gallery" type="file" accept="image/*" multiple>
    </label>
  </div>
</section>

<section class="card" id="workspace">
  <div class="reselect-row">
    <button type="button" id="retakeBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h3l1.4-2h7.2L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
        <circle cx="12" cy="13" r="3.4"/>
      </svg>다시 촬영
    </button>
    <button type="button" id="reselectBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5l-5.2-5-6 6"/>
      </svg>다시 선택
    </button>
  </div>
  <div class="card-title" id="workspaceTitle">영역 조정</div>
  <div class="photo-viewport" id="photoViewport">
    <div class="photo-box" id="photoBox">
      <div class="canvas-clip">
        <canvas id="sourceCanvas"></canvas>
      </div>
      <svg id="manualQuad" class="manual-quad" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon id="manualPolygon" points="" fill="rgba(51,85,245,.16)" stroke="#5b9dff" stroke-width="1" vector-effect="non-scaling-stroke"></polygon>
      </svg>
      <div id="manualHandles" class="manual-handles">
        <div class="corner-marker" data-idx="0"></div>
        <div class="corner-marker" data-idx="1"></div>
        <div class="corner-marker" data-idx="2"></div>
        <div class="corner-marker" data-idx="3"></div>
        <div class="edge-bar edge-bar-h" data-edge="top"></div>
        <div class="edge-bar edge-bar-v" data-edge="right"></div>
        <div class="edge-bar edge-bar-h" data-edge="bottom"></div>
        <div class="edge-bar edge-bar-v" data-edge="left"></div>
        <div class="corner-dot" data-idx="0"></div>
        <div class="corner-dot" data-idx="1"></div>
        <div class="corner-dot" data-idx="2"></div>
        <div class="corner-dot" data-idx="3"></div>
      </div>
    </div>
  </div>
  <div class="corner-toolbar">
    <div class="toolbar-btn-group">

function whenOpenCVReady(){

function ensureCvReady(timeoutMs){
  if(whenOpenCVReady())return Promise.resolve(true);
  return new Promise(resolve=>{
    const start=Date.now();
    const timer=setInterval(()=>{
      if(whenOpenCVReady()){clearInterval(timer);resolve(true)}
      else if(Date.now()-start>timeoutMs){clearInterval(timer);resolve(false)}
    },100);
  });
}

async function loadMultipleFiles(files){

function drawSource(img){
  const max=1500, scale=Math.min(1,max/img.naturalWidth,max/img.naturalHeight);
  const c=$('sourceCanvas');
  c.width=Math.round(img.naturalWidth*scale);
  c.height=Math.round(img.naturalHeight*scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
}

/* =========================================================
   사각형(모서리) 자동 검출 - 신분증/문서 공통. 고정 비율에 기대는 대신
   "네 각이 직각에 가까운가(사각형다움)"로 점수를 매겨 둘 다 잘 잡는다.
========================================================= */
function orderPoints(pts){
  const sums=pts.map(p=>p.x+p.y);
  const diffs=pts.map(p=>p.y-p.x);
  const tl=pts[sums.indexOf(Math.min(...sums))];
  const br=pts[sums.indexOf(Math.max(...sums))];
  const tr=pts[diffs.indexOf(Math.min(...diffs))];
  const bl=pts[diffs.indexOf(Math.max(...diffs))];
  return [tl,tr,br,bl];
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function angleAt(p0,p1,p2){
  const v1={x:p0.x-p1.x,y:p0.y-p1.y}, v2={x:p2.x-p1.x,y:p2.y-p1.y};
  const dot=v1.x*v2.x+v1.y*v2.y;
  const mag=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y)||1;
  return Math.acos(Math.min(1,Math.max(-1,dot/mag)))*180/Math.PI;
}
function quadAngleScore(o){
  const angles=[
    angleAt(o[3],o[0],o[1]), angleAt(o[0],o[1],o[2]),
    angleAt(o[1],o[2],o[3]), angleAt(o[2],o[3],o[0])
  ];
  const dev=angles.reduce((s,a)=>s+Math.abs(a-90),0)/4;
  return Math.max(0, 1-dev/40);
}

function polygonToQuad(cnt){
  const peri=cv.arcLength(cnt, true);
  const approx=new cv.Mat();
  cv.approxPolyDP(cnt, approx, 0.02*peri, true);

  if(approx.rows===4){
    const pts=[];
    for(let j=0;j<4;j++) pts.push({x:approx.intPtr(j,0)[0], y:approx.intPtr(j,0)[1]});
    approx.delete();
    return pts;
  }
  approx.delete();

  const hull=new cv.Mat();
  cv.convexHull(cnt, hull);
  const hullPeri=cv.arcLength(hull, true);
  let quad=null;

  for(let eps=0.01; eps<=0.08; eps+=0.01){
    const a=new cv.Mat();
    cv.approxPolyDP(hull, a, eps*hullPeri, true);
    if(a.rows===4){
      quad=[];
      for(let j=0;j<4;j++) quad.push({x:a.intPtr(j,0)[0], y:a.intPtr(j,0)[1]});
      a.delete();
      break;
    }
    a.delete();
  }
  hull.delete();
  return quad;
}

function scoreQuad(pts, area, imgArea){
  const o=orderPoints(pts);
  const w1=distance(o[0],o[1]), w2=distance(o[3],o[2]);
  const h1=distance(o[0],o[3]), h2=distance(o[1],o[2]);

  if(Math.min(w1,w2,h1,h2)<10) return {o, score:-1};

  const diag1=distance(o[0],o[2]), diag2=distance(o[1],o[3]);
  if(Math.abs(diag1-diag2)/((diag1+diag2)/2) > 0.35) return {o, score:-1};

  const angleScore=quadAngleScore(o);
  const areaScore=Math.min(1, area/(imgArea*0.2));
  return {o, score:areaScore*0.4 + angleScore*0.6};
}

function detectPass(gray, dw, dh, detectScale, cannyLow, cannyHigh, kernelSize, blurSize){
  blurSize = blurSize || 5;
  const blur=new cv.Mat(), edge=new cv.Mat(), closed=new cv.Mat();
  const contours=new cv.MatVector(), hierarchy=new cv.Mat();

  cv.GaussianBlur(gray, blur, new cv.Size(blurSize,blurSize), 0, 0, cv.BORDER_DEFAULT);
  cv.Canny(blur, edge, cannyLow, cannyHigh);

  const kernel=cv.Mat.ones(kernelSize, kernelSize, cv.CV_8U);
  cv.morphologyEx(edge, closed, cv.MORPH_CLOSE, kernel);

  cv.findContours(closed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let best=null, bestScore=-1;
  const imgArea=dw*dh;

  for(let i=0; i<contours.size(); i++){
    const cnt=contours.get(i);
    const area=Math.abs(cv.contourArea(cnt));

    if(area>imgArea*0.03 && area<imgArea*0.97){
      const quad=polygonToQuad(cnt);
      if(quad){
        const scaled=quad.map(p=>({x:p.x/detectScale, y:p.y/detectScale}));
        const {o,score}=scoreQuad(scaled, area, imgArea);
        if(score>bestScore){ bestScore=score; best=o; }
      }
    }
    cnt.delete();
  }

  blur.delete(); edge.delete(); closed.delete(); kernel.delete();
  contours.delete(); hierarchy.delete();

  return {best, bestScore};
}

function refineCornersInRoi(src, approxCorners, padRatio){
  padRatio = padRatio || 0.12;
  try{
    const xs=approxCorners.map(p=>p.x), ys=approxCorners.map(p=>p.y);
    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const minY=Math.min(...ys), maxY=Math.max(...ys);
    const padX=(maxX-minX)*padRatio, padY=(maxY-minY)*padRatio;

    const rx=Math.max(0, Math.floor(minX-padX));
    const ry=Math.max(0, Math.floor(minY-padY));
    const rw=Math.min(src.cols-rx, Math.ceil(maxX-minX+padX*2));
    const rh=Math.min(src.rows-ry, Math.ceil(maxY-minY+padY*2));
    if(rw<60 || rh<60) return null;

    const roi=src.roi(new cv.Rect(rx, ry, rw, rh));
    const roiScale=Math.min(1, 1000/Math.max(rw, rh));
    const rdw=Math.round(rw*roiScale), rdh=Math.round(rh*roiScale);

    const roiSmall=new cv.Mat();
    cv.resize(roi, roiSmall, new cv.Size(rdw, rdh), 0, 0, cv.INTER_AREA);
    const roiGray=new cv.Mat();
    cv.cvtColor(roiSmall, roiGray, cv.COLOR_RGBA2GRAY);

    let {best, bestScore}=detectPass(roiGray, rdw, rdh, roiScale, 30, 100, 3, 5);
    if(!best || bestScore<0.4){
      const mean=cv.mean(roiGray)[0];
      const r2=detectPass(roiGray, rdw, rdh, roiScale, Math.max(10, mean*0.5), Math.min(255, mean*1.2), 5, 5);
      if(!best || r2.bestScore>bestScore){ best=r2.best; bestScore=r2.bestScore; }
    }

    roi.delete(); roiSmall.delete(); roiGray.delete();

    if(!best || bestScore<0.35) return null;
    return best.map(p=>({x:p.x+rx, y:p.y+ry}));
  }catch(e){ console.error(e); return null; }
}

function detectBestQuadInCanvas(origCanvas){
  const detectScale=Math.min(1, 600/Math.max(origCanvas.width, origCanvas.height));
  const dw=Math.round(origCanvas.width*detectScale), dh=Math.round(origCanvas.height*detectScale);

  const src=cv.imread(origCanvas);
  const small=new cv.Mat();
  cv.resize(src, small, new cv.Size(dw, dh), 0, 0, cv.INTER_AREA);

  const gray=new cv.Mat();
  cv.cvtColor(small, gray, cv.COLOR_RGBA2GRAY);

  let {best, bestScore}=detectPass(gray, dw, dh, detectScale, 40, 120, 3, 5);

  if(!best || bestScore<0.4){
    const mean=cv.mean(gray)[0];
    const autoLow=Math.max(10, Math.round(mean*0.5));
    const autoHigh=Math.min(255, Math.round(mean*1.2));
    const r2=detectPass(gray, dw, dh, detectScale, autoLow, autoHigh, 5, 5);
    if(!best || r2.bestScore>bestScore){ best=r2.best; bestScore=r2.bestScore; }
  }

  if(!best || bestScore<0.45){
    const mean=cv.mean(gray)[0];
    const r3=detectPass(gray, dw, dh, detectScale, Math.max(10, mean*0.5), Math.min(255, mean*1.2), 5, 9);
    if(!best || r3.bestScore>bestScore){ best=r3.best; bestScore=r3.bestScore; }
  }

  small.delete(); gray.delete();

  if(best){
    const refined=refineCornersInRoi(src, best);
    if(refined) best=refined;
  }

  src.delete();
  return {best, bestScore};
}

async function detectCard(){
  if(!(await ensureCvReady(8000))){await manualFallback('OpenCV를 불러오지 못했습니다.');return}
  try{
    const canvas=$('sourceCanvas');
    const {best, bestScore}=detectBestQuadInCanvas(canvas);

    if(best && bestScore>=0.35){
      corners=best;
      showCornerOverlay();
      setStatus('정상적으로 인식했습니다.', true);
      await warpAndColor();
    }else await manualFallback('자동 인식에 실패했습니다.');
  }catch(err){console.error(err); await manualFallback('자동 인식 중 문제가 발생했습니다.')}
}

function showCornerOverlay(){
  $('manualHandles').style.display='block';
  $('manualQuad').style.display='block';
  renderManualOverlay();
}
function hideCornerOverlay(){
  $('manualHandles').style.display='none';
  $('manualQuad').style.display='none';
}
function manualFallback(msg){
  setStatus(msg+' 파란 점을 드래그해 영역을 직접 지정해주세요.');
  const canvas=$('sourceCanvas');
  const mx=canvas.width*0.1, my=canvas.height*0.1;
  corners=[
    {x:mx, y:my}, {x:canvas.width-mx, y:my},
    {x:canvas.width-mx, y:canvas.height-my}, {x:mx, y:canvas.height-my}
  ];
  showCornerOverlay();
  return cvReady ? warpAndColor() : Promise.resolve();
}

/* =========================================================
   원근 보정 + 배경 정리(그림자 제거·화이트닝) + 밝기/대비 필터
========================================================= */
function estimateBackgroundMax(sourceCanvas, cellSize){
  const w=sourceCanvas.width, h=sourceCanvas.height;
  const src=sourceCanvas.getContext('2d').getImageData(0,0,w,h).data;

  const gw=Math.max(1, Math.ceil(w/cellSize)), gh=Math.max(1, Math.ceil(h/cellSize));
  const cellMax=new Uint8ClampedArray(gw*gh*3);

  for(let y=0;y<h;y++){
    const gy=Math.min(gh-1, (y/cellSize)|0);
    for(let x=0;x<w;x++){
      const gx=Math.min(gw-1, (x/cellSize)|0);
      const si=(y*w+x)*4, ci=(gy*gw+gx)*3;
      if(src[si]  >cellMax[ci])  cellMax[ci]  =src[si];
      if(src[si+1]>cellMax[ci+1])cellMax[ci+1]=src[si+1];
      if(src[si+2]>cellMax[ci+2])cellMax[ci+2]=src[si+2];
    }
  }

  const small=document.createElement('canvas');
  small.width=gw; small.height=gh;
  const smallCtx=small.getContext('2d');
  const simg=smallCtx.createImageData(gw,gh);
  for(let i=0,j=0;i<cellMax.length;i+=3,j+=4){
    simg.data[j]=cellMax[i]; simg.data[j+1]=cellMax[i+1]; simg.data[j+2]=cellMax[i+2]; simg.data[j+3]=255;
  }
  smallCtx.putImageData(simg,0,0);

  const bg=document.createElement('canvas');
  bg.width=w; bg.height=h;
  const bgCtx=bg.getContext('2d');
  bgCtx.imageSmoothingEnabled=true;
  bgCtx.drawImage(small, 0, 0, w, h);
  return bg;
}

function whitenBackground(sourceCanvas){
  const w=sourceCanvas.width, h=sourceCanvas.height;
  const cellSize=Math.max(24, Math.round(w/40));
  const bg=estimateBackgroundMax(sourceCanvas, cellSize);

  const srcCtx=sourceCanvas.getContext('2d');
  const srcData=srcCtx.getImageData(0,0,w,h);
  const bgData=bg.getContext('2d').getImageData(0,0,w,h);
  const out=srcCtx.createImageData(w,h);

  const sp=srcData.data, bp=bgData.data, op=out.data;
  for(let i=0;i<sp.length;i+=4){
    const rBg=Math.max(bp[i],20), gBg=Math.max(bp[i+1],20), bBg=Math.max(bp[i+2],20);
    op[i]  =Math.min(255, sp[i]  /rBg*255);
    op[i+1]=Math.min(255, sp[i+1]/gBg*255);
    op[i+2]=Math.min(255, sp[i+2]/bBg*255);
    op[i+3]=255;
  }

  const result=document.createElement('canvas');
  result.width=w; result.height=h;
  result.getContext('2d').putImageData(out,0,0);
  return result;
}

// 실제 카드처럼 둥근 모서리로 그리기 위한 라운드 사각형 경로(신분증 모드 전용).
function roundedRectPath(ctx, x, y, w, h, r){
  r=Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function warpAndColor(){
  if(!corners)return Promise.resolve();
  return new Promise(resolve=>{
    try{
      setPipelineStep('warp');
      const sourceCanvas=$('sourceCanvas');
      const src=cv.imread(sourceCanvas);
      const pts=cv.matFromArray(4,1,cv.CV_32FC2,corners.flatMap(p=>[p.x,p.y]));

      const o=orderPoints(corners);
      const w1=distance(o[0],o[1]), w2=distance(o[3],o[2]);
      const h1=distance(o[0],o[3]), h2=distance(o[1],o[2]);
      const measuredW=(w1+w2)/2, measuredH=(h1+h2)/2;

      let W, H;
      if(docType==='idcard'){
        // 신분증은 실측 비율이 조금 어긋나도 실제 카드 비율(85.6:53.98)로 강제 스냅해서
        // 찌그러지지 않게 한다 - 가로/세로는 실측값으로 방향만 판단한다.
        const CARD_RATIO=CARD_W_MM/CARD_H_MM;
        if(measuredW/measuredH>=1){ W=1000; H=Math.round(W/CARD_RATIO); }
        else{ H=1000; W=Math.round(H/CARD_RATIO); }
      }else{
        // 문서는 신분증과 달리 고정된 비율이 없으므로(A4/영수증/책 등), 실제로 선택한
        // 사각형의 측정된 변 길이 비율을 그대로 목적지 크기로 쓴다.
        const MAX_SIDE=1800;
        const scale=Math.min(1, MAX_SIDE/Math.max(measuredW, measuredH));
        W=Math.max(200, Math.round(measuredW*scale)); H=Math.max(200, Math.round(measuredH*scale));
      }

      const dstPts=cv.matFromArray(4,1,cv.CV_32FC2,[0,0, W-1,0, W-1,H-1, 0,H-1]);
      const M=cv.getPerspectiveTransform(pts,dstPts), dst=new cv.Mat();
      cv.warpPerspective(src, dst, M, new cv.Size(W,H), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255,255,255,255));

      const warped=document.createElement('canvas');
      warped.width=W; warped.height=H;
      cv.imshow(warped, dst);

      pts.delete(); dstPts.delete(); M.delete(); dst.delete(); src.delete();

      setPipelineStep('clean');
      setStatus('배경을 정리하는 중입니다...');
      requestAnimationFrame(()=>{
        warpedCanvas=whitenBackground(warped);
        applyFilterAndRender();
        setPipelineStep('done');
        setStatus('정상적으로 인식했습니다.', true);
        resolve();
      });
    }catch(e){
      console.error(e); showToast('보정에 실패했습니다. 다시 시도해주세요.');
      resolve();
    }
  });
}

const DOC_WHITE_CUTOFF=225, DOC_BLACK_CUTOFF=110;
function applyDocumentThreshold(canvas){
  const ctx=canvas.getContext('2d');
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    const gray=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
    let v;
    if(gray>=DOC_WHITE_CUTOFF) v=255;
    else if(gray<=DOC_BLACK_CUTOFF) v=0;
    else v=Math.round((gray-DOC_BLACK_CUTOFF)/(DOC_WHITE_CUTOFF-DOC_BLACK_CUTOFF)*255);
    d[i]=v; d[i+1]=v; d[i+2]=v;
  }
  ctx.putImageData(imgData,0,0);
}

function applyFilterAndRender(){
  if(!warpedCanvas)return;
  const tmp=document.createElement('canvas');
  tmp.width=warpedCanvas.width; tmp.height=warpedCanvas.height;
  const tc=tmp.getContext('2d');
  // JPEG는 투명도가 없으므로, 신분증 모드에서 모서리를 둥글게 잘라낼 때 그 바깥이
  // 검게 나오지 않도록 먼저 흰색으로 채워둔다.
  tc.fillStyle='#fff';
  tc.fillRect(0,0,tmp.width,tmp.height);

  const isCard=docType==='idcard';
  if(isCard){
    const pxPerMm=Math.max(tmp.width, tmp.height)/CARD_W_MM;
    tc.save();
    roundedRectPath(tc, 0, 0, tmp.width, tmp.height, CARD_CORNER_MM*pxPerMm);
    tc.clip();
  }

  const b=$('brightness').value, c=$('contrast').value;
  tc.filter=`brightness(${b}%) contrast(${c}%)`;
  tc.drawImage(warpedCanvas, 0, 0);

  if(isCard) tc.restore();

  if(mode==='bw') applyDocumentThreshold(tmp);

  processedDataURL=tmp.toDataURL('image/jpeg',0.92);
  $('pagePreview').src=processedDataURL;
}

function scheduleFilterRender(){
  if(filterRAF)return;
  filterRAF=requestAnimationFrame(()=>{filterRAF=null; applyFilterAndRender();});
}

$('colorBtn').onclick=()=>{mode='color';$('colorBtn').classList.add('active');$('bwBtn').classList.remove('active');applyFilterAndRender()};
$('bwBtn').onclick=()=>{mode='bw';$('bwBtn').classList.add('active');$('colorBtn').classList.remove('active');applyFilterAndRender()};
$('brightness').oninput=e=>{$('bv').textContent=Number(e.target.value)-100;scheduleFilterRender()};
$('contrast').oninput=e=>{$('cv').textContent=Number(e.target.value)-100;scheduleFilterRender()};
$('resetBrightness').onclick=()=>{$('brightness').value=100;$('bv').textContent='0';scheduleFilterRender()};
$('resetContrast').onclick=()=>{$('contrast').value=100;$('cv').textContent='0';scheduleFilterRender()};

$('zoomOut').onclick=()=>setZoom(zoomLevel-0.5);

/* =========================================================
   영역 조정 (항상 화면에 떠 있는 드래그 UI)
========================================================= */
function setZoom(z){
  zoomLevel=Math.min(3, Math.max(1, z));
  $('photoBox').style.width=(zoomLevel*100)+'%';
  $('zoomLevelText').textContent=Math.round(zoomLevel*100)+'%';
}

function pointToPercent(p, canvas){
  return {xPct:p.x/canvas.width*100, yPct:p.y/canvas.height*100};
}

function cornerOutwardDir(idx, pts){
  const cx=(pts[0].x+pts[1].x+pts[2].x+pts[3].x)/4;
  const cy=(pts[0].y+pts[1].y+pts[2].y+pts[3].y)/4;
  const dx=pts[idx].x-cx, dy=pts[idx].y-cy;
  const len=Math.hypot(dx,dy)||1;
  return {x:dx/len, y:dy/len};
}

const HANDLE_OFFSET_PX=24;

function renderManualOverlay(){
  if(!corners)return;
  const canvas=$('sourceCanvas');
  const pts=[];

  document.querySelectorAll('#manualHandles .corner-marker').forEach(marker=>{
    const idx=+marker.dataset.idx;
    const {xPct,yPct}=pointToPercent(corners[idx], canvas);
    marker.style.left=xPct+'%'; marker.style.top=yPct+'%';
    pts[idx]=xPct+','+yPct;
  });

  document.querySelectorAll('#manualHandles .corner-dot').forEach(dot=>{
    const idx=+dot.dataset.idx;
    const {xPct,yPct}=pointToPercent(corners[idx], canvas);
    const dir=cornerOutwardDir(idx, corners);
    dot.style.left=xPct+'%'; dot.style.top=yPct+'%';
    dot.style.transform=`translate(${dir.x*HANDLE_OFFSET_PX}px, ${dir.y*HANDLE_OFFSET_PX}px)`;
  });

  EDGES.forEach(edge=>{
    const bar=document.querySelector(`#manualHandles .edge-bar[data-edge="${edge.name}"]`);
    if(!bar)return;
    const pA=corners[edge.a], pB=corners[edge.b];
    const {xPct,yPct}=pointToPercent({x:(pA.x+pB.x)/2, y:(pA.y+pB.y)/2}, canvas);
    bar.style.left=xPct+'%'; bar.style.top=yPct+'%';
  });

  $('manualPolygon').setAttribute('points', pts.join(' '));
}

function selectFullArea(){
  if(!originalImage){showToast('먼저 사진을 선택해주세요.');return}
  const canvas=$('sourceCanvas');
  corners=[
    {x:0, y:0}, {x:canvas.width, y:0},
    {x:canvas.width, y:canvas.height}, {x:0, y:canvas.height}
  ];
  showCornerOverlay();
  setStatus('사진 전체 영역을 지정했습니다.', true);
  warpAndColor();
}

async function redetectInSelection(){
  if(!corners || !originalImage){showToast('먼저 사진을 선택해주세요.');return}
  if(!(await ensureCvReady(4000))){showToast('OpenCV를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');return}

  const canvas=$('sourceCanvas');
  try{
    const xs=corners.map(p=>p.x), ys=corners.map(p=>p.y);
    const boxW=Math.max(...xs)-Math.min(...xs), boxH=Math.max(...ys)-Math.min(...ys);
    const coversWholePhoto = boxW>=canvas.width*0.9 && boxH>=canvas.height*0.9;

    let refined=null, score=0;
    if(coversWholePhoto){
      const r=detectBestQuadInCanvas(canvas);
      if(r.best && r.bestScore>=0.35){ refined=r.best; score=r.bestScore; }
    }else{
      const src=cv.imread(canvas);
      refined=refineCornersInRoi(src, corners, 0.3);
      src.delete();
      score=refined ? 1 : 0;
    }

    if(refined && score>0){
      corners=refined;
      renderManualOverlay();
      setStatus('현재 영역에서 테두리를 다시 인식했습니다.', true);
      warpAndColor();
    }else{
      showToast('현재 영역에서 더 정확한 경계를 찾지 못했습니다.');
    }
  }catch(e){
    console.error(e);
    showToast('다시 인식 중 문제가 발생했습니다.');
  }
}

document.querySelectorAll('#manualHandles .corner-dot').forEach(dot=>{
  dot.addEventListener('pointerdown', e=>{
    e.preventDefault();
    dot.setPointerCapture(e.pointerId);
    manualDragIdx=+dot.dataset.idx;
  });
});

document.querySelectorAll('#manualHandles .edge-bar').forEach(bar=>{
  bar.addEventListener('pointerdown', e=>{
    e.preventDefault();
    bar.setPointerCapture(e.pointerId);
    const canvas=$('sourceCanvas');
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    manualDragEdge=EDGES.find(edge=>edge.name===bar.dataset.edge);
    edgeDragStart={
      pointerX:(e.clientX-rect.left)*scaleX, pointerY:(e.clientY-rect.top)*scaleY,
      a:{...corners[manualDragEdge.a]}, b:{...corners[manualDragEdge.b]}
    };
  });
});

$('manualHandles').addEventListener('pointermove', e=>{
  if(!corners)return;
  const canvas=$('sourceCanvas');
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;

  if(manualDragEdge){
    const curX=(e.clientX-rect.left)*scaleX, curY=(e.clientY-rect.top)*scaleY;
    const dx=curX-edgeDragStart.pointerX, dy=curY-edgeDragStart.pointerY;
    corners[manualDragEdge.a]={
      x: Math.min(canvas.width, Math.max(0, edgeDragStart.a.x+dx)),
      y: Math.min(canvas.height, Math.max(0, edgeDragStart.a.y+dy))
    };
    corners[manualDragEdge.b]={
      x: Math.min(canvas.width, Math.max(0, edgeDragStart.b.x+dx)),
      y: Math.min(canvas.height, Math.max(0, edgeDragStart.b.y+dy))
    };
    renderManualOverlay();
    return;
  }

  if(manualDragIdx===null)return;

  const dir=cornerOutwardDir(manualDragIdx, corners);
  const fx=(e.clientX-rect.left)*scaleX - dir.x*HANDLE_OFFSET_PX*scaleX;
  const fy=(e.clientY-rect.top)*scaleY - dir.y*HANDLE_OFFSET_PX*scaleY;

  corners[manualDragIdx]={
    x: Math.min(canvas.width, Math.max(0, fx)),
    y: Math.min(canvas.height, Math.max(0, fy))
  };
  renderManualOverlay();
});

function commitCornerDrag(){
  if(!corners)return;
  corners=orderPoints(corners);
  setStatus('영역을 직접 조정했습니다.', true);
  warpAndColor();
}

$('manualHandles').addEventListener('pointerup', ()=>{
  if(manualDragIdx!==null){ manualDragIdx=null; commitCornerDrag(); }
  if(manualDragEdge){ manualDragEdge=null; edgeDragStart=null; commitCornerDrag(); }
});
$('manualHandles').addEventListener('pointercancel', ()=>{manualDragIdx=null; manualDragEdge=null; edgeDragStart=null});

/* =========================================================
   페이지 목록 관리
========================================================= */
function resetWorkspace(){
  originalImage=null; corners=null; warpedCanvas=null; processedDataURL=null;
  currentEditSourceDataURL=null;
  hideCornerOverlay(); setZoom(1);
}

function buildPageObject(){
  return {
    dataURL: processedDataURL,
    w: warpedCanvas.width, h: warpedCanvas.height,
    sourceDataURL: currentEditSourceDataURL,
    corners: corners.map(p=>({...p})),
    mode,
    brightness: +$('brightness').value,
    contrast: +$('contrast').value
  };
}

function commitPage(){
  if(!processedDataURL){showToast('먼저 사진을 촬영하거나 선택해주세요.');return}
  const pageData=buildPageObject();
  if(editingPageIndex!==null){
    pages[editingPageIndex]=pageData;
    showToast('페이지를 수정했습니다.');
  }else{
    pages.push(pageData);
    showToast('페이지를 추가했습니다. ('+pages.length+'장)');
  }
  editingPageIndex=null;
  renderPagesList();
  resetWorkspace();
  setScreen('list');
}

$('addPageBtn').onclick=commitPage;
$('cancelEditBtn').onclick=()=>{
  editingPageIndex=null;
  resetWorkspace();
  setScreen(pages.length?'list':'home');
};

function removePage(i){
  pages.splice(i,1);
  renderPagesList();
  if(!pages.length) setScreen('home');
}

function openPageForEdit(index){
  const page=pages[index];
  if(!page.corners){ showToast('이 페이지는 다시 조정할 수 없습니다.'); return; }
  editingPageIndex=index;
  $('addPageBtn').textContent='이 페이지 저장';

  const img=new Image();
  img.onload=()=>{
    originalImage=img;
    corners=page.corners.map(p=>({...p}));
    warpedCanvas=null; processedDataURL=null;
    mode=page.mode;
    $('brightness').value=page.brightness; $('bv').textContent=page.brightness-100;
    $('contrast').value=page.contrast; $('cv').textContent=page.contrast-100;
    $('colorBtn').classList.toggle('active', mode==='color');
    $('bwBtn').classList.toggle('active', mode==='bw');
    setZoom(1);
    setScreen('editing');
    setPipelineStep('detect');
    drawSource(img);
    currentEditSourceDataURL=page.sourceDataURL;
    showCornerOverlay();
    setStatus('저장된 조정값을 불러왔습니다.', true);
    warpAndColor();
  };
  img.src=page.sourceDataURL;
}

function renderPagesList(){
  $('pageCountTag').textContent=pages.length+'장';
  const grid=$('pageGrid');
  grid.innerHTML='';

  pages.forEach((p,i)=>{
    const thumb=document.createElement('div');
    thumb.className='page-thumb';
    thumb.innerHTML=`
      <img src="${p.dataURL}" alt="페이지 ${i+1}">
      <span class="page-num">${i+1}</span>
      <button type="button" class="page-del" aria-label="삭제">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>`;
    thumb.querySelector('.page-del').onclick=()=>removePage(i);
    thumb.addEventListener('click', e=>{
      if(e.target.closest('.page-del'))return;
      openPageForEdit(i);
    });
    grid.appendChild(thumb);
  });

  const addCam=document.createElement('button');
  addCam.type='button'; addCam.className='page-add-tile';
  addCam.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.4-2h7.2L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>촬영`;
  addCam.onclick=()=>$('camera').click();
  grid.appendChild(addCam);

  const addGal=document.createElement('button');
  addGal.type='button'; addGal.className='page-add-tile';
  addGal.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5l-5.2-5-6 6"/></svg>선택`;
  addGal.onclick=()=>$('gallery').click();
  grid.appendChild(addGal);

  const showImageExport = pages.length===1;
  $('exportImageBtn').style.display = showImageExport ? 'flex' : 'none';
  $('exportPdfBtn').classList.toggle('full', !showImageExport);
  $('printBtn').style.display = (!IS_MOBILE && pages.length) ? 'flex' : 'none';
}

/* =========================================================
   내보내기 (이미지 / PDF / 인쇄)
   - 문서 모드: A4 안에 여백을 두고 꽉 차게 배치(가운데 정렬)
   - 신분증 모드: 실제 크기(85.6×53.98mm) 그대로, 용지 상단에 배치
========================================================= */
function fitMm(pxW, pxH, marginMm){
  marginMm = marginMm||10;
  const maxW=PAGE_W_MM-marginMm*2, maxH=PAGE_H_MM-marginMm*2;
  const scale=Math.min(maxW/pxW, maxH/pxH);
  return {w:pxW*scale, h:pxH*scale};
}

// 페이지가 A4 위에서 차지할 실제 mm 크기 - 신분증은 항상 실물 크기 고정, 문서는 여백 안에서 꽉 차게.
function pageMmSize(page){
  if(docType!=='idcard') return fitMm(page.w, page.h, 10);
  const landscape = page.w/page.h >= 1;
  return { w: landscape?CARD_W_MM:CARD_H_MM, h: landscape?CARD_H_MM:CARD_W_MM };
}
function pageMmTop(h){
  return docType==='idcard' ? CARD_TOP_MM : (PAGE_H_MM-h)/2;
}
function exportBaseName(){
  return docType==='idcard' ? '신분증' : '문서스캔';
}

async function renderPageA4Canvas(page){
  const DPI=200, mmToPx=DPI/25.4;
  const {w,h}=pageMmSize(page);
  const top=pageMmTop(h);
  const leftPx=(PAGE_W_MM-w)/2*mmToPx, topPx=top*mmToPx;

  const canvas=document.createElement('canvas');
  canvas.width=Math.round(PAGE_W_MM*mmToPx); canvas.height=Math.round(PAGE_H_MM*mmToPx);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);

  const img=await loadImage(page.dataURL);
  ctx.drawImage(img, leftPx, topPx, w*mmToPx, h*mmToPx);
  return canvas;
}

async function exportImage(){
  if(pages.length!==1){showToast('이미지 저장은 1장일 때만 가능합니다. 여러 장은 PDF로 저장해주세요.');return}
  showToast('이미지를 준비하고 있습니다...');
  const canvas=await renderPageA4Canvas(pages[0]);
  canvas.toBlob(blob=>{
    if(blob) shareOrDownload(blob, exportBaseName()+'.jpg', 'image/jpeg');
  }, 'image/jpeg', 0.92);
}

async function exportPdf(){
  if(!pages.length){showToast('먼저 사진을 추가해주세요.');return}
  if(!window.jspdf){showToast('PDF 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');return}
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'mm', format:'a4'});
    for(let i=0;i<pages.length;i++){
      if(i>0) doc.addPage();
      const p=pages[i];
      const {w,h}=pageMmSize(p);
      const top=pageMmTop(h);
      const left=(PAGE_W_MM-w)/2;
      doc.addImage(p.dataURL, 'JPEG', left, top, w, h);
    }
    const blob=doc.output('blob');
    shareOrDownload(blob, exportBaseName()+'.pdf', 'application/pdf');
  }catch(e){ console.error(e); showToast('PDF 생성에 실패했습니다.'); }
}

$('exportImageBtn').onclick=exportImage;
$('exportPdfBtn').onclick=exportPdf;

function preparePrintArea(){
  const area=$('printArea');
  area.innerHTML='';
  pages.forEach(p=>{
    const div=document.createElement('div');
    div.className='print-page';
    const img=document.createElement('img');
    img.src=p.dataURL;
    if(docType==='idcard'){
      // 신분증은 "여백 안에서 꽉 차게(object-fit:contain)" 대신 실제 크기 그대로,
      // 용지 상단(CARD_TOP_MM)에 배치한다.
      const {w,h}=pageMmSize(p);
      div.style.padding='0';
      div.style.alignItems='flex-start';
      img.style.width=w+'mm'; img.style.height=h+'mm';
      img.style.maxWidth='none'; img.style.maxHeight='none';
      img.style.marginTop=CARD_TOP_MM+'mm';
    }
    div.appendChild(img);
    area.appendChild(div);
  });
}
$('printBtn').onclick=()=>{
  if(!pages.length){showToast('먼저 사진을 추가해주세요.');return}
  preparePrintArea();
  window.print();
};

/* =========================================================
   공유 / 다운로드
========================================================= */
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.style.display='none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onloadend=()=>resolve(String(reader.result).split(',')[1] || '');
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

async function shareOrDownload(blob, filename, mimeType){
  if(window.AndroidBridge && window.AndroidBridge.shareFile){
    try{
      const base64=await blobToBase64(blob);
      window.AndroidBridge.shareFile(base64, filename, mimeType);
    }catch(e){
      console.error(e);
      showToast('공유 준비 중 문제가 발생했습니다.');
    }
    return;
  }

  if(!IS_MOBILE){
    downloadBlob(blob, filename);
    showToast('파일을 다운로드했습니다.');
    return;
  }

  if(!window.isSecureContext){
    console.warn('[공유] navigator.share 미사용: https(보안 컨텍스트)가 아님 - location:', location.href);
  }else if(!navigator.share){
    console.warn('[공유] navigator.share 미지원 브라우저');
  }else{
    try{
      const file=new File([blob], filename, {type:mimeType});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:exportBaseName()});
        return;
      }
      console.warn('[공유] canShare(files)==false - 이 브라우저는 이 형식(', mimeType, ') 파일 공유를 지원하지 않음');
    }catch(e){
      if(e.name==='AbortError') return;
      console.error('[공유] navigator.share 실패:', e.name, e.message);
    }
  }

  if(IS_INAPP_BROWSER){
    showChromeHint('카카오톡 등 인앱 브라우저에서는 보안 정책상 저장이 차단될 수 있습니다. 저장이 안 되면 크롬으로 열어 다시 시도해주세요.', false);
  }else{
    showToast('공유가 지원되지 않아 다운로드했습니다. 다운로드 폴더에서 열어 공유 버튼을 눌러주세요.');
  }
  downloadBlob(blob, filename);
}

setScreen('mode');
</script>
