<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전세 DTI 계산</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 20px 14px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 400px; /* S24+ 뷰포트에 맞춘 최적화 크기 */
      background: #ffffff;
      padding: 21px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 12px -6px rgba(15, 23, 42, 0.08);
    }

    /* -------------------- 상단 타이틀 -------------------- */
    .title {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      color: #0369a1;
      padding: 12px;
      border-radius: 11px;
      font-weight: 800;
      border: 1px solid #bae6fd;
      transition: transform 0.2s;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title:active { transform: scale(0.98); }
    .title-text {
      flex: 1;
      text-align: center;
      font-size: clamp(15px, 4.4vw, 18px);
      white-space: nowrap;
    }

    .reset-btn-left,
    .credit-score-btn {
      flex-shrink: 0;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .reset-btn-left {
      border: 1px solid rgba(220, 38, 38, 0.5);
      background: rgba(254, 226, 226, 0.8);
      color: #dc2626;
    }
    .reset-btn-left:hover { background: rgba(254, 226, 226, 1); border-color: #dc2626; }
    .credit-score-btn {
      border: 1px solid rgba(3, 105, 161, 0.5);
      background: rgba(224, 242, 254, 0.8);
      color: #0369a1;
    }
    .credit-score-btn:hover { background: rgba(224, 242, 254, 1); border-color: #0369a1; }
    .reset-btn-left:active, .credit-score-btn:active { transform: scale(0.95); }

    /* -------------------- 입력 필드 (한 줄에 2칸) -------------------- */
    /* 예전에는 라벨과 입력칸이 가로로 붙은 한 줄짜리 행이었다. 한 줄에 2칸을 넣으면
       칸 너비가 약 148px밖에 안 돼서, 84px짜리 라벨을 빼면 아홉 자리 금액이 들어갈
       자리가 없다. 그래서 라벨을 입력칸 위로 올렸다. */
    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .field > label {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      padding-left: 3px;
      user-select: none;
      white-space: nowrap;
    }
    .field > label[onclick] { cursor: pointer; }
    .field > label[onclick]:active { color: #1e293b; }

    /* 라벨을 누르면 값이 지워진다는 힌트 - 값이 있을 때만 보인다 */
    .field > label[onclick]::after {
      content: " ×";
      font-weight: 800;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .field.has-value > label[onclick]::after { opacity: 0.5; }

    .field > label .sub {
      font-weight: 600;
      color: #94a3b8;
      font-size: 10px;
    }

    .field > input {
      width: 100%;
      min-width: 0;
      padding: 10px 9px;
      text-align: right;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      background: #ffffff;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field > input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .field > input[readonly] {
      background: #f1f5f9; /* 입력 불가임을 배경으로 명시 */
      color: #334155;
      cursor: default;
    }
    .field > input[readonly]:focus { border-color: #94a3b8; box-shadow: none; }
    .field > input::placeholder { color: #b6bcc7; font-weight: 400; }

    /* 금리 칸의 % 표시.
       예전에는 입력값 안에 '%'를 같이 넣어뒀다. 그러면 백스페이스를 눌렀을 때 숫자가 아니라
       '%'가 먼저 지워지고 곧바로 다시 붙어서, 한 글자 지우는 데 두 번을 눌러야 했다.
       값에는 숫자만 두고 %는 화면에만 얹는다. */
    .field.unit { position: relative; }
    .field.unit > input { padding-right: 24px; }
    .field.unit .unit-mark {
      position: absolute;
      right: 10px;
      bottom: 11px;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      pointer-events: none; /* %를 눌러도 입력칸이 포커스되게 */
    }

    /* 연 사용액 / 환산 금액 - 소득 환산 영역임을 블루로 구분 */
    .field.blue > label { color: #0369a1; }
    .field.blue > input {
      border-color: #0284c7;
      border-width: 1.5px;
      color: #0284c7;
      font-weight: 700;
    }

    /* DTI 40% 이상 경고 */
    .field > input.dti-over {
      background: #fef2f2;
      border-color: #ef4444;
      border-width: 1.5px;
      color: #ef4444;
      font-weight: 800;
    }

    /* 최대 가능금액 - 누르면 대출 금액에 채워지므로 눌릴 수 있음을 표시 */
    .field > input.max-loan {
      color: #0369a1;
      font-weight: 700;
      background: #f0f9ff;
      border-color: #7dd3fc;
    }
    .field > input.max-loan:not(:placeholder-shown) { cursor: pointer; }
    .field > input.max-loan:not(:placeholder-shown):hover {
      background: #e0f2fe;
      border-color: #0284c7;
    }

    /* 환산 수식 - 한 줄 전체 */
    .field.wide { margin-bottom: 8px; }
    .field.wide > input {
      text-align: center;
      font-weight: 700;
      font-size: min(13px, 3.2vw);
      overflow: auto;
    }

    /* -------------------- 소득 환산 방식 버튼 -------------------- */
    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin: 14px 0 10px;
    }
    .button-group button {
      flex: 1;
      padding: 10px 2px;
      font-weight: 700;
      font-size: clamp(10px, 3.2vw, 13px);
      white-space: nowrap;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .카드버튼 { background: #e0e7ff; color: #4338ca; }
    .건보버튼 { background: #f1f5f9; color: #475569; }
    .연금버튼 { background: #d1fae5; color: #065f46; }
    .전월세버튼 { background: #f3e8ff; color: #6b21a8; }
    .주신보 { background: #fef9c3; color: #854d0e; }

    .activeButton {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      outline: 2px solid currentColor;
      opacity: 1 !important;
      z-index: 2;
    }
    .inactiveButton {
      opacity: 0.35;
      transform: scale(0.96);
    }

    /* -------------------- 하단 설정 -------------------- */
    .footer {
      display: flex;
      justify-content: flex-start; /* 화면 맨 좌측 아래 */
      margin-top: 14px;
    }
    .settings-btn {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #64748b;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .settings-btn:hover { background: #f1f5f9; border-color: #94a3b8; color: #475569; }
    .settings-btn:active { transform: scale(0.95); }

    /* -------------------- 팝업 -------------------- */
    .popup-container {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .popup-content {
      background-color: #ffffff;
      padding: 15px;
      width: 100%;
      max-width: 400px;
      border-radius: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .popup-content img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }
    .popup-content table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: center;
      table-layout: fixed;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #94a3b8;
    }
    .popup-content td {
      border-bottom: 1px solid #cbd5e1;
      border-right: 1px solid #cbd5e1;
      padding: 8px 5px;
      font-size: 13px;
    }
    .popup-content tr:first-child td {
      background: #e2e8f0;
      font-weight: 800;
      color: #1e293b;
      border-bottom: 1px solid #94a3b8;
    }
    .popup-content tr:last-child td { border-bottom: none; }
    .popup-content td:last-child { border-right: none; }
    .popup-content input {
      width: 100%;
      padding: 6px 4px;
      border: 1px solid #94a3b8;
      border-radius: 5px;
      text-align: center;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      background: #ffffff;
    }
    .popup-content input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    .popup-hint {
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.5;
      color: #64748b;
      text-align: center;
    }
  </style>

<script>
  "use strict";

  let selectedType = "";

  const $ = (id) => document.getElementById(id);

  /* 소득 환산 방식별 설정을 한 곳에 모았다.
     예전에는 updateFields()와 updateConversionAmount() 두 함수에 똑같은 5갈래 분기가
     각각 들어 있어서, 비율 하나를 고치려면 양쪽을 같이 손봐야 했다. */
  const 방식설정 = {
    카드사용액: {
      비율id: "카드전환비율", 기본비율: 40.9, 라벨: "연 사용액", 버튼: ".카드버튼",
      수식: (r) => `연 사용액 ÷ ${r}% × 90%`,
      환산: (v, r) => (v / (r / 100)) * 0.9, 소득반영: true
    },
    건강보험: {
      비율id: "건보전환비율", 기본비율: 3.595, 라벨: "평균 금액", 버튼: ".건보버튼",
      수식: (r) => `3개월 평균 ÷ ${r}% × 12 × 95%`,
      환산: (v, r) => (v / (r / 100)) * 12 * 0.95, 소득반영: true
    },
    연금납부: {
      비율id: "연금전환비율", 기본비율: 9.5, 라벨: "평균 금액", 버튼: ".연금버튼",
      수식: (r) => `3개월 평균 ÷ ${r}% × 12 × 95%`,
      환산: (v, r) => (v / (r / 100)) * 12 * 0.95, 소득반영: true
    },
    전월세: {
      비율id: "전월세전환비율", 기본비율: 6.4, 라벨: "1년 월세", 버튼: ".전월세버튼",
      수식: (r) => `HF,HUG 전환율 ${r}% + 보증금`,
      환산: (v, r) => v / (r / 100), 소득반영: false
    },
    주신보: {
      비율id: null, 기본비율: null, 라벨: "연소득", 버튼: ".주신보",
      수식: () => "연소득 × 3.5 ÷ 90% × 110% / 120%",
      환산: null, 소득반영: false // 110%/120% 두 값을 함께 보여줘야 해서 별도 처리
    }
  };

  const 설정_IDS = ["카드전환비율", "건보전환비율", "연금전환비율", "전월세전환비율"];
  const 소득상한 = 50000000;     // 환산소득으로 인정하는 최대 연소득
  const DTI기준 = 40;            // 최대 가능금액을 뽑는 기준 DTI(%)
  const 대출한도 = 500000000;    // DTI로 아무리 여유가 있어도 넘기지 않는 대출 상한(5억)

  // 설정 팝업에 값을 넣지 않았으면 기본비율을 쓴다(빈칸·0·문자 모두 기본값으로 떨어짐)
  function 비율읽기(type) {
    const cfg = 방식설정[type];
    if (!cfg || !cfg.비율id) return null;
    const el = $(cfg.비율id);
    return parseFloat(el && el.value) || cfg.기본비율;
  }

  // 콤마와 % 기호를 걷어낸 숫자. 비었거나 숫자가 아니면 0
  function 숫자(id) {
    const n = parseFloat($(id).value.replace(/,/g, '').replace('%', ''));
    return isNaN(n) ? 0 : n;
  }

  /* 저장 키 접두사. 파일 이름이 main.html → DTI.html로 바뀌면서 함께 맞췄다.
     길이를 숫자로 박아 쓰지 말고(예전엔 slice(5)로 'main_'을 잘라냈다) 항상
     키접두사.length를 쓸 것. 안 그러면 접두사를 바꿀 때 조용히 어긋난다. */
  const 키접두사 = 'DTI_';
  const 키 = (이름) => 키접두사 + 이름;

  /* main_ 로 저장하던 시절의 값을 DTI_ 로 옮긴다. 이미 쓰던 사람의 입력값·설정이
     날아가지 않게 하려는 것이고, 옮긴 뒤 옛 키는 지우므로 다음 실행부터는 아무 일도 안 한다.
     반드시 저장소를 처음 읽기 전에 불러야 한다. */
  function migrateOldKeyPrefix() {
    const 옛접두사 = 'main_';
    for (const 옛키 of Object.keys(localStorage)) {   // 스냅샷이라 순회 중 삭제해도 안전
      if (!옛키.startsWith(옛접두사)) continue;
      const 새키 = 키(옛키.slice(옛접두사.length));
      if (localStorage.getItem(새키) === null) {
        localStorage.setItem(새키, localStorage.getItem(옛키));
      }
      localStorage.removeItem(옛키);
    }
  }

  function 저장(key, value) {
    localStorage.setItem(키(key), value);
  }

  /* 연 사용액은 방식마다 뜻이 달라서(카드=연 사용액, 건보=3개월 평균, 전월세=1년 월세)
     한 칸을 공유하면 탭을 옮길 때마다 값이 엉킨다. 방식별로 키를 나눠 따로 보관한다. */
  const 연사용액키 = (type) => `annualUsage_${type}`;

  function 연사용액읽기(type) {
    return localStorage.getItem(키(연사용액키(type))) ?? "";
  }

  function formatNumber(input) {
    let value = input.value.replace(/,/g, '');
    if (!isNaN(value) && value !== '') {
      input.value = parseInt(value).toLocaleString();
    }
  }

  /* 금리 입력값 검증만 한다. %는 화면에만 얹으므로 값에는 숫자만 남긴다.
     (replace('%')는 %를 값에 같이 저장하던 예전 버전의 값을 복원할 때를 위한 것) */
  function formatPercentage(input) {
    const value = input.value.replace('%', '');
    const regex = /^\d{0,2}(\.\d{0,2})?$/; // 정수 2자리 + 소수점 이하 2자리까지
    if (value === '' || regex.test(value)) {
      input.value = value;
      input.dataset.previousValidValue = value;
    } else {
      input.value = input.dataset.previousValidValue || '';
    }
  }

  function 월납부액계산() {
    let 대출금액 = $("대출금액").value.replace(/,/g, '');
    let 대출금리 = $("대출금리").value.replace('%', '');
    if (대출금액 && 대출금리 && !isNaN(대출금액) && !isNaN(대출금리)) {
      let 월상환액 = (대출금액 * (parseFloat(대출금리) / 100)) / 12;
      $("월상환액").value = parseInt(월상환액).toLocaleString();
      calculateDTI();
    } else {
      $("월상환액").value = "";
      $("DTI").value = "";
      calculateDTI(); // DTI 칸의 경고 스타일까지 확실히 풀어준다
    }
  }

  /* DTI 40%를 넘지 않는 최대 대출금액.
       0.40 = (대출금액 × 금리/100/12 + 부채금액 × 부채금리/1200) ÷ (연소득/12)
     을 대출금액에 대해 풀면 아래 식이 된다.
       최대 대출금액 = (40 × 연소득 − 부채금액 × 부채금리) ÷ 대출금리
     연소득과 대출금리가 있어야 계산되고, 부채는 없으면 0으로 본다. */
  function updateMaxLoan() {
    const el = $("최대가능금액");
    const 연소득 = 숫자("연소득");
    const 대출금리 = 숫자("대출금리");

    if (연소득 <= 0 || 대출금리 <= 0) {
      el.value = "";
      return;
    }
    const 여유 = DTI기준 * 연소득 - 숫자("부채금액") * 숫자("부채금리");
    // 기존 부채만으로 이미 기준 DTI에 닿았으면 더 받을 수 있는 금액이 없다
    if (여유 <= 0) { el.value = "0"; return; }
    // DTI상 여유가 더 있어도 대출 상한(5억)을 넘겨 안내하지 않는다
    el.value = Math.min(Math.floor(여유 / 대출금리), 대출한도).toLocaleString();
  }

  function calculateDTI() {
    let 월상환액 = $("월상환액").value.replace(/,/g, '') || 0;
    let 부채금액 = $("부채금액").value.replace(/,/g, '') || 0;
    let 부채금리 = $("부채금리").value.replace('%', '') || 0;
    let 연소득 = $("연소득").value.replace(/,/g, '') || 0;
    let 부채상환액 = (parseFloat(부채금액) * parseFloat(부채금리)) / 1200;
    let 총월부채상환액 = parseFloat(월상환액) + 부채상환액;
    let 월소득 = parseFloat(연소득) / 12;

    /* 연소득이 비었거나 0이면 월소득이 0이 되어 DTI가 Infinity가 된다.
       Infinity는 isNaN을 통과해버려서, 예전에는 화면에 'Infinity%'가 붉게 찍혔다. */
    let DTI = 월소득 > 0 ? (총월부채상환액 / 월소득) * 100 : NaN;

    const dtiField = $("DTI");
    if (Number.isFinite(DTI)) {
      dtiField.value = DTI.toFixed(2) + "%";
      dtiField.classList.toggle("dti-over", DTI >= DTI기준);
    } else {
      dtiField.value = "";
      dtiField.classList.remove("dti-over");
    }

    updateMaxLoan();
  }

  /* 화면 표시(라벨·수식·버튼 강조)만 바꾸고 입력값은 건드리지 않는다.
     재방문 복원과 탭 전환 양쪽에서 재사용한다. */
  function applyTypeUI(type) {
    const cfg = 방식설정[type];
    if (!cfg) return;
    selectedType = type;

    $("conversionFormula").value = cfg.수식(비율읽기(type));
    document.querySelector(".blue label").textContent = cfg.라벨;

    const buttons = document.querySelectorAll(".button-group button");
    buttons.forEach(btn => btn.classList.remove("activeButton", "inactiveButton"));
    document.querySelector(cfg.버튼).classList.add("activeButton");
    buttons.forEach(btn => {
      if (!btn.classList.contains("activeButton")) btn.classList.add("inactiveButton");
    });

    저장("selectedType", type);
  }

  /* 방식 버튼을 눌렀을 때. 탭마다 입력값을 따로 들고 있다가 서로 바꿔 끼운다.
     나가는 탭의 값을 그 탭 이름으로 저장하고, 들어가는 탭에 저장돼 있던 값을 꺼내 온다.
     (예전에는 한 칸을 공유해서, 카드에 넣어둔 금액이 건보로 옮기면 그대로 따라왔다) */
  function updateFields(type) {
    if (selectedType) 저장(연사용액키(selectedType), $("annualUsage").value);

    applyTypeUI(type);
    $("annualUsage").value = 연사용액읽기(type);

    if ($("annualUsage").value.trim()) {
      updateConversionAmount();
    } else {
      /* 이 탭엔 저장된 값이 없다. 환산 금액만 비우고 연소득은 건드리지 않는다.
         updateConversionAmount()를 그냥 부르면 직접 입력해둔 연소득까지 지워진다. */
      $("conversionAmount").value = "";
    }
    삭제힌트_전체갱신();
  }

  function updateConversionAmount() {
    const annualUsage = $("annualUsage").value.replace(/,/g, '');
    const conversionAmount = $("conversionAmount");
    const incomeField = $("연소득");

    if (!annualUsage || isNaN(annualUsage)) {
      conversionAmount.value = "";
      incomeField.value = "";
      저장("연소득", "");
      calculateDTI(); // 연소득을 지웠으니 DTI도 같이 정리
      삭제힌트_전체갱신();
      return;
    }

    const cfg = 방식설정[selectedType];
    if (!cfg) return;

    // 주신보만 110%/120% 두 값을 한 칸에 보여주므로 별도 처리
    if (selectedType === "주신보") {
      const 주신보110 = Math.floor(annualUsage * 3.5 / 0.9 * 1.1);
      const 주신보120 = Math.floor(annualUsage * 3.5 / 0.9 * 1.2);
      conversionAmount.value = 주신보110.toLocaleString() + " / " + 주신보120.toLocaleString();
      return;
    }

    const convertedValue = cfg.환산(annualUsage, 비율읽기(selectedType));
    conversionAmount.value = parseInt(convertedValue).toLocaleString();

    if (cfg.소득반영) {
      const incomeValue = Math.min(convertedValue, 소득상한);
      incomeField.value = parseInt(incomeValue).toLocaleString();
      저장("연소득", incomeField.value);
      calculateDTI();
      삭제힌트_전체갱신();
    }
  }

  function resetFields() {
    ["conversionAmount", "conversionFormula", "월상환액", "최대가능금액", "대출금액",
     "대출금리", "연소득", "부채금액", "부채금리", "DTI", "annualUsage"].forEach(id => {
      $(id).value = "";
    });
    $("conversionFormula").value = "계산할 방법 선택하세요";
    $("DTI").classList.remove("dti-over");
    selectedType = "";
    document.querySelectorAll(".button-group button")
      .forEach(btn => btn.classList.remove("activeButton", "inactiveButton"));

    /* 저장된 값도 같이 비운다. 예전에는 화면만 지우고 localStorage는 그대로 둬서,
       초기화한 뒤 새로고침하면 지웠던 값이 되살아났다.
       전환비율 설정은 '입력값'이 아니라 사용자 설정이라 남긴다. */
    clearSessionStorageData();
    삭제힌트_전체갱신();

    // 초기화 뒤에는 아무 방식도 안 골라진 상태로 두지 않고 카드를 기본으로 세운다
    updateFields("카드사용액");
  }

  function clearInputField(inputId) {
    $(inputId).value = "";
    저장(inputId, "");
    if (inputId === "대출금액" || inputId === "대출금리") 월납부액계산();
    else calculateDTI();
    삭제힌트_전체갱신();
  }

  // 최대 가능금액을 눌러 대출 금액에 그대로 넣는다
  function applyMaxLoan() {
    const raw = $("최대가능금액").value.replace(/,/g, '');
    if (!raw || raw === "0") return;
    $("대출금액").value = Number(raw).toLocaleString();
    저장("대출금액", $("대출금액").value);
    월납부액계산();
    삭제힌트_전체갱신();
  }

  function setupPopupButton() {
    const popupContainer = $("imagePopup");
    const settingsPopupContainer = $("settingsPopup");

    $("showPopup").addEventListener("click", () => { popupContainer.style.display = "flex"; });
    $("showSettingsPopup").addEventListener("click", () => { settingsPopupContainer.style.display = "flex"; });

    window.addEventListener("click", event => {
      if (event.target === popupContainer) popupContainer.style.display = "none";
      if (event.target === settingsPopupContainer) settingsPopupContainer.style.display = "none";
    });
    // 배경을 정확히 눌러야만 닫히면 답답해서 ESC로도 닫히게 한다
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        popupContainer.style.display = "none";
        settingsPopupContainer.style.display = "none";
      }
    });
  }

  /* -------------------- 저장 / 복원 -------------------- */

  // 저장 대상: id가 있고 읽기전용이 아닌 입력창. 계산 결과(DTI/월상환액/환산금액/최대가능금액)는
  // 저장하지 않고 복원 시 다시 계산한다.
  function 저장대상() {
    return [...document.querySelectorAll('input[type="text"], input[type="number"], textarea')]
      .filter(el => el.id && !el.hasAttribute('readonly'));
  }

  function loadAllInputs() {
    // 예전에는 전환비율을 접두사 없는 키에도 중복 저장했다. 한 번만 옮기고 지운다.
    for (const id of 설정_IDS) {
      const 옛값 = localStorage.getItem(id);
      if (옛값 !== null) {
        if (localStorage.getItem(키(id)) === null) localStorage.setItem(키(id), 옛값);
        localStorage.removeItem(id);
      }
    }
    // 방식별로 나누기 전에 한 칸에 몰아 저장하던 값이 남아 있으면, 그때 쓰던 방식 쪽으로 옮긴다
    const 옛연사용액 = localStorage.getItem(키('annualUsage'));
    if (옛연사용액 !== null) {
      const 쓰던방식 = localStorage.getItem(키('selectedType'));
      if (쓰던방식 && localStorage.getItem(키(연사용액키(쓰던방식))) === null) {
        저장(연사용액키(쓰던방식), 옛연사용액);
      }
      localStorage.removeItem(키('annualUsage'));
    }

    for (const input of 저장대상()) {
      if (input.id === 'annualUsage') continue; // 방식이 정해진 뒤 따로 복원한다
      const saved = localStorage.getItem(키(input.id));
      if (saved !== null) input.value = saved;
    }

    // 예전에는 금리를 '3.5%'처럼 %까지 붙여 저장했다. 이제 값에는 숫자만 두므로 떼어낸다.
    for (const id of ['대출금리', '부채금리']) {
      $(id).value = $(id).value.replace('%', '');
    }
  }

  // 초기화 버튼용 - 입력값만 비우고 전환비율 설정은 남긴다
  function clearSessionStorageData() {
    Object.keys(localStorage)
      .filter(key => key.startsWith(키접두사))
      .filter(key => !설정_IDS.includes(key.slice(키접두사.length)))
      .forEach(key => localStorage.removeItem(key));
  }

  // 전환비율 설정까지 포함해 전부 비운다 (index.html의 전체 초기화용)
  function clearAllStorageData() {
    Object.keys(localStorage)
      .filter(key => key.startsWith(키접두사))
      .forEach(key => localStorage.removeItem(key));
  }

  /* 바뀐 칸 하나만 저장한다. 예전에는 글자 하나 칠 때마다 모든 입력창을 순회하며
     11개 키를 다시 썼고, 'input'과 'change' 양쪽에 걸려 있어 중복 저장까지 됐다. */
  function setupAutoSave() {
    for (const input of 저장대상()) {
      input.addEventListener('input', () => {
        // 연 사용액만 지금 선택된 방식 이름을 붙여 따로 저장한다
        if (input.id === 'annualUsage') {
          if (selectedType) 저장(연사용액키(selectedType), input.value);
        } else {
          저장(input.id, input.value);
        }
        삭제힌트(input);
      });
    }
  }

  /* -------------------- 라벨 클릭 삭제 힌트 -------------------- */
  function 삭제힌트(input) {
    const field = input.closest('.field');
    if (field && field.querySelector('label[onclick]')) {
      field.classList.toggle('has-value', input.value.trim() !== '');
    }
  }

  function 삭제힌트_전체갱신() {
    document.querySelectorAll('.field > label[onclick]').forEach(label => {
      const input = label.parentElement.querySelector('input');
      if (input) 삭제힌트(input);
    });
  }

  /* -------------------- 시작 -------------------- */

  document.addEventListener("DOMContentLoaded", () => {
    migrateOldKeyPrefix();   // 저장소를 읽기 전에 옛 main_ 키부터 옮긴다
    const savedType = localStorage.getItem(키('selectedType'));

    setupPopupButton();
    loadAllInputs();
    setupAutoSave();
    $("최대가능금액").addEventListener("click", applyMaxLoan);

    if (savedType && 방식설정[savedType]) {
      // 재방문: 입력값은 그대로 두고 화면 상태(라벨/수식/버튼)만 되살린다
      applyTypeUI(savedType);
      $("annualUsage").value = 연사용액읽기(savedType); // 그 방식에 저장해둔 금액
      if ($("annualUsage").value.trim()) updateConversionAmount();
    } else {
      resetFields(); // 안에서 카드 방식까지 세워준다
    }

    // 계산 결과 칸(DTI/월상환액/최대가능금액)은 저장하지 않으므로 여기서 다시 계산해 채운다
    월납부액계산();
    삭제힌트_전체갱신();
  });
</script>

</head>

<body>
  <div class="container">
    <div class="title">
      <button class="reset-btn-left" onclick="resetFields()">초기화</button>
      <span class="title-text">전세 DTI 계산</span>
      <button class="credit-score-btn" id="showPopup">신용점수</button>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="연소득" onclick="clearInputField('연소득')" title="눌러서 지우기">연 소득</label>
        <input type="text" id="연소득" inputmode="numeric" autocomplete="off" oninput="formatNumber(this); calculateDTI();">
      </div>
      <div class="field">
        <label for="대출금액" onclick="clearInputField('대출금액')" title="눌러서 지우기">대출 금액</label>
        <input type="text" id="대출금액" inputmode="numeric" autocomplete="off" oninput="formatNumber(this); 월납부액계산();">
      </div>
    </div>

    <div class="grid2">
      <div class="field unit">
        <label for="대출금리" onclick="clearInputField('대출금리')" title="눌러서 지우기">대출 금리</label>
        <input type="text" id="대출금리" inputmode="decimal" autocomplete="off" oninput="formatPercentage(this); 월납부액계산();">
        <span class="unit-mark">%</span>
      </div>
      <div class="field">
        <label for="최대가능금액">최대 가능금액 <span class="sub">DTI 40%</span></label>
        <input type="text" id="최대가능금액" class="max-loan" readonly placeholder="자동" title="누르면 대출 금액에 넣습니다">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="부채금액" onclick="clearInputField('부채금액')" title="눌러서 지우기">부채 금액</label>
        <input type="text" id="부채금액" inputmode="numeric" autocomplete="off" oninput="formatNumber(this); calculateDTI();">
      </div>
      <div class="field unit">
        <label for="부채금리" onclick="clearInputField('부채금리')" title="눌러서 지우기">부채 금리</label>
        <input type="text" id="부채금리" inputmode="decimal" autocomplete="off" oninput="formatPercentage(this); calculateDTI();">
        <span class="unit-mark">%</span>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="DTI">DTI</label>
        <input type="text" id="DTI" readonly placeholder="자동">
      </div>
      <div class="field">
        <label for="월상환액">월 상환액</label>
        <input type="text" id="월상환액" readonly placeholder="자동">
      </div>
    </div>

    <div class="button-group">
      <button class="카드버튼" onclick="updateFields('카드사용액')">카드</button>
      <button class="건보버튼" onclick="updateFields('건강보험')">건보</button>
      <button class="연금버튼" onclick="updateFields('연금납부')">연금</button>
      <button class="전월세버튼" onclick="updateFields('전월세')">전.월세</button>
      <button class="주신보" onclick="updateFields('주신보')">주신보</button>
    </div>

    <div class="grid2">
      <div class="field blue">
        <label for="annualUsage">연 사용액</label>
        <input type="text" inputmode="numeric" id="annualUsage" autocomplete="off" oninput="formatNumber(this); updateConversionAmount();">
      </div>
      <div class="field blue">
        <label for="conversionAmount">환산 금액</label>
        <input type="text" id="conversionAmount" readonly placeholder="자동">
      </div>
    </div>

    <div class="field wide">
      <label for="conversionFormula">환산 수식</label>
      <input type="text" id="conversionFormula" value="계산할 방법 선택하세요" readonly>
    </div>

    <div class="footer">
      <button type="button" class="settings-btn" id="showSettingsPopup" title="전환비율 설정">설정</button>
    </div>

    <div id="imagePopup" class="popup-container">
      <div class="popup-content">
        <img id="popupImg" src="신용점수기준.png" alt="신용점수 기준표">
      </div>
    </div>

    <div id="settingsPopup" class="popup-container">
      <div class="popup-content">
        <table>
          <tbody>
            <tr>
              <td>카드(%)</td>
              <td>건보(%)</td>
              <td>연금(%)</td>
              <td>전월세(%)</td>
            </tr>
            <tr>
              <!-- placeholder에 기본값을 그대로 적어둔다. 비워두면 어떤 비율이
                   적용 중인지 알 수 없어서, 예전에는 설정창을 열어도 '비율'이라고만 보였다. -->
              <td><input id="카드전환비율" type="number" autocomplete="off" placeholder="40.9"></td>
              <td><input id="건보전환비율" type="number" autocomplete="off" placeholder="3.595"></td>
              <td><input id="연금전환비율" type="number" autocomplete="off" placeholder="9.5"></td>
              <td><input id="전월세전환비율" type="number" autocomplete="off" placeholder="6.4"></td>
            </tr>
          </tbody>
        </table>
        <p class="popup-hint">비워두면 표시된 기본값이 적용됩니다. 배경을 누르거나 ESC로 닫습니다.</p>
      </div>
    </div>
  </div>
  <script>
    // 부모(index.html)에서 iframe 안의 이 화면을 통째로 초기화할 때 호출한다.
    // index.html:729 에서 frame.contentWindow.resetAllFields() 로 부르고 있으므로 지우면 안 된다.
    function resetAllFields() {
      resetFields();                 // 입력값·저장값 초기화 (카드 방식으로 세워짐)
      ['카드전환비율', '건보전환비율', '연금전환비율', '전월세전환비율'].forEach(id => {
        const field = document.getElementById(id);
        if (field) field.value = '';
      });
      clearAllStorageData();         // 전환비율 설정까지 전부 비운다
      updateFields("카드사용액");    // 위에서 selectedType 저장까지 지워졌으므로 다시 세운다
    }
  </script>
</body>
</html>
