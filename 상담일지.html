<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스마트 상담일지 프리미엄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #3a52b8;
            --primary-light: #4c66d0;
            --primary-hover: #2b3f96;
            --primary-soft: #f0f2fd;
            --primary-soft-border: #d6dcf7;
            --bg-table: #f7f8fc;
            --border-color: #e1e4ef;
            --text-main: #1b2333;
            --text-muted: #77808f;
            --shadow: 0 16px 36px -18px rgba(43, 63, 150, 0.32);
            --danger: #cf5a4e;
            --danger-hover: #b4453b;
        }
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; color: var(--text-main); background: #eef0f8; }
        .table-wrap { max-width: 600px; margin: 30px auto; padding: 24px; background: #fff; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid rgba(43, 63, 150, 0.06); }

        .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
        .top-actions .left-actions { display:flex; align-items:center; gap:8px; }
        .top-actions .right-actions { display:flex; align-items:center; gap:8px; }

        /* 사용자 이름 인증 콘테이너 및 요소 스타일 */
        .user-auth-container { display: flex; align-items: center; gap: 4px; }
        .user-code-input { width: 100px; padding: 8px 10px; font-size: 13px; font-weight: bold; border: 2px solid #dfe3ee; border-radius: 10px; box-sizing: border-box; text-align: center; color: #1e293b; background: #f8fafc; transition: all 0.2s; }
        .user-code-input:focus { border-color: var(--primary); background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(58, 82, 184, 0.15); }

        .user-submit-btn { height: 35px; padding: 0 10px; font-size: 12px; font-weight: 600; color: #ffffff; background-color: #0f172a; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; font-family: inherit; }
        .user-submit-btn:hover { background-color: #334155; }
        .user-display-name { font-size: 14px; font-weight: 700; color: #334155; background: #f1f5f9; padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }

        button { font-size: 14px; padding: 8px 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: transform 0.14s ease, box-shadow 0.14s ease; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06); white-space: nowrap; }
        #copyBtn { background: linear-gradient(135deg,#4f6fe4 0%,#6366f1 100%); color: #fff; border: 1px solid rgba(76,102,208,0.12); padding: 5px 12px; border-radius: 8px; font-size: 13px; box-shadow: 0 2px 6px rgba(58, 82, 184, 0.25); }
        #copyBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(58, 82, 184, 0.35); }
        #saveBtn { background: linear-gradient(135deg, #4f6fe4 0%, #3a52b8 100%); color: #fff; border: 1px solid rgba(58,82,184,0.12); }
        #saveBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(58,82,184,0.25); }
        #loadBtn { background: #fff; color: #334155; border: 1px solid #e6e8f5; padding: 8px 12px; border-radius: 10px; }
        #loadBtn:hover { background: #f8f9ff; transform: translateY(-1px); }

        table { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; width: 100%; border: none; background: transparent; }
        tbody, thead, tfoot { display: contents; } /* 브라우저가 암묵적으로 끼워넣는 tbody가 grid 체인을 끊는 것을 방지 */
        tr { display: contents; }
        th, td { border: none; background: transparent; padding: 0; font-size: clamp(13px, 2.5vw, 15px); text-align: center; box-sizing: border-box; }
        th, .label { background: transparent; font-weight: 800; color: var(--primary-hover); font-size: 11px; letter-spacing: 0.3px; text-transform: uppercase; text-align: left; padding: 0 3px; }

        /* 시세/매매/신청금액 라벨행과 값행을 거의 붙여서 표시 (테이블 기본 row-gap 8px를 값행에서만 음수 마진으로 상쇄) */
        .price-row-value { margin-top: -8px; }
        #needAmountLabel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 1px; }
        .need-amount-pct-line { font-size: 10px; letter-spacing: 0; }

        .label-toggle { display: inline-flex; background: var(--primary-soft); border-radius: 8px; padding: 3px; gap: 2px; width: 100%; box-sizing: border-box; justify-content: space-between; border: 1px solid var(--primary-soft-border); }
        .label-toggle .toggle-btn { flex: 1; background: transparent; border: none; padding: 5px 0; font-size: 12px; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; box-shadow: none; transform: none; white-space: nowrap; }
        .label-toggle .toggle-btn:hover { color: var(--primary-hover); box-shadow: none; transform: none; }
        .label-toggle .toggle-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 4px rgba(43, 63, 150, 0.15); }

        .content-label-cell {
            grid-column: 1 / -1;
            background: var(--primary-soft);
            font-weight: bold;
            color: var(--primary-hover);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 14px;
            border-radius: 12px;
            position: relative;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
        }
        .content-label-cell #copyBtn { margin-left: 10px; }
        .content-row { grid-column: 1 / -1; background: #fff; text-align: left; vertical-align: top; padding: 0; border: 1.5px solid var(--border-color); border-radius: 12px; overflow: hidden; }

        textarea { width: 100%; height: 480px; resize: none; border: none; font-size: 15px; font-family: inherit; background: #fff; padding: 14px; box-sizing: border-box; outline: none; line-height: 1.55; }
        input[type="text"] { width: 100%; height: 100%; box-sizing: border-box; font-size: clamp(13px, 2.5vw, 15px); padding: 9px 10px; border: 1.5px solid var(--border-color); border-radius: 10px; background: var(--bg-table); transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; text-align: center; }
        /* 입력칸 하나만 들어있는 칸은 세로 중앙 정렬로 필드처럼 보이게 한다 (물건정보처럼 여러 칸이 합쳐진 셀은 제외) */
        td:has(> input[type="text"]) { display: flex; align-items: center; min-height: 40px; }
        td:has(> #currentDateTime) { display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 6px 4px; background: var(--bg-table); border: 1.5px solid var(--border-color); border-radius: 10px; }
        .current-datetime-text { font-weight: 600; color: var(--text-main); white-space: normal; word-break: keep-all; line-height: 1.1; text-align: center; }
        input[type="text"]:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(58, 82, 184, 0.12); }
        textarea::placeholder, input::placeholder { color: #a0aec0; }

        /* 물건정보: 라벨(밖) + 1번째 줄(단지명+타입+평수+동호수)/2번째 줄(주소+투기과열지구 배지)를 박스 하나 안에서 줄바꿈으로 표시 (개별 입력칸처럼 안 보이게 테두리/배경을 박스 하나로 통합) */
        .property-field-wrap { display: flex; flex-direction: column; gap: 4px; width: 100%; }
        .property-compound-label { font-weight: 800; color: var(--primary-hover); font-size: 11px; letter-spacing: 0.3px; text-transform: uppercase; text-align: left; padding: 0 3px; }
        .property-compound {
            display: flex; flex-direction: column; gap: 2px; width: 100%; box-sizing: border-box;
            border: 1.5px solid var(--border-color); border-radius: 10px; background: var(--bg-table);
            padding: 8px 10px; transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .property-compound:focus-within { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(58, 82, 184, 0.12); }
        .property-compound input[type="text"] { min-width: 0; border: none; background: transparent; padding: 0; height: auto; text-align: left; }
        .property-compound input[type="text"]:focus { border: none; box-shadow: none; background: transparent; }
        .property-line2 { display: flex; align-items: center; gap: 6px; }
        .property-address-input { flex: 1; min-width: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .apt-reg-badges { display: inline-flex; gap: 4px; flex-shrink: 0; }
        .apt-reg-badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; white-space: nowrap; line-height: 1.4; }
        .apt-reg-badge-danger { background: #fdeceb; color: #c0392b; }
        .apt-reg-badge-warning { background: #fdf3e2; color: #b9762a; }
        .field-span-2 { grid-column: 2 / -1; }
        .field-span-full { grid-column: 1 / -1; }

        .date-picker-field { cursor: pointer; background: linear-gradient(180deg, #ffffff 0%, #f5f7ff 100%); }
        .date-picker-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(58, 82, 184, 0.12); }
        .date-picker-popup { position: absolute; width: 310px; padding: 16px; border-radius: 18px; background: #ffffff; box-shadow: 0 18px 40px rgba(0,0,0,0.12); border: 1px solid rgba(98, 146, 234, 0.18); z-index: 1010; display: none; }
        .date-picker-popup.open { display: block; }
        .date-picker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .date-picker-month { font-weight: 700; color: #1c3a60; }
        .date-picker-nav { display: inline-flex; gap: 6px; }
        .date-picker-nav button { width: 36px; height: 36px; border: none; border-radius: 10px; background: #eef5ff; color: #1d4ed8; font-size: 18px; cursor: pointer; transition: transform 0.2s ease, background 0.2s ease; }
        .date-picker-nav button:hover { transform: translateY(-1px); background: #dbeafe; }
        .date-picker-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; color: #64748b; font-size: 12px; text-align: center; }
        .date-picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-cell { width: 100%; padding: 10px 0; border: none; border-radius: 12px; background: transparent; color: #334155; cursor: pointer; font-weight: 600; transition: background 0.2s ease, color 0.2s ease; }
        .calendar-cell:hover { background: var(--primary-soft); }
        .calendar-cell.selected { background: var(--primary); color: #fff; }
        .calendar-cell.empty { cursor: default; background: transparent; }
        .calendar-cell.today { border: 1px solid var(--primary-light); }

        .history-modal { position: fixed; top: 0; right: -450px; width: 420px; height: 100vh; background: #fff; box-shadow: -12px 0 40px rgba(43, 63, 150, 0.18); z-index: 1000; transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
        .history-modal.open { right: 0; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, var(--primary-soft) 0%, #fff 100%); }
        .modal-header h3 { margin: 0; font-size: 18px; color: var(--primary-hover); font-weight: 800; }
        .close-btn { background: none; border: none; font-size: 26px; line-height: 1; cursor: pointer; color: #94a3b8; padding: 0; width: 44px; height: 44px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; box-shadow: none; }
        .close-btn:hover { color: var(--primary-hover); background: var(--primary-soft); }

        .search-box-wrap { padding: 15px 20px; background: #fff; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; }
        .search-input { width: 50%; padding: 10px 12px; font-size: 14px; border: 1.5px solid var(--border-color); border-radius: 10px; box-sizing: border-box; background: var(--bg-table); transition: border 0.2s ease, box-shadow 0.2s ease; }
        .search-input:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(58, 82, 184, 0.12); }
        #historySearch { width: auto; flex: 1; } /* 버튼이 차지하는 만큼을 제외한 나머지를 검색창이 채움 */
        #syncNowBtn { flex: 0 0 auto; background: linear-gradient(135deg, #2b3f96 0%, #0f172a 100%); color: #fff; padding: 10px 14px; font-size: 13px; white-space: nowrap; border-radius: 10px; }
        #syncNowBtn:disabled { opacity: 0.6; cursor: default; }

        .modal-body { padding: 20px; overflow-y: auto; flex: 1; background: #f4f5fb; }

        .history-card { position: relative; background: #fff; border: 1px solid var(--border-color); border-left: 4px solid var(--primary-light); border-radius: 14px; padding: 14px 14px 14px 16px; margin-bottom: 12px; cursor: pointer; box-shadow: 0 3px 10px -4px rgba(43, 63, 150, 0.12); transition: all 0.2s ease; }
        .history-card:hover { border-color: var(--primary); border-left-color: var(--primary); transform: translateY(-2px); box-shadow: 0 10px 22px -8px rgba(58, 82, 184, 0.28); }
        .call-log-item:hover { background: var(--primary-soft); }
        .card-top { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); padding-right: 30px; }
        .card-user { font-size: 16px; font-weight: bold; color: #0f172a; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .card-phone { font-size: 14px; color: var(--primary); font-weight: 700; }
        .card-details { font-size: 13px; color: #475569; background: var(--primary-soft); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; }
        .card-memo { font-size: 13px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }

        .card-delete-btn { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 8px; background: #fef2f2; color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px solid #fee2e2; transition: all 0.2s; }
        .card-delete-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; transform: scale(1.05); }

        .loading-view { text-align: center; padding: 40px 0; color: #64748b; font-size: 14px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); z-index: 999; display: none; }
        .modal-overlay.open { display: block; }

        @media (max-width: 600px) {
            .table-wrap { margin: 10px; padding: 10px; }
            .top-actions { flex-wrap: nowrap; gap: 8px; }
            .left-actions, .right-actions { flex-shrink: 0; }
            .user-code-input { width: 90px !important; }
            textarea { font-size: 13px; }
            textarea { height: 320px; }
            .history-modal { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

<div class="table-wrap">
    <div class="top-actions">
        <div class="left-actions">
            <div id="authSection" class="user-auth-container">
                <input type="text" id="userCodeInput" class="user-code-input" placeholder="👤 사용자 이름" title="사용자 이름을 입력하세요" style="width: 125px !important;" onkeydown="if(event.key === 'Enter') submitUserCode()">
                <button type="button" id="authSubmitBtn" class="user-submit-btn" onclick="submitUserCode()">확인</button>
            </div>
            <span id="userDisplay" class="user-display-name" style="display: none;"></span>
        </div>
        <div class="right-actions">
            <button type="button" id="saveBtn">저장</button>
            <button type="button" id="loadBtn">불러오기</button>
        </div>
    </div>
    <table>
        <tr>
            <th>최근상담일시</th>
            <th>연락처</th>
            <th>고객명</th>
        </tr>
        <tr>
            <td><span id="currentDateTime" class="current-datetime-text"></span></td>
            <td><input type="text" placeholder="연락처 입력" inputmode="numeric"></td>
            <td><input type="text" placeholder="이름 입력" inputmode="text" lang="ko"></td>
        </tr>
        <tr>
            <td class="label">필요일자</td>
            <td class="label field-span-2">중개업소</td>
        </tr>
        <tr>
            <td><input type="text" id="needDateInput" class="date-picker-field" placeholder="예: 26/06/20" inputmode="numeric" autocomplete="off"></td>
            <td class="field-span-2"><input type="text" placeholder="중개업소 입력" inputmode="text" lang="ko"></td>
        </tr>
        <tr>
            <td class="field-span-full">
                <div class="property-field-wrap">
                    <div class="property-compound-label">물건정보</div>
                    <div class="property-compound">
                        <input type="text" id="propertyLineInput" class="property-line-input" placeholder="단지명 타입, 평수, 동호수" inputmode="text" lang="ko" autocomplete="off">
                        <div class="property-line2">
                            <input type="text" id="propertyAddressInput" class="property-address-input" placeholder="주소" inputmode="text" lang="ko" autocomplete="off">
                            <span id="propertyRegBadges" class="apt-reg-badges"></span>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        <tr>
            <td class="label price-row-label" style="padding: 4px 8px;">
                <div class="label-toggle">
                    <button type="button" class="toggle-btn active">KB시세</button>
                    <button type="button" class="toggle-btn">감정가</button>
                </div>
            </td>
            <td class="label price-row-label" style="padding: 4px 8px;">
                <div class="label-toggle">
                    <button type="button" class="toggle-btn active">매매가</button>
                    <button type="button" class="toggle-btn">보증금</button>
                </div>
            </td>
            <td class="label price-row-label" id="needAmountLabel">
                <span id="needAmountLabelMain">신청금액</span>
                <span id="needAmountLabelPct" class="need-amount-pct-line" style="display:none;"></span>
            </td>
        </tr>
        <tr>
            <td class="price-row-value"><input type="text" placeholder="예: 500,000,000" inputmode="numeric"></td>
            <td class="price-row-value"><input type="text" placeholder="예: 400,000,000" inputmode="numeric"></td>
            <td class="price-row-value"><input type="text" placeholder="예: 250,000,000" inputmode="numeric"></td>
        </tr>
        <tr>
            <td colspan="3" class="field-span-full" style="padding: 0;">
                <div class="content-label-cell">
                    <button type="button" id="resetBtn" style="background: var(--danger); color: #fff; border: none; border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.2);" onclick="resetAllFields()">초기화</button>
                    <span>상담내용</span>
                    <button type="button" id="copyBtn">복사</button>
                </div>
            </td>
        </tr>
        <tr>
            <td colspan="3" class="content-row">
                <textarea placeholder="상담내용을 입력해 주세요."></textarea>
            </td>
        </tr>
    </table>
</div>

<div class="date-picker-popup" id="datePickerPopup" aria-hidden="true">
    <div class="date-picker-header">
        <div class="date-picker-month">2026년 06월</div>
        <div class="date-picker-nav">
            <button type="button" class="nav-btn nav-prev" aria-label="이전 달">‹</button>
            <button type="button" class="nav-btn nav-next" aria-label="다음 달">›</button>
        </div>
    </div>
    <div class="date-picker-weekdays">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="date-picker-grid"></div>
</div>

<div class="modal-overlay" id="modalOverlay"></div>
<div class="history-modal" id="historyModal">
    <div class="modal-header">
        <h3 id="modalTitle">상담 히스토리 목록</h3>
        <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div class="search-box-wrap">
        <input type="text" class="search-input" id="historySearch" placeholder="이름, 연락처, 메모 등으로 검색">
        <button type="button" id="syncNowBtn">로컬에 저장</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
</div>

<script>
function proceedToApp(userName) {
    document.getElementById('authSection').style.display = 'none';
    const displayEl = document.getElementById('userDisplay');
    displayEl.textContent = `👤 ${userName}`;
    displayEl.style.display = 'inline-block';
    
    const inputEl = document.getElementById('userCodeInput');
    if(inputEl) inputEl.value = userName;
}

function submitUserCode() {
    const inputEl = document.getElementById('userCodeInput');
    const name = inputEl.value.trim().toUpperCase().replace(/\s/g, '');
    
    if (!name) {
        alert("사용자 이름을 입력해주세요.");
        return;
    }

    localStorage.setItem('calc_user_name', name);
    proceedToApp(name);
}

window.addEventListener('DOMContentLoaded', function() {
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbynY6KNzjtmWcEHxFdpV7S77uD-oRj_sX_dMhpjopftsWj_ceDB2P2lFJHjsdiSGPDf/exec';
    
    // 페이지 로드 시점 시간 표시용 (기존 유지)
    const nowInit = new Date();
    const yyInit = String(nowInit.getFullYear()).slice(-2);
    const mmInit = String(nowInit.getMonth() + 1).padStart(2, '0');

    function formatToCustomDate(str) {
        if (!str) return '';
        let digits = str.replace(/\D/g, '');
        if (digits.length > 6) digits = digits.slice(0, 6);

        let formatted = digits;
        if (digits.length >= 6) {
            formatted = digits.replace(/(\d{2})(\d{2})(\d{2})/, '$1/$2/$3');
            const parsed = parseCustomDate(formatted);
            if (parsed) {
                const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                formatted += ` (${dayNames[parsed.getDay()]})`;
            }
        } else if (digits.length >= 4) {
            formatted = digits.replace(/(\d{2})(\d{2})/, '$1/$2/');
        } else if (digits.length >= 2) {
            formatted = digits.replace(/(\d{2})/, '$1/');
        }
        return formatted;
    }

    function parseCustomDate(str) {
        if (!str) return null;
        const match = str.match(/(\d{2})\D*(\d{2})\D*(\d{2})/);
        if (!match) {
            const clean = str.replace(/\D/g, '');
            if(clean.length === 6) {
                return new Date(2000 + Number(clean.slice(0,2)), Number(clean.slice(2,4)) - 1, Number(clean.slice(4,6)));
            }
            return null;
        }
        const year = 2000 + Number(match[1]);
        const month = Number(match[2]) - 1;
        const day = Number(match[3]);
        return new Date(year, month, day);
    }

    function formatDisplayDate(date) {
        const yy = String(date.getFullYear()).slice(-2);
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        return `${yy}/${mm}/${dd} (${dayNames[date.getDay()]})`;
    }

    function renderDatePicker(year, month) {
        currentPickerYear = year;
        currentPickerMonth = month;
        datePickerMonth.textContent = `${year}년 ${String(month + 1).padStart(2, '0')}월`;
        datePickerGrid.innerHTML = '';

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const selectedDate = parseCustomDate(dateInput.value);
        const today = new Date();

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'calendar-cell empty';
            datePickerGrid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'calendar-cell';
            button.textContent = day;
            const cellDate = new Date(year, month, day);
            if (selectedDate && cellDate.toDateString() === selectedDate.toDateString()) {
                button.classList.add('selected');
            }
            if (cellDate.toDateString() === today.toDateString()) {
                button.classList.add('today');
            }
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                dateInput.value = formatDisplayDate(cellDate);
                closeDatePicker();
            });
            datePickerGrid.appendChild(button);
        }
    }

        const kbStatus = toggles[0].querySelector('.toggle-btn.active').textContent.trim();

            baseValue = Number(salePriceInput.value.replace(/\D/g, ''));
            baseLabel = secondToggleActive; // "보증금"

        if (baseValue && needValue) {
            const pct = (needValue / baseValue) * 100;

            needAmountLabelPct.textContent = `(${baseLabel} ${formattedPct}%)`;

        }
    }

    function parseServerDateTime(str) {
        const match = (str || '').match(/(\d{2})\/(\d{2})\/(\d{2})\D+(\d{2}):(\d{2})/);
        if (!match) return 0;
        const [, yy, mm, dd, hh, min] = match;
        return new Date(2000 + Number(yy), Number(mm) - 1, Number(dd), Number(hh), Number(min)).getTime();
    }

    async function findExistingByPhone(userCode, phone) {
        const cleanPhone = phone.replace(/\D/g, '');
        try {
            const res = await fetch(`${WEB_APP_URL}?action=read&userCode=${encodeURIComponent(userCode)}`);
            const data = await res.json();
            const matches = data.filter(item => (item.phone || '').replace(/\D/g, '') === cleanPhone);
            if (matches.length === 0) return null;
            matches.sort((a, b) => parseServerDateTime(b.dateTime) - parseServerDateTime(a.dateTime));
            return matches[0];
        } catch (err) {
            return null;
        }
    }

        const salePrice  = salePriceInput.value.trim();

        if(!userCode) { return alert('상담을 식별할 [사용자 이름]를 입력해 주세요.'); }
        if(!name || !phone) { return alert('최소한 이름과 연락처는 기입하셔야 저장 가능합니다.'); }

        const existing = await findExistingByPhone(userCode, phone);
        if (existing) {
            const overwrite = confirm(`[${phone}] 번호로 이미 저장된 상담 내역이 있습니다.\n(${existing.dateTime} / ${existing.name || '이름 없음'})\n\n해당 내역에 새 내용으로 덮어써서 저장하시겠습니까?`);
            if (!overwrite) return;
        }

        const formData = new URLSearchParams();
        formData.append('userCode', userCode);
        formData.append('dateTime', dateTime);
        formData.append('phone', phone);
        formData.append('name', name);
        formData.append('needDate', needDate);
        formData.append('needAmount', needAmount);
        formData.append('loanType', loanType);
        formData.append('memo', memo);

        formData.append('broker', broker);
        formData.append('kbStatus', kbStatus);
        formData.append('kbPrice', kbPrice);
        formData.append('saleStatus', saleStatus);
        formData.append('salePrice', salePrice);

        if (existing) {
            try {
                await fetch(`${WEB_APP_URL}?action=delete&userCode=${encodeURIComponent(userCode)}&dateTime=${encodeURIComponent(existing.dateTime)}&name=${encodeURIComponent(existing.name)}`);
            } catch (err) {
                return alert('기존 내역을 갱신하는 중 오류가 발생했습니다: ' + err);
            }
        }

        fetch(`${WEB_APP_URL}?action=insert`, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        })
        .then(() => {
            // Call Note 앱(안드로이드) 안에서 열려 있을 때만 존재하는 창구 — 로컬 캐시에도 즉시 반영해서
            // 다음 전화 수신 때 서버를 다시 안 타도 바로 뜨게 함. 일반 브라우저에서는 그냥 무시됨.
            if (window.AndroidBridge && window.AndroidBridge.saveLocalRecord) {
                window.AndroidBridge.saveLocalRecord(JSON.stringify({
                    userCode, dateTime, phone, name, needDate, needAmount, loanType, memo,
                    broker, kbStatus, kbPrice, saleStatus, salePrice
                }));
            }
            alert(`[${userCode}] 서버 최신 상담내역 저장을 요청했습니다.`);
            clearForm();
        })
        .catch(err => alert('서버 저장 오류: ' + err));
    });

    const openModal = () => { $('#historyModal').classList.add('open'); $('#modalOverlay').classList.add('open'); };
    const closeModal = () => { $('#historyModal').classList.remove('open'); $('#modalOverlay').classList.remove('open'); $('#historySearch').value = ''; };
    $('#closeModal').addEventListener('click', closeModal);
    $('#modalOverlay').addEventListener('click', closeModal);

    function loadHistoryData(onReady) {
        const userCode = userCodeInput.value.trim();
        if(!userCode) {
            closeModal();
            return alert('히스토리를 조회할 [사용자 이름]를 먼저 입력해 주세요.');
        }

        // Call Note 앱 안이면 로컬 캐시(하루 4회 동기화 + 저장 시 즉시 반영)를 그대로 사용 — 서버 호출 없음.
        // 검색해서 로컬에 없는 번호가 나오면 renderHistoryCards의 "서버에서 다시 검색" 버튼으로 그때만 요청함.
        if (window.AndroidBridge && window.AndroidBridge.getLocalRecords) {
            $('#modalTitle').textContent = `[${userCode}] 로컬 캐시 히스토리`;
            try {
                rawHistoryData = JSON.parse(window.AndroidBridge.getLocalRecords());
            } catch (e) {
                rawHistoryData = [];
            }
            renderHistoryCards(rawHistoryData);
            if (onReady) onReady();
            return;
        }

        // 일반 브라우저(Call Note 앱이 아님) — 기존처럼 서버에서 직접 조회
        $('#modalTitle').textContent = `[${userCode}] 서버 실시간 히스토리`;
        fetch(`${WEB_APP_URL}?action=read&userCode=${encodeURIComponent(userCode)}`)
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                $('#modalBody').innerHTML = `<div class="loading-view">[${userCode}] 시트에 등록된 상담 내역이 없습니다.</div>`;
                return;
            }
            rawHistoryData = data;
            renderHistoryCards(rawHistoryData);
        })
        .catch(err => {
            $('#modalBody').innerHTML = `<div class="loading-view" style="color:#e74c3c;">데이터 수신 실패.<br>(${err})</div>`;
        })
        .finally(() => {
            if (onReady) onReady();
        });
    }

    // 검색결과가 로컬 캐시에 없을 때, 사용자가 버튼을 눌러야만 서버로 해당 번호를 조회함(자동 요청 안 함)
    function searchServerByPhone() {
        const userCode = userCodeInput.value.trim();
        const query = (document.getElementById('historySearch').value || '').trim();
        if (!userCode || !query) return;

        $('#modalBody').innerHTML = '<div class="loading-view">서버에서 조회하는 중입니다...</div>';

        fetch(`${WEB_APP_URL}?action=readByPhone&userCode=${encodeURIComponent(userCode)}&phone=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
            if (data.length === 0) {
                $('#modalBody').innerHTML = '<div class="loading-view">서버에도 일치하는 내역이 없습니다.</div>';
                return;
            }
            // 다음부터는 로컬 캐시에서 바로 찾히도록 반영
            if (window.AndroidBridge && window.AndroidBridge.saveLocalRecord) {
                data.forEach(item => window.AndroidBridge.saveLocalRecord(JSON.stringify(item)));
            }
            renderHistoryCards(data);
        })
        .catch(err => {
            $('#modalBody').innerHTML = `<div class="loading-view" style="color:#e74c3c;">서버 조회 실패.<br>(${err})</div>`;
        });
    }

    // Call Note 앱(수신전화 팝업)에서 "상담일지 열기"를 누르면 호출되는 진입점
    window.injectCallData = function(phone, name, memo) {
        if (phone) phoneInput.value = phone;
        if (name) nameInput.value = name;

        const userCode = userCodeInput.value.trim();
        if (!userCode) return;

        $('#modalBody').innerHTML = '<div class="loading-view">상담 목록 데이터를 분석하는 중입니다...</div>';
        openModal();

        // 목록이 실제로 다 그려진 뒤(서버 응답 시점)에 검색창을 채워야 필터가 제대로 먹힘.
        // 고정 딜레이(setTimeout)로 추측하면 서버 응답이 늦을 때 빈 데이터에 필터를 걸게 되어,
        // 화면엔 번호가 입력돼 있어도 결과가 안 나오는 문제가 생김 (그 뒤 번호를 다시 입력해야 되던 원인).
        loadHistoryData(function() {
            const searchEl = document.getElementById('historySearch');
            if (searchEl && phone) {
                searchEl.value = phone;
                searchEl.dispatchEvent(new Event('input'));
            }
        });
    };

    // 팝업을 거치지 않고 나중에 앱을 직접 열었을 때, 아직 통화 중인 번호가 있으면 연락처 칸만 채워줌
    window.fillActivePhone = function(phone) {
        if (phone && phoneInput) phoneInput.value = phone;
    };

    // 통화 중에 앱을 열었을 때 연락처 칸만 채우는 게 아니라, 히스토리 검색까지 화면에 안 띄우고 미리 해둠
    // (모달을 열지 않은 채 modalBody/검색창만 채워두는 것 — openModal()을 안 부르므로 화면엔 아무 변화 없음).
    // 나중에 사용자가 '불러오기'를 누르면 이미 그 번호로 필터링된 결과가 바로 보임.
    window.prefetchActiveCall = function(phone) {
        if (!phone) return;
        fillActivePhone(phone);

        const userCode = userCodeInput.value.trim();
        if (!userCode) return;

        loadHistoryData(function() {
            const searchEl = document.getElementById('historySearch');
            if (searchEl) {
                searchEl.value = phone;
                searchEl.dispatchEvent(new Event('input'));
            }
        });
    };

    document.getElementById('loadBtn').addEventListener('click', function() {
        const userCode = userCodeInput.value.trim();
        if(!userCode) { return alert('상담원 식별을 위해 [사용자 이름]를 먼저 입력해 주세요.'); }
        $('#modalBody').innerHTML = '<div class="loading-view">상담 목록 데이터를 분석하는 중입니다...</div>';
        openModal();

        // 연락처 칸에 이미 번호가 입력돼 있으면, 목록이 다 뜬 뒤 검색창에도 그대로 채워서 바로 필터링해줌
        const prefilledPhone = phoneInput.value.trim();
        loadHistoryData(function() {
            const searchEl = document.getElementById('historySearch');
            if (searchEl && prefilledPhone) {
                searchEl.value = prefilledPhone;
                searchEl.dispatchEvent(new Event('input'));
            }
        });
    });

    // "로컬에 저장" — 하루 4회 자동 동기화를 기다리지 않고, 그 자리에서 서버 자료를 로컬 캐시로 즉시 반영
    document.getElementById('syncNowBtn').addEventListener('click', function() {
        if (!(window.AndroidBridge && window.AndroidBridge.syncNowBlocking)) {
            return alert('이 기능은 Call Note 앱 안에서만 사용할 수 있습니다.');
        }
        const btn = this;
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '동기화 중...';

        // 버튼 텍스트가 화면에 반영된 뒤에 블로킹 호출을 실행(그렇지 않으면 텍스트 변경 전에 멈춰버림)
        setTimeout(function() {
            let ok = false;
            try { ok = window.AndroidBridge.syncNowBlocking(); } catch (e) { ok = false; }

            btn.disabled = false;
            btn.textContent = originalText;

            if (ok) {
                alert('서버 자료를 로컬에 저장했습니다.');
                if (document.getElementById('historyModal').classList.contains('open')) {
                    loadHistoryData();
                }
            } else {
                alert('동기화에 실패했습니다. 네트워크 상태를 확인해주세요.');
            }
        }, 50);
    });

    function renderHistoryCards(list) {
        if(list.length === 0) {
            const currentSearch = (document.getElementById('historySearch').value || '').trim();
            if (currentSearch) {
                $('#modalBody').innerHTML = `
                    <div class="loading-view">
                        로컬에서 일치하는 내역이 없습니다.<br><br>
                        <button type="button" id="serverSearchBtn" style="background:#0f172a;color:#fff;">서버에서 다시 검색</button>
                    </div>`;
                const btn = document.getElementById('serverSearchBtn');
                if (btn) btn.addEventListener('click', searchServerByPhone);
            } else {
                $('#modalBody').innerHTML = '<div class="loading-view">등록된 상담 내역이 없습니다.</div>';
            }
            return;
        }
        let html = '';
        list.forEach((item, index) => {
            let cardDate = item.needDate ? item.needDate.trim() : '-';
            let cleanAmount = item.needAmount ? item.needAmount.replace(/\D/g, '') : '';
            let cardAmount = cleanAmount ? Number(cleanAmount).toLocaleString('ko-KR') : '-';
            let cardBroker = item.broker ? ` | 업소: ${item.broker}` : '';

            html += `
                <div class="history-card" data-idx="${index}">
                    <div class="card-delete-btn" data-idx="${index}" title="삭제">&times;</div>
                    <div class="card-top">
                        <span>${item.dateTime || '시간 정보 없음'}</span>
                        <span style="font-weight:bold; color:#475569;">[${item.userCode || '공통'}]</span>
                    </div>
                    <div class="card-user">
                        <span>${item.name || '미입력'}</span>
                        <span class="card-phone">${item.phone || '연락처 없음'}</span>
                    </div>
                    <div class="card-details">
                        일자: ${cardDate} | 금액: ${cardAmount} | 구분: ${item.loanType || '-'}${cardBroker}
                    </div>
                    <div class="card-memo">${item.memo ? item.memo.replace(/\n/g, ' ') : '상담내용 요약 없음'}</div>
                </div>
            `;
        });
        $('#modalBody').innerHTML = html;

        document.querySelectorAll('.history-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if(e.target.classList.contains('card-delete-btn')) return;

                const targetIdx = this.getAttribute('data-idx');
                const selectData = list[targetIdx];

                document.getElementById('currentDateTime').textContent = selectData.dateTime;
                phoneInput.value = selectData.phone;
                nameInput.value = selectData.name;
                dateInput.value = selectData.needDate ? selectData.needDate.trim() : '';
                
                let numericAmount = selectData.needAmount ? selectData.needAmount.replace(/\D/g, '') : '';
                moneyInput.value = numericAmount ? Number(numericAmount).toLocaleString('ko-KR') : '';

                setPropertyInfoText(selectData.loanType);
                contentInput.value = selectData.memo;
                
                brokerInput.value = selectData.broker || '';
                kbPriceInput.value = selectData.kbPrice || '';
                salePriceInput.value = selectData.salePrice || '';
                
                document.querySelectorAll('.label-toggle').forEach((toggle, toggleIdx) => {
                    const btns = toggle.querySelectorAll('.toggle-btn');
                    const targetStatus = toggleIdx === 0 ? selectData.kbStatus : selectData.saleStatus;
                    if (targetStatus) {
                        btns.forEach(b => {
                            if (b.textContent.trim() === targetStatus.trim()) b.classList.add('active');
                            else b.classList.remove('active');
                        });
                    }
                });

                updateAmountPercentage();

                const wrap = $('.table-wrap');
                wrap.style.transition = 'background 0.1s';
                wrap.style.background = '#e3effa';
                setTimeout(() => { wrap.style.background = '#fff'; }, 250);

                closeModal();
            });
        });

        document.querySelectorAll('.card-delete-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation(); 
                const targetIdx = this.getAttribute('data-idx');
                const targetData = list[targetIdx];
                const currentUserCode = userCodeInput.value.trim();

                if(!confirm(`[${targetData.name || '미입력'}] 님의 상담 내역을 정말 삭제하시겠습니까?`)) return;

                $('#modalBody').innerHTML = '<div class="loading-view">서버에서 데이터를 삭제 중입니다...</div>';
                const deleteUrl = `${WEB_APP_URL}?action=delete&userCode=${encodeURIComponent(currentUserCode)}&dateTime=${encodeURIComponent(targetData.dateTime)}&name=${encodeURIComponent(targetData.name)}`;

                fetch(deleteUrl, { method: 'GET' })
                .then(res => res.text())
                .then(result => {
                    if(result === "성공") {
                        alert('서버에서 해당 상담 내역이 삭제되었습니다.');
                    } else {
                        alert('삭제 실패: ' + result);
                    }
                    loadHistoryData();
                })
                .catch(err => {
                    alert('통신 실패: ' + err);
                    loadHistoryData();
                });
            });
        });
    }

    // 상담일지 LocalStorage 저장 함수
    function saveConsultingInputs() {
        const inputData = {
            userCode: userCodeInput.value,
            phone: phoneInput.value,
            name: nameInput.value,
            needDate: dateInput.value,
            needAmount: moneyInput.value,
            loanType: getPropertyInfoText(),
            content: contentInput.value,
            broker: brokerInput.value,
            kbPrice: kbPriceInput.value,
            salePrice: salePriceInput.value
        };
        localStorage.setItem('consulting_inputs', JSON.stringify(inputData));
    }

    // 상담일지 LocalStorage 로드 함수
    function loadConsultingInputs() {
        const savedData = localStorage.getItem('consulting_inputs');
        if (savedData) {
            try {
                const data = JSON.parse(savedData);
                if (data.userCode) userCodeInput.value = data.userCode;
                if (data.phone) phoneInput.value = data.phone;
                if (data.name) nameInput.value = data.name;
                if (data.needDate) dateInput.value = data.needDate;
                if (data.needAmount) moneyInput.value = data.needAmount;
                if (data.loanType) setPropertyInfoText(data.loanType);
                if (data.content) contentInput.value = data.content;
                if (data.broker) brokerInput.value = data.broker;
                if (data.kbPrice) kbPriceInput.value = data.kbPrice;
                if (data.salePrice) salePriceInput.value = data.salePrice;
                updateAmountPercentage();
            } catch (e) {
                console.warn('Failed to load consulting data:', e);
            }
        }
    }

    // 자동 저장 설정
    function setupConsultingAutoSave() {
        [userCodeInput, phoneInput, nameInput, dateInput, moneyInput,
         propertyLineInput, propertyAddressInput,
         contentInput, brokerInput, kbPriceInput, salePriceInput].forEach(input => {
            if (input) {
                input.addEventListener('change', saveConsultingInputs);
                input.addEventListener('input', saveConsultingInputs);
            }
        });
    }

    // 페이지 로드 시 저장된 데이터 복원
    loadConsultingInputs();
    setupConsultingAutoSave();

    $('#historySearch').addEventListener('input', function(e) {
        const keyword = e.target.value.toLowerCase().trim();
        const keywordDigits = keyword.replace(/\D/g, '');
        const filtered = rawHistoryData.filter(item => {
            const name = (item.name || '').toLowerCase();
            const phone = (item.phone || '').toLowerCase();
            const phoneDigits = phone.replace(/\D/g, '');
            const memo = (item.memo || '').toLowerCase();
            const loanType = (item.loanType || '').toLowerCase();
            const needAmount = (item.needAmount || '').toLowerCase();
            const needDate = (item.needDate || '').toLowerCase();

            const broker = (item.broker || '').toLowerCase();
            const kbPrice = (item.kbPrice || '').toLowerCase();
            const salePrice = (item.salePrice || '').toLowerCase();

            const phoneMatch = keywordDigits ? phoneDigits.includes(keywordDigits) : phone.includes(keyword);

            return name.includes(keyword) ||
                   phoneMatch ||
                   memo.includes(keyword) ||
                   loanType.includes(keyword) ||
                   needAmount.includes(keyword) ||
                   needDate.includes(keyword) ||
                   broker.includes(keyword) ||
                   kbPrice.includes(keyword) ||
                   salePrice.includes(keyword);
        });
        renderHistoryCards(filtered);
    });
});
  </script>

  <script>
    // 부모(index.html)에서 호출할 전체 필드 초기화 함수
    function resetAllFields() {
      // 모든 입력 필드 초기화 (서버저장 체크박스, 사용자 이름 입력창 제외)
      const inputs = document.querySelectorAll('input[type="text"], input[type="tel"], input[type="number"], select, textarea');
      inputs.forEach(input => {
        if (input.id === 'userCodeInput') return; // 사용자 이름은 초기화 대상이 아님
        input.value = '';
      });

      // 체크박스 초기화
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(checkbox => {
        checkbox.checked = false;
      });

      // 물건정보 투기과열지구/조정대상지역 배지 초기화
      const regBadges = document.getElementById('propertyRegBadges');
      if (regBadges) regBadges.innerHTML = '';

      // 주요 필드들 초기화 (사용자 이름은 유지)
      const mainFields = [
        'phoneInput', 'nameInput', 'dateInput',
        'needDateInput', 'moneyInput', 'contentInput',
        'propertyLineInput', 'propertyAddressInput',
        'brokerInput', 'kbPriceInput', 'salePriceInput'
      ];
      
      mainFields.forEach(fieldId => {
        const field = document.getElementById(fieldId);
        if (field) {
          if (field.type === 'checkbox') {
            field.checked = false;
          } else {
            field.value = '';
          }
        }
      });

      // 현재 시간 업데이트
      const currentDateTime = document.getElementById('currentDateTime');
      if (currentDateTime) {
        const now = new Date();
        const year = String(now.getFullYear()).slice(-2);
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        currentDateTime.textContent = `${year}/${month}/${day} ${hours}:${minutes}`;
      }

      // localStorage에서 상담 관련 데이터 삭제
      const keys = Object.keys(localStorage);
      keys.forEach(key => {
        if (key.includes('상담') || key.includes('consulting')) {
          localStorage.removeItem(key);
        }
      });

      // 사용자 이름은 초기화 대상이 아님 — 혹시라도 비워졌다면 저장된 원래 값으로 다시 채워줌
      const savedUserCode = localStorage.getItem('calc_user_name');
      const userCodeEl = document.getElementById('userCodeInput');
      if (savedUserCode && userCodeEl && !userCodeEl.value) {
        userCodeEl.value = savedUserCode;
      }

      // 모달 창 닫기
      const modalOverlay = document.getElementById('modalOverlay');
      if (modalOverlay) {
        modalOverlay.style.display = 'none';
      }
    }
  </script>

  <script>
    // 표 안 텍스트 입력칸: 내용이 칸 폭보다 길면 글자를 줄이고, 짧아지면 원래 크기로 다시 키운다.
    // 값이 타이핑/불러오기/전화번호 자동입력 등 어디서 바뀌든 다 반영되도록 value 세터 자체를 감싼다
    // (호출 지점이 여러 곳에 흩어져 있어 하나하나 찾아 고치는 대신 이 방식이 안전함).
    (function () {
      const ghost = document.createElement('span');
      ghost.style.position = 'absolute';
      ghost.style.visibility = 'hidden';
      ghost.style.whiteSpace = 'pre';
      ghost.style.left = '-9999px';
      ghost.style.top = '-9999px';
      document.body.appendChild(ghost);

      function fitTableInputFontSize(input) {
        if (!input || input.type !== 'text' || !input.closest('table')) return;
        if (!input.dataset.origSize) {
          input.dataset.origSize = window.getComputedStyle(input).fontSize;
        }
        const origSize = parseFloat(input.dataset.origSize);
        const maxWidth = input.clientWidth - 18; // 좌우 padding(8px*2) + 커서 여유분 감안
        if (maxWidth <= 0) { input.style.fontSize = input.dataset.origSize; return; }

        const cs = window.getComputedStyle(input);
        ghost.style.fontFamily = cs.fontFamily;
        ghost.style.fontWeight = cs.fontWeight;

        let size = origSize;
        ghost.style.fontSize = size + 'px';
        ghost.textContent = input.value || input.placeholder || '';
        while (size > 9 && ghost.offsetWidth > maxWidth) {
          size -= 0.5;
          ghost.style.fontSize = size + 'px';
        }
        input.style.fontSize = size + 'px';
      }

      function fitAllTableInputFontSizes() {
        document.querySelectorAll('table input[type="text"]').forEach(fitTableInputFontSize);
      }

      const nativeValueDescriptor = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
      Object.defineProperty(HTMLInputElement.prototype, 'value', {
        configurable: true,
        get() { return nativeValueDescriptor.get.call(this); },
        set(v) {
          nativeValueDescriptor.set.call(this, v);
          fitTableInputFontSize(this);
        },
      });

      document.querySelectorAll('table input[type="text"]').forEach(input => {
        input.addEventListener('input', () => fitTableInputFontSize(input));
      });
      window.addEventListener('resize', fitAllTableInputFontSizes);
      fitAllTableInputFontSizes();
    })();
  </script>
