    /* 프레임 간격 조절 리사이저 바 */

    /* 항상 보이는 손잡이 막대 - hover 전에는 회색으로 은은하게, hover/드래그 중엔 파란색으로 */

    /* 맨 오른쪽 프레임에는 짝이 될 프레임이 없으므로 리사이저를 숨긴다.

    /* 일반 모바일 환경(768px 미만): content-container 프레임 1개만 표시 */

  <script src="gate-auth.js?v=usage-off-1"></script>
  <script>
    /* ──────────────────
       index.html 인라인 스크립트 구성
       이 파일은 iframe 두 개를 담는 "앱 셸"이다. 아래 순서로 쌓인다.
         1) 상수·설정        - 값이 바뀌면 대부분 여기만 고치면 된다
         2) 저장소 계층      - localStorage 읽기/쓰기의 유일한 통로
         3) 프레임 이동       - iframe 하나를 특정 화면으로 옮긴다
         4) 프레임 배치       - 표시 여부·순서·너비
         5) 화면 전환(nav)    - 상단 버튼이 부르는 진입점
         6) 진입·이름 처리     - 이름 등록과 첫 화면 결정
         7) 사용자 조작 바인딩 - 길게 누르기·터치 피드백·드래그·리사이저
       전역 함수(loadPage, initPages, submitUserName)는 HTML의 onclick/
       onload에서 직접 부르므로 이름과 전역 노출을 유지해야 한다.
       ────────────────── */

    /* 1) 상수·설정 ───────────────── */

    // iframe URL 캐시 무효화용 버전. 캐시를 비우려면 이 값만 올리면 된다.
    const APP_VERSION = '250605_1';

    // 저장 키 모음. 키가 흩어져 있으면 오타로 조용히 데이터가 분리된다.
    const STORAGE_KEYS = {
      userName: 'calc_user_name',
      frameOrder: 'frame_order',
      frameWidths: 'frame_widths',
      frameVisibility: 'frame_visibility'
    };

    // 접을 수 있는 프레임(본문은 항상 표시).
    const TOGGLEABLE_FRAMES = ['calc-container'];

    // 계산기 프레임에 기본으로 띄우는 화면.
    const CALC_FRAME_PAGE = '계산기.html';

    // 프레임을 접을 때 남은 프레임의 최소 폭(px). 리사이저와 같은 값을 쓴다.
    const MIN_FRAME_WIDTH = 80;

    /* 2) 저장소 계층 ─────────────────
       localStorage 접근을 아래 다섯 함수로만 제한한다. 키 이름이나 파싱 규칙이
       바뀔 때 고칠 곳이 한 곳으로 줄고, 저장소가 막힌 환경(사파리 시크릿 모드·
       용량 초과)에서도 화면 조작이 죽지 않는다. */

    // 저장된 JSON을 읽는다. 없거나 손상됐으면 fallback을 돌려준다.
    function readStoredJson(key, fallback = null) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        // 손상된 값을 그대로 두면 매번 같은 오류가 반복되므로 지우고 넘어간다.
        console.warn(`저장 데이터가 손상되어 초기화했습니다: ${key}`, e);
        try { localStorage.removeItem(key); } catch (_) { /* 무시 */ }
        return fallback;
      }
    }

    function writeStoredJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.warn(`저장에 실패했습니다: ${key}`, e);
      }
    }

    function readStoredText(key, fallback = '') {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : raw;
      } catch (e) {
        return fallback;
      }
    }

    function writeStoredText(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        console.warn(`저장에 실패했습니다: ${key}`, e);
      }
    }

    function removeStoredText(key) {
      try {
        localStorage.removeItem(key);
      } catch (e) {
        // 저장소 접근이 막힌 환경은 지우지 못해도 화면 동작에 영향이 없다.
      }
    }

    /* 3) 프레임 이동 ───────────────── */

    /* 프레임이 지금 어느 화면을 띄우고 있는지 기록한다.

       location.replace()로 이동하면 iframe의 src "속성"은 처음 값('') 그대로 남는다.
       그래서 src만 보고 판단하면 MCG를 띄워놨어도 "아직 아무것도 안 띄웠다"고 오해해
       DSR로 되돌려버린다(updateFramesSrc 참고). data-page에 따로 적어두고 그걸 본다.
       src를 직접 바꾸면 화면이 다시 로드되므로 속성 대신 dataset을 쓴다. */
    function 프레임이동(frame, page) {
      if (!frame) return;

      /* 같은 페이지를 다시 이동시키지 않는다.
         resize·가상 키보드·인증 상태 갱신으로 updateFramesSrc()가 재호출되어도
         이미 상담 화면이 떠 있으면 location.replace()를 다시 실행하지 않는다.
         이 중복 이동이 메인 상담 프레임이 계속 새로고침되는 것처럼 보이는 원인이다. */
      if (frame.dataset.page === page) return;

      /* data-page를 먼저 적는다.

         location.replace()를 부른 직후 resize가 끼어들면(가상 키보드·스크롤바·창 크기 변경),
         아직 data-page가 비어 있는 상태로 updateFramesSrc()가 다시 돌아
         "아직 아무것도 안 띄운 프레임"으로 오해하고 같은 페이지를 또 불러온다
         - 첫 번째 프레임이 계속 새로고침되는 것처럼 보이는 원인이다.
         먼저 적어두면 두 번째 호출이 이미 채워진 프레임으로 보고 건너뛴다. */
      frame.dataset.page = page;

      const url = `${page}?v=${APP_VERSION}`;
      if (frame.contentWindow) {
        frame.contentWindow.location.replace(url);
      } else {
        frame.setAttribute('src', url);
      }
    }

    function 현재페이지(frame) {
      if (!frame) return '';
      return frame.dataset.page || frame.getAttribute('src') || '';
    }

    /* 프레임에 기억된 화면을 다시 로드한다.
       iframe이 DOM에서 재부착되면 브라우저가 처음부터 다시 읽어 화면이 비는데,
       dataset.page는 그대로 남아 있어 여기서 복구할 수 있다. */
    function reloadFrameFromMemory(frame) {
      if (frame && frame.dataset.page) 프레임이동(frame, frame.dataset.page);
    }

    function 사용항목명(page) {
      const pageItems = {
        'Consult_Main.html': '상담',
        'DTI.html': 'DTI 계산',
        'DSR_Main.html': 'DSR 계산',
        '날짜계산기.html': '날짜계산',
        'gonsi.html': '공시가조회',
        'IDCard.html': '신분증변환',
        '문서스캔.html': '문서스캔',
        'MCG.html': 'MCG 계산'
      };
      return pageItems[page] || '';
    }

    /* 5) 화면 전환(nav) ─────────────────
       상단 네비게이션 버튼이 직접 부르는 진입점. HTML의 onclick에서 참조하므로
       이름을 바꾸면 안 된다. */
    function loadPage(page, element) {
      const item = 사용항목명(page);
      const contentFrame = document.getElementById('content-frame');
      const alreadyShowing = 현재페이지(contentFrame) === page;

      // 같은 페이지를 다시 누른 경우에는 체류 타이머를 초기화하지 않는다.
      if (!alreadyShowing) {
        // 현재 화면을 떠나기 전에 10초 이상 사용한 항목을 확정한다.
        flushActiveButtonUsage();
        startButtonUsageTracking(item);
      }

      // 모든 페이지는 본문 프레임(content-frame)에 띄운다
      프레임이동(document.getElementById('content-frame'), page);

      if (element) {
        const buttons = document.querySelectorAll('.button-container button.nav-btn');
        buttons.forEach(btn => btn.classList.remove('active-nav'));
        element.classList.add('active-nav');
      }
    }

    /* ── 프레임 표시 여부 ──────────────────────────────────────────
       본문(content-container)은 항상 표시하고, 계산기만 켜고 끈다.
       처음 열었을 때 기본값은 창 너비와 무관하게 계산기만 펼친다.

       DSR이 가로로 잘린다. 그래서 태블릿 폭에서는 상담일지를 접은 2분할로 시작한다.
       한 번이라도 사용자가 칩을 누르면 그 선택이 저장되어 기본값보다 우선한다. */
    // 접을 수 있는 프레임의 기본 표시 상태.
    function defaultFrameVisibility() {
      return { 'calc-container': true };
    }

    function getFrameVisibility() {
      const visibility = defaultFrameVisibility();
      const saved = readStoredJson(STORAGE_KEYS.frameVisibility, null);
      if (saved && typeof saved === 'object') {
        TOGGLEABLE_FRAMES.forEach(id => {
          if (typeof saved[id] === 'boolean') visibility[id] = saved[id];
        });
      }
      return visibility;
    }

    function applyFrameVisibility(visibility, { 균등분배 = false } = {}) {
      TOGGLEABLE_FRAMES.forEach(id => {
        const container = document.getElementById(id);
        if (container) container.classList.toggle('is-hidden', !visibility[id]);

        const chip = document.querySelector(`.frame-toggle[data-target="${id}"]`);
        if (chip) {
          chip.classList.toggle('active', visibility[id]);
          chip.setAttribute('aria-pressed', String(visibility[id]));
        }
      });
      markLastVisibleFrame();
      redistributeVisibleFrames(균등분배);
    }

    /* 프레임을 접으면 남은 프레임들의 flex-grow 합이 1보다 작아진다.
       (예: 0.33/0.33/0.33 중 하나를 접으면 합이 0.67) flex는 grow 합이 1 미만이면
       남는 공간을 "분배하지 않고 그대로 비워두기" 때문에, 접은 프레임 자리가 빈 채로
       남는다. 그래서 접거나 펼칠 때마다 남은 프레임의 비율을 합이 1이 되도록 다시 맞춘다.

       균등분배=true  → 개수에 맞춰 똑같이 나눈다 (2개면 5:5, 3개면 3:3:3). 사용자가 칩을 눌렀을 때.
       균등분배=false → 지금 비율을 유지한 채 합만 1로 맞춘다. 새로고침 시 직접 조절한 폭을 살리려고. */
    function redistributeVisibleFrames(균등분배) {
      const 보이는프레임 = visibleFrameContainers();
      if (!보이는프레임.length) return;

      const 현재 = 보이는프레임.map(fc => parseFloat(fc.style.flexGrow) || 1);
      const 합 = 현재.reduce((a, b) => a + b, 0) || 1;
      const 비율들 = 균등분배
        ? 보이는프레임.map(() => 1 / 보이는프레임.length)
        : 현재.map(v => v / 합);

      applyFrameFlexRatios(보이는프레임, 비율들);
    }

    /* flex-basis를 0%로 두고 비율만 grow에 넣는다.
       이렇게 하면 창 너비가 달라져도 비율이 그대로 유지되어 항상 전체를 채운다. */
    function applyFrameFlexRatios(frames, ratios) {
      frames.forEach((fc, i) => {
        const ratio = ratios[i];
        fc.style.flex = `${ratio} ${ratio} 0%`;
      });
    }

    // 화면상 마지막 프레임에 표시를 남겨 그 리사이저를 숨긴다(CSS 참고)
    function markLastVisibleFrame() {
      const 보이는프레임 = visibleFrameContainers();
      document.querySelectorAll('.frame-container').forEach(fc => fc.classList.remove('is-last-visible'));
      if (보이는프레임.length) 보이는프레임[보이는프레임.length - 1].classList.add('is-last-visible');
    }

    function initFrameToggles() {
      applyFrameVisibility(getFrameVisibility());

      document.querySelectorAll('.frame-toggle').forEach(chip => {
        chip.addEventListener('click', () => {
          const id = chip.dataset.target;
          const visibility = getFrameVisibility();
          visibility[id] = !visibility[id];
          writeStoredJson(STORAGE_KEYS.frameVisibility, visibility);
          // 칩을 눌렀을 때는 개수에 맞춰 균등하게(2개면 5:5, 3개면 3:3:3) 바로 다시 나눈다
          applyFrameVisibility(visibility, { 균등분배: true });
          // 남은 프레임들이 새 폭을 차지했으므로 그 비율을 다시 저장해 둔다
          updateFrameWidths();
        });
      });
    }

    // 프레임 순서 저장 함수
    function updateFrameOrder() {
      const order = visibleFrameContainers(true).map(container => container.id);
      writeStoredJson(STORAGE_KEYS.frameOrder, order);
      markLastVisibleFrame();   // 순서가 바뀌면 화면상 마지막 프레임도 바뀐다
    }

    /* 프레임 컨테이너 목록. includeHidden=true면 접힌 프레임까지 모두 돌려준다.
       "보이는 프레임"을 고르는 조건이 여러 함수에 흩어져 있어
       한 곳으로 모았다(접힘 여부 판단의 단일 기준). */
    function visibleFrameContainers(includeHidden = false) {
      const all = [...document.querySelectorAll('.frame-container')];
      return includeHidden ? all : all.filter(fc => !fc.classList.contains('is-hidden'));
    }

    /* 프레임의 테두리(좌+우) 두께. flex-basis가 0%일 때 브라우저는 테두리를 먼저
       떼어놓고 남은 공간만 비율대로 나누므로, 비율을 만드는 쪽과 쓰는 쪽 모두
       "안쪽 폭"을 써야 어긋나지 않는다. */
    function frameBorderWidth(fc) {
      const cs = getComputedStyle(fc);
      return (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0);
    }

    // 프레임 너비 저장 함수 (창 너비 대비 "비율"로 저장 → 창 크기가 달라져도 항상 전체 너비를 채움)
    function updateFrameWidths() {
      const containers = [...document.querySelectorAll('.frame-container')];

      const 저장된비율 = readFrameWidthRatios();

      /* 접어둔 프레임은 폭이 0이라 그대로 저장하면 비율 0으로 굳어버린다.
         (다시 펼쳤을 때 폭이 0인 채로 복원됨) 그래서 보이는 것만 새로 재고,
         접힌 프레임은 접기 직전의 비율을 그대로 유지한다.
         폭은 반드시 "테두리를 뺀 안쪽 폭"으로 재야 한다(frameBorderWidth 참고). */
      const 보이는프레임 = visibleFrameContainers().filter(fc => fc.getBoundingClientRect().width > 0);
      const 안쪽폭 = new Map(보이는프레임.map(fc => [fc.id, fc.getBoundingClientRect().width - frameBorderWidth(fc)]));
      const 합 = [...안쪽폭.values()].reduce((a, b) => a + b, 0);
      if (합 <= 0) return;

      const widths = containers.map(container => ({
        id: container.id,
        ratio: 안쪽폭.has(container.id)
          ? 안쪽폭.get(container.id) / 합
          : (저장된비율[container.id] ?? 1)
      }));
      writeStoredJson(STORAGE_KEYS.frameWidths, widths);
    }

    /* 저장된 프레임 폭을 { id: ratio } 맵으로 돌려준다.
       구버전 데이터({width: px})는 총합으로 나눠 비율로 환산한다. */
    function readFrameWidthRatios() {
      const saved = readStoredJson(STORAGE_KEYS.frameWidths, []);
      if (!Array.isArray(saved)) return {};

      const totalLegacyWidth = saved.reduce((sum, item) => sum + (item && item.width || 0), 0);
      const ratios = {};
      saved.forEach(item => {
        if (!item || !item.id) return;
        let ratio = item.ratio;
        if (ratio == null && item.width != null && totalLegacyWidth > 0) {
          ratio = item.width / totalLegacyWidth;
        }
        ratios[item.id] = ratio;
      });
      return ratios;
    }

    /* 저장된 프레임 설정(순서·너비)을 복원한다.
       두 복원은 서로 독립적이므로 각각 따로 실패해도 다른 쪽이 살아남도록
       별도 함수로 나누고, 한쪽 실패가 다른 쪽을 막지 않게 한다. */
    function loadFrameSettings() {
      try {
        restoreFrameOrder();
      } catch (e) {
        console.error('프레임 순서 복원 실패:', e);
      }
      try {
        restoreFrameWidths();
      } catch (e) {
        console.error('프레임 너비 복원 실패:', e);
      }
    }

    /* 저장된 순서로 프레임을 재배치한다.

       appendChild()는 이미 같은 자리에 있는 요소라도 DOM에서 떼었다 다시 붙이므로
       (move 조작) 그 안의 iframe이 처음부터 다시 로드된다. 지금 순서가 이미 저장된
       순서와 같으면 건드리지 않아 진입 직후 프레임이 한 번 더 새로고침되는 현상을 막는다. */
    function restoreFrameOrder() {
      const order = readStoredJson(STORAGE_KEYS.frameOrder, null);
      if (!Array.isArray(order) || !order.length) return;

      const mainWrapper = document.querySelector('.main-wrapper');
      if (!mainWrapper) return;

      const containerMap = {};
      document.querySelectorAll('.frame-container').forEach(container => {
        containerMap[container.id] = container;
      });

      const 현재순서 = [...mainWrapper.querySelectorAll('.frame-container')].map(c => c.id);
      const 저장된순서 = order.filter(id => containerMap[id]);
      const 순서가같다 = 현재순서.length === 저장된순서.length
        && 현재순서.every((id, i) => id === 저장된순서[i]);
      if (순서가같다) return;

      order.forEach(id => {
        if (containerMap[id]) mainWrapper.appendChild(containerMap[id]);
      });

      // 재부착으로 화면이 비었으므로 기억해 둔 화면으로 되돌린다.
      mainWrapper.querySelectorAll('.frame-container iframe').forEach(reloadFrameFromMemory);
    }

    /* 저장된 비율로 프레임 폭을 복원한다(항상 창 전체 너비를 채운다). */
    function restoreFrameWidths() {
      const ratios = readFrameWidthRatios();
      const frames = [];
      const 적용할비율 = [];

      visibleFrameContainers(true).forEach(container => {
        const ratio = ratios[container.id];
        if (ratio == null || !isFinite(ratio) || ratio <= 0) return;
        frames.push(container);
        적용할비율.push(ratio);
      });

      applyFrameFlexRatios(frames, 적용할비율);
    }

    // DSR 계산기(content-frame)에서 "상담일지 전달" 클릭 시 보내는 메시지를 받아
    // 상담 메인(content-frame의 Consult_Main.html)으로 중계한다.
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'dsrSendToConsulting') return;
      const payload = e.data; // text/kbPrice/neededAmount/propertyInfo 등을 그대로 통째로 중계
      const contentFrame = document.getElementById('content-frame');
      if (!contentFrame) return;

      // 이미 상담 메인이 떠 있으면 바로 전달하고, 아니면 상담 메인으로 전환한 뒤 전달
      if (현재페이지(contentFrame) === 'Consult_Main.html') {
        if (contentFrame.contentWindow) {
          contentFrame.contentWindow.postMessage(payload, '*');
        }
        return;
      }

      const forwardWhenReady = () => {
        contentFrame.removeEventListener('load', forwardWhenReady);
        if (contentFrame.contentWindow) {
          contentFrame.contentWindow.postMessage(payload, '*');
        }
      };
      contentFrame.addEventListener('load', forwardWhenReady);
      loadPage('Consult_Main.html');
    }, false);

    let pagesInitialized = false;

    function initPages() {
      if (pagesInitialized) return;
      pagesInitialized = true;

      const savedName = readUserName();

      try {
        if (savedName) {
          proceedToApp(savedName); // 인증 OFF에서는 저장된 이름으로 즉시 진입
          refreshGateSessionIfEnabled(savedName);
        } else {
          showNameRequired();
        }
      } catch (error) {
        console.error('[초기화 실패]', error);
        // 부가 기능이 실패해도 저장된 이름만은 화면에 유지한다.
        if (savedName) {
          enterAppShell(savedName);
        } else {
          showNameRequired();
        }
      }

      initLongPressLink();
      initDragAndDrop();
      initFrameResizers();
      initTouchFeedback();

      // 프레임 설정 불러오기 (순서·너비 복원 뒤에 표시 여부를 적용해야 한다)
      loadFrameSettings();
      initFrameToggles();

      /* resize 때 iframe을 다시 이동시키지 않는다.
         상하 스크롤바가 나타났다 사라질 때 WebView가 연속 resize를 발생시키면,
         프레임 폭 변화가 다시 스크롤바를 만들고 updateFramesSrc()가 iframe을 재이동하는
         순환이 생길 수 있다. 기본 화면은 최초 진입 때만 결정하면 되므로
         resize에서는 아무것도 하지 않는다. */
    }

    // body onload가 WebView에서 누락되는 경우에도 초기화를 보장한다.
    window.addEventListener('DOMContentLoaded', initPages, { once: true });
    window.addEventListener('load', initPages, { once: true });

    /* Firebase 로그인 상태 변화 반영.
       로그인하면 그 사용자의 이름을 calc_user_name 에 저장하고 앱으로 진입한다.
       (firebase-auth-ui.js 가 calc_user_name 은 이미 채우지만, 이 화면은 "진입"까지 필요하다)
       로그아웃하면 이름을 지우고 다시 이름/로그인 입력을 요구한다. */
    window.addEventListener('dodoAuthChanged', function (e) {
      var user = e && e.detail ? e.detail.user : null;
      if (user) {
        var name = (window.DodoAuth && window.DodoAuth.displayName && window.DodoAuth.displayName()) || '';
        if (!name) name = String(user.email || '').split('@')[0];
        try { writeStoredText(STORAGE_KEYS.userName, name); } catch (err) {}
        try { proceedToApp(name); } catch (err) { console.error('[로그인 진입 실패]', err); }
      } else {
        // 로그아웃: 저장된 이름을 지우고 이름/로그인 입력을 다시 보여준다.
        try { removeStoredText(STORAGE_KEYS.userName); } catch (err) {}
        try { showNameRequired(); } catch (err) {}
      }
    });

    /* 아직 아무것도 안 띄운 프레임에만 기본 화면을 채운다.
       판단 기준은 src 속성이 아니라 data-page다 - loadPage는 location.replace로 옮기기
       때문에 src 속성이 계속 ''로 남아, 그걸 보면 이미 띄워둔 MCG·날짜계산 같은 화면을
       "비어 있다"고 착각해 DSR로 덮어써버린다. (창 폭이 768px 경계를 넘을 때마다 발생) */
    /* 인증이 켜져 있을 때만 세션을 재검증한다.
       GATE_ENABLED=false인 현재는 아무 일도 하지 않는다. */
    function refreshGateSessionIfEnabled(savedName) {
      if (typeof GATE_ENABLED === 'undefined' || !GATE_ENABLED) return;
      const session = getGateSession();
      if (session && Date.now() <= session.expiresAt) {
        logUsageBackground(session);
      } else {
        backgroundVerifyGate(getDeviceId(), savedName);
      }
    }

    /* 지금 이 화면이 스마트상담도구 안드로이드 앱의 WebView인가?

       앱은 MainActivity에서 addJavascriptInterface(..., 'AndroidBridge')로 브릿지를 주입하므로
       앱 안에서는 window.AndroidBridge가 존재한다. 일반 브라우저(PC·모바일 웹)에는 없다.
       이 프로젝트의 다른 화면(사진스캔·IDCard 등)도 같은 방식으로 앱 웹뷰를 판별한다. */
    function 앱웹뷰인가() {
      return typeof window.AndroidBridge !== 'undefined' && window.AndroidBridge !== null;
    }

    /* 본문 프레임에 기본으로 띄울 화면.
       앱 WebView에서는 상담이 주 용도라 상담 화면을, 그 밖의 환경(PC·모바일 웹)에서는
       DSR 계산 화면을 먼저 띄운다. */
    function 기본화면경로() {
      return 앱웹뷰인가() ? 'Consult_Main.html' : 'DSR_Main.html';
    }

    function updateFramesSrc() {
      const contentFrame = document.getElementById('content-frame');
      const calcFrame = document.getElementById('calc-frame');

      const contentPage = 현재페이지(contentFrame);

      // 아직 아무 화면도 안 띄웠거나 DTI가 떠 있으면 기본 화면으로 채운다.
      // (DTI는 좁은 화면에서 쓰기 불편해 DSR로 넘기는 기존 동작 유지)
      if (contentPage === '' || contentPage.includes('DTI.html')) {
        프레임이동(contentFrame, 기본화면경로());
      }
      if (현재페이지(calcFrame) === '') {
        프레임이동(calcFrame, CALC_FRAME_PAGE);
      }
    }

    /* 6) 진입·이름 처리 ───────────────── */

    function readUserName() {
      return readStoredText(STORAGE_KEYS.userName, '').trim();
    }

    // 이름을 화면 상단 카운터에 보여준다(없는 요소라도 죽지 않게 감싼다).
    function setCounterText(text) {
      const counterEl = document.getElementById('today-count');
      if (counterEl) counterEl.textContent = text;
    }

    /* 이름이 없어 잠긴 상태로 만든다.
       네비 버튼·본문·프레임 토글이 모두 .locked-content로 가려진다. */
    function showNameRequired() {
      setCounterText('이름 입력 필요');
      const authSection = document.getElementById('auth-section');
      if (authSection) authSection.style.display = 'flex';
      document.querySelectorAll('.frame-toggle-group').forEach(el => el.classList.add('locked-content'));
    }

    /* 잠금을 풀고 이름 입력부를 숨긴다.
       proceedToApp과 오류 복구 경로가 같은 화면 상태를 만들도록 한 곳에 모았다. */
    function enterAppShell(userName) {
      const authSection = document.getElementById('auth-section');
      if (authSection) authSection.style.display = 'none';
      setCounterText(userName);
      document.querySelectorAll('.locked-content').forEach(el => el.classList.remove('locked-content'));
    }

    function proceedToApp(userName) {
      enterAppShell(userName);
      updateFramesSrc();

      /* 첫 화면 로딩에 대한 항목 사용량을 먼저 기록한다.

         항목 사용량(입구)과 접속 로그(출구)는 서로 다른 요청이지만 같은
         localStorage 쓰기 구역을 쓴다. 항목 기록을 뒤로 미루면 그 사이에
         화면 전환이 끼어들어 첫 화면 사용량이 누락되거나, 두 요청이
         동시에 큐를 읽어 한쪽이 중복 전송되는 문제가 생긴다.

         두 호출은 각각 따로 감싼다 - 하나가 실패해도 나머지는 기록되어야 한다. */
      try {
        // 기본 화면이 정해진 뒤 실제로 표시되는 항목으로 사용량 기록을 시작한다.
        startButtonUsageTracking(앱웹뷰인가() ? '상담' : 'DSR 계산');
      } catch (error) {
        console.error('[사용량 기록 실패]', error);
      }

      try {
        startWorkerRecordAccess(userName);
      } catch (error) {
        console.error('[접속 기록 실패]', error);
      }
    }

    async function submitUserName() {
      const nameInput = document.getElementById('user-name-input');
      const name = nameInput.value.trim();

      if (!name) {
        alert("사용자 이름을 입력해주세요.");
        return;
      }

      const submitBtn = document.querySelector('.user-submit-btn');
      const counterEl = document.getElementById('today-count');

      // ── Firebase 로그인 우선 ─────────────────────────────────────
      // 이름 입력칸에는 "이메일"을 받는다. 비밀번호는 두 번째 로그인 시부터 필요하며,
      // 처음 입력한 이메일은 회원가입(비번은 별도 입력창)으로 이어진다.
      // 임시로: 이메일이면 로그인 시도 → 실패하면 회원가입 폼을 띄운다.
      if (window.DodoAuth && window.DodoAuth.isReady && window.DodoAuth.isReady()) {
        // 이메일 형식이 아니면 기존(이름만 기록) 방식으로 계속 진행한다.
        if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(name)) {
          if (submitBtn) submitBtn.disabled = true;
          if (counterEl) counterEl.textContent = "로그인 확인중...";
          try {
            await window.DodoAuth.signInOrPrompt(name);
            // 로그인/가입 성공은 onAuthStateChanged 가 처리해 calc_user_name 을 채우고 진입한다.
          } catch (err) {
            console.warn('[Firebase 로그인 실패]', err);
            if (counterEl) counterEl.textContent = "이름 입력 필요";
          } finally {
            if (submitBtn) submitBtn.disabled = false;
          }
          return;
        }
      }

      if (!GATE_ENABLED) {
        // 인증 기능 OFF: Google Apps Script의 register를 호출하지 않고 즉시 진입한다.
        writeStoredText(STORAGE_KEYS.userName, name);
        setCounterText(`${name} 기록중...`);
        try {
          proceedToApp(name);
        } catch (err) {
          // 사용량 통신 실패가 화면 진입을 막지 않도록 한다.
          // 이름은 이미 저장했으므로 다음 로드부터 입력창 없이 바로 진입한다.
          console.error('인증 OFF 사용량 기록 오류:', err);
          setCounterText(name);
          if (submitBtn) submitBtn.disabled = false;
        }
        return;
      }

      if (submitBtn) submitBtn.disabled = true;
      if (counterEl) counterEl.textContent = "확인중...";

      try {
        const uid = getDeviceId();
        const result = await callGateAPI({ action: "register", uid, name });

        if (!result || result.allowed !== true) {
          alert(GATE_MESSAGES[result && result.reason] || "사용자 확인에 실패했습니다. 잠시 후 다시 시도해주세요.");
          if (counterEl) counterEl.textContent = "이름 입력 필요";
          return;
        }

        writeStoredText(STORAGE_KEYS.userName, name);
        const session = saveGateSession(uid, name);
        proceedToApp(name);
        // 최초 인증 성공도 사용횟수에 포함한다. 서버에서 10초 중복을 차단한다.
        logUsageBackground(session);
      } catch (err) {
        console.error("등록 확인 실패:", err);
        alert(`${GATE_MESSAGES.network_error}\n${err.message || "응답 없음"}`);
        if (counterEl) counterEl.textContent = "이름 입력 필요";
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    function resetUserNameInput() {
      removeStoredText(STORAGE_KEYS.userName);
      showNameRequired();
      const nameInput = document.getElementById('user-name-input');
      if (nameInput) {
        nameInput.value = '';
        nameInput.focus();
      }
    }

    function initLongPressLink() {
      const longPressTarget = document.getElementById('today-count');
      let pressTimer = null;

      const startPress = () => {
        pressTimer = setTimeout(() => {
          resetUserNameInput();
          pressTimer = null;
        }, 1500);
      };

      const cancelPress = () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      };

      longPressTarget.addEventListener('mousedown', startPress);
      longPressTarget.addEventListener('touchstart', startPress, { passive: true });
      longPressTarget.addEventListener('mouseup', cancelPress);
      longPressTarget.addEventListener('mouseleave', cancelPress);
      longPressTarget.addEventListener('touchend', cancelPress);
      longPressTarget.addEventListener('touchcancel', cancelPress);
    }

    function initTouchFeedback() {
      const buttons = document.querySelectorAll('.button-container button');

      buttons.forEach(button => {
        button.addEventListener('touchstart', function(e) {
          this.classList.add('touch-active');
        }, { passive: true });

        button.addEventListener('touchend', function(e) {
          this.classList.remove('touch-active');
        }, { passive: true });

        button.addEventListener('touchcancel', function(e) {
          this.classList.remove('touch-active');
        }, { passive: true });

        button.addEventListener('mousedown', function(e) {
          if (e.pointerType !== 'touch') {
            this.classList.add('touch-active');
          }
        });

        button.addEventListener('mouseup', function(e) {
          this.classList.remove('touch-active');
        });

        button.addEventListener('mouseleave', function(e) {
          this.classList.remove('touch-active');
        });
      });
    }

    /* 7) 사용자 조작 바인딩 ─────────────────
       드래그·리사이즈가 공통으로 쓰는 포인터 보조 함수.
       조작 중에 iframe이 포인터를 가로채면 pointermove가 끊기므로
       시작할 때 꺼두고 끝날 때 되돌린다. */

    function isLeftButtonPress(e) {
      // 마우스는 좌클릭만, 터치는 버튼 개념이 없으므로 통과시킨다.
      return e.button === 0 || e.pointerType !== 'mouse';
    }

    function capturePointer(target, pointerId) {
      try {
        target.setPointerCapture(pointerId);
      } catch (e) {
        // 포인터가 이미 해제된 경우 등 - 조작 자체는 계속 진행한다.
      }
      document.querySelectorAll('iframe').forEach(ifr => { ifr.style.pointerEvents = 'none'; });
    }

    function releasePointer(target, pointerId) {
      try {
        target.releasePointerCapture(pointerId);
      } catch (e) {
        // 이미 해제됐으면 무시
      }
      document.querySelectorAll('iframe').forEach(ifr => { ifr.style.pointerEvents = 'auto'; });
    }

    // 모바일 터치 및 PC 마우스 공용 프레임 순서 드래그 앤 드롭
    function initDragAndDrop() {
      const handles = document.querySelectorAll('.drag-handle');
      let activeHandle = null;
      let draggedContainer = null;
      let targetContainer = null;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      handles.forEach(handle => {
        handle.addEventListener('pointerdown', (e) => {
          if (!isLeftButtonPress(e)) return;

          activeHandle = handle;
          draggedContainer = handle.closest('.frame-container');
          startX = e.clientX;
          startY = e.clientY;
          isDragging = false;
          targetContainer = null;

          capturePointer(handle, e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (!draggedContainer || activeHandle !== handle) return;

          if (!isDragging) {
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 5) {
              isDragging = true;
              draggedContainer.classList.add('dragging');
            }
          }

          if (isDragging) {
            const elements = document.elementsFromPoint(e.clientX, e.clientY);
            const overContainer = elements.find(el => el.classList && el.classList.contains('frame-container'));

            document.querySelectorAll('.frame-container').forEach(c => c.classList.remove('drag-over'));

            if (overContainer && overContainer !== draggedContainer) {
              targetContainer = overContainer;
              targetContainer.classList.add('drag-over');
            } else {
              targetContainer = null;
            }
          }
        });

        const handlePointerEnd = (e) => {
          if (activeHandle === handle) {
            if (isDragging && draggedContainer && targetContainer && draggedContainer !== targetContainer) {
              const parent = draggedContainer.parentNode;
              const nextSibling = draggedContainer.nextSibling === targetContainer ? draggedContainer : draggedContainer.nextSibling;
              parent.insertBefore(draggedContainer, targetContainer);
              parent.insertBefore(targetContainer, nextSibling);

              // insertBefore로 컨테이너를 옮기면(재부착) 브라우저가 안에 든 iframe을 실제로
              // 다시 불러오면서 화면이 하얗게 빈다 - src 속성은 원래부터 빈 값이라
              // 저절로 복구되지 않는다. dataset.page는 재부착으로도 남아 있으므로
              // 옮겨진 두 프레임 모두 그 값으로 다시 이동시켜 복구한다.
              [draggedContainer, targetContainer].forEach(container => {
                reloadFrameFromMemory(container.querySelector('iframe'));
              });
              updateFramesSrc();
            }

            if (draggedContainer) draggedContainer.classList.remove('dragging');
            document.querySelectorAll('.frame-container').forEach(c => c.classList.remove('drag-over'));
            releasePointer(handle, e.pointerId);

            activeHandle = null;
            draggedContainer = null;
            targetContainer = null;
            isDragging = false;
          }
        };

        handle.addEventListener('pointerup', handlePointerEnd);
        handle.addEventListener('pointercancel', handlePointerEnd);
      });
    }

    // 마우스/터치로 3개 프레임 간격 조절 (리사이저)
    // ※ 비율(%) 기반 flex-grow 방식 사용: 창 너비가 달라져도 프레임들이 항상 전체 너비를 채움
    function initFrameResizers() {
      let activeResizer = null;
      let leftContainer = null;
      let rightContainer = null;
      let startX = 0;
      let startLeftWidth = 0;
      let startRightWidth = 0;
      let wrapperWidth = 0;

      document.querySelectorAll('.frame-resizer').forEach(resizer => {
        resizer.addEventListener('pointerdown', (e) => {
          if (!isLeftButtonPress(e)) return;

          leftContainer = resizer.closest('.frame-container');
          // 접어둔 프레임은 폭이 0이라 짝이 될 수 없다. 보이는 다음 프레임을 찾는다.
          let next = leftContainer ? leftContainer.nextElementSibling : null;
          while (next && !(next.classList.contains('frame-container') && !next.classList.contains('is-hidden'))) {
            next = next.nextElementSibling;
          }
          rightContainer = next;

          if (!leftContainer || !rightContainer) return;

          activeResizer = resizer;
          startX = e.clientX;

          resizer.classList.add('is-resizing');
          capturePointer(resizer, e.pointerId);
          document.body.style.cursor = 'col-resize';

          /* 드래그 시작 시점의 현재 폭을 "비율"로 고정 (px 고정 대신 flex-basis 0% + 비율 grow)

             ① 반드시 "전부 측정한 뒤에 전부 기록"해야 한다. 측정과 기록을 한 프레임씩
                번갈아 하면, 첫 프레임에 flex를 넣는 순간 레이아웃이 다시 계산되어 나머지
                프레임이 넓어진 상태로 측정된다. 그러면 비율 합이 1을 넘고(예: 1.33) 첫
                프레임만 계속 좁아져, 리사이저를 잡기만 해도 폭이 줄고 되돌릴 수 없게 된다.
             ② 비율은 "테두리를 뺀 안쪽 폭"으로 계산해야 한다. flex-basis가 0%라 브라우저는
                각 프레임의 테두리(border-right 1px)를 먼저 떼어놓고 남은 공간만 비율대로
                나눈다. 그런데 getBoundingClientRect()의 폭에는 그 테두리가 포함되어 있어서,
                그대로 비율을 만들면 테두리가 있는 프레임에는 1px이 매번 다시 더해지고
                그만큼을 맨 끝 프레임이 잃는다(잡을 때마다 약 0.7px). 이게 쌓여서 마지막
                프레임이 계속 줄고 되돌릴 수 없게 되던 원인이다.
             ③ 접어둔 프레임은 폭이 0이므로 건드리지 않는다(비율 0으로 굳어버림). */
          const 보이는프레임 = visibleFrameContainers();
          const 안쪽폭들 = 보이는프레임.map(fc => fc.getBoundingClientRect().width - frameBorderWidth(fc));
          wrapperWidth = 안쪽폭들.reduce((합, w) => 합 + w, 0);
          if (wrapperWidth <= 0) return;

          // 합이 정확히 1이 되도록 현재 폭을 비율로 고정한다.
          applyFrameFlexRatios(보이는프레임, 안쪽폭들.map(w => w / wrapperWidth));

          startLeftWidth = 안쪽폭들[보이는프레임.indexOf(leftContainer)];
          startRightWidth = 안쪽폭들[보이는프레임.indexOf(rightContainer)];

          e.preventDefault();
          e.stopPropagation();
        });

        resizer.addEventListener('pointermove', (e) => {
          if (!activeResizer || activeResizer !== resizer || !leftContainer || !rightContainer || !wrapperWidth) return;

          const deltaX = e.clientX - startX;
          let newLeftWidth = startLeftWidth + deltaX;
          let newRightWidth = startRightWidth - deltaX;

          // 어느 쪽이든 최소 폭 밑으로 가면 나머지 하나가 그만큼 줄어든다.
          if (newLeftWidth < MIN_FRAME_WIDTH) {
            newLeftWidth = MIN_FRAME_WIDTH;
            newRightWidth = startLeftWidth + startRightWidth - MIN_FRAME_WIDTH;
          } else if (newRightWidth < MIN_FRAME_WIDTH) {
            newRightWidth = MIN_FRAME_WIDTH;
            newLeftWidth = startLeftWidth + startRightWidth - MIN_FRAME_WIDTH;
          }

          applyFrameFlexRatios(
            [leftContainer, rightContainer],
            [newLeftWidth / wrapperWidth, newRightWidth / wrapperWidth]
          );
        });

        const handleResizerEnd = (e) => {
          if (activeResizer === resizer) {
            resizer.classList.remove('is-resizing');
            releasePointer(resizer, e.pointerId);
            document.body.style.cursor = '';

            activeResizer = null;
            leftContainer = null;
            rightContainer = null;

            // 리사이즈 후 프레임 너비 저장
            updateFrameWidths();
          }
        };

        resizer.addEventListener('pointerup', handleResizerEnd);
        resizer.addEventListener('pointercancel', handleResizerEnd);
      });
    }
  </script>
</head>
<body onload="initPages()">
  <div class="button-container">
    <span id="today-count" class="visitor-counter">이름 입력 필요</span>

    <div id="auth-section" class="user-auth-container">
      <input type="text" id="user-name-input" class="user-input" placeholder="이름 입력" onkeydown="if(event.key === 'Enter') submitUserName()">
      <button type="button" class="user-submit-btn" onclick="submitUserName()">확인</button>
    </div>

    <button type="button" class="nav-btn locked-content" data-usage-item="상담" onclick="loadPage('Consult_Main.html', this)">상담</button>
    <button type="button" class="nav-btn locked-content" data-usage-item="DTI 계산" onclick="loadPage('DTI.html', this)">DTI 계산</button>
    <button type="button" class="nav-btn locked-content" data-usage-item="DSR 계산" onclick="loadPage('DSR_Main.html', this)">DSR 계산</button>
    <button type="button" class="nav-btn locked-content" data-usage-item="날짜계산" onclick="loadPage('날짜계산기.html', this)">날짜계산</button>
    <button type="button" class="nav-btn locked-content" data-usage-item="공시가조회" onclick="loadPage('gonsi.html', this)">공시가조회</button>
    <button type="button" class="nav-btn locked-content" data-usage-item="신분증변환" onclick="loadPage('IDCard.html', this)">신분증변환</button>
    <button type="button" class="nav-btn locked-content" data-usage-item="문서스캔" onclick="loadPage('문서스캔.html', this)">문서스캔</button>
    <button type="button" class="nav-btn locked-content" data-usage-item="MCG 계산" onclick="loadPage('MCG.html', this)">MCG 계산</button>

    <div class="frame-toggle-group locked-content" id="frameToggleGroup">
      <button type="button" class="frame-toggle" data-target="calc-container" data-usage-item="계산기 표시 전환" aria-pressed="true">계산기</button>
    </div>
  </div>

  <div class="main-wrapper locked-content">
    <div id="content-container" class="frame-container">
      <div class="drag-handle" title="드래그하여 순서 변경"></div>
      <iframe id="content-frame" src=""></iframe>
      <div class="frame-resizer" title="드래그하여 간격 조절"></div>
    </div>

       <div id="calc-container" class="frame-container">
         <div class="drag-handle" title="드래그하여 순서 변경"></div>
         <iframe id="calc-frame" src=""></iframe>
         <div class="frame-resizer" title="드래그하여 간격 조절"></div>
       </div>
    </div>
</body>
