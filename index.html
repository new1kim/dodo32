<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP dodo32 계산기</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overscroll-behavior: contain;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    
    /* 상단 버튼 컨테이너 */
    .button-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      background-color: #ffffff;
      height: 54px;
      box-sizing: border-box;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      position: relative;
      z-index: 10;
      overflow-x: auto;
    }

    /* 접속자 기록 카운터 */
    .visitor-counter {
      font-size: 11px;
      color: #0369a1;
      background-color: #e0f2fe;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid #bae6fd;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .visitor-counter:hover {
      background-color: #bfdbfe;
    }
    
    .visitor-counter:active {
      transform: scale(0.97);
    }

    /* 이름 입력 영역 스타일 */
    .user-auth-container {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-input {
      width: 90px;
      height: 30px;
      padding: 0 8px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      -webkit-user-select: text;
      user-select: text;
    }

    .user-submit-btn {
      height: 30px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background-color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .user-submit-btn:hover {
      background-color: #334155;
    }

    .user-submit-btn:active {
      transform: scale(0.95);
      background-color: #1e293b;
    }

    .user-submit-btn.touch-active {
      transform: scale(0.95);
      background-color: #1e293b;
    }

    /* 이름 인증 완료 전까지 숨겨질 메뉴 버튼과 본문 영역 */
    .locked-content {
      display: none !important;
    }

    /* 상단 내비게이션 버튼 */
    .button-container button.nav-btn {
      width: 88px;
      height: 36px;
      padding: 0;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      background-color: #f1f5f9;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      flex-shrink: 0;
    }  
    
    .button-container button.nav-btn:hover {
      background-color: #e2e8f0;
      color: #1e293b;
    }

    /* 모바일 환경 터치 피드백 효과 강화 */
    .button-container button.nav-btn:active {
      transform: scale(0.95) !important;
      background-color: #cbd5e1;
    }

    .button-container button.nav-btn.touch-active {
      transform: scale(0.95) !important;
      background-color: #cbd5e1;
    }

    .button-container button.active-nav {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }

    .button-container button.active-nav:active {
      background-color: #1d4ed8;
    }

    .button-container button.active-nav.touch-active {
      background-color: #1d4ed8;
    }

    /* 프레임들을 감싸는 메인 래퍼 */
    .main-wrapper {
      display: flex;
      width: 100%;
      height: calc(100% - 54px);
      gap: 0;
      overflow: hidden;
      position: relative;
    }

    /* 개별 프레임 컨테이너 */
    .frame-container {
      flex: 1 1 0;
      min-width: 80px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      box-sizing: border-box;
      position: relative;
      background-color: #ffffff;
      transition: opacity 0.2s;
    }

    .frame-container:last-child {
      border-right: none;
    }

    /* 드래그용 헤더 핸들바 */
    .drag-handle {
      display: flex;
      height: 20px;
      background-color: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      cursor: grab;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .drag-handle:active {
      cursor: grabbing;
      background-color: #e2e8f0;
    }
    .drag-handle::after {
      content: "•••";
      color: #94a3b8;
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* 프레임 간격 조절 리사이저 바 */
    .frame-resizer {
      position: absolute;
      top: 0;
      right: -5px;
      width: 10px;
      height: 100%;
      cursor: col-resize;
      z-index: 20;
      touch-action: none;
      background-color: transparent;
      transition: background-color 0.15s ease;
    }
    .frame-resizer:hover,
    .frame-resizer.is-resizing {
      background-color: rgba(37, 99, 235, 0.4);
    }
    .frame-container:last-child .frame-resizer {
      display: none;
    }

    /* 드래그 및 드랍 관련 상태 스타일 */
    .frame-container.dragging {
      opacity: 0.4;
    }
    .frame-container.drag-over {
      outline: 2px dashed #2563eb;
      outline-offset: -2px;
      background-color: rgba(37, 99, 235, 0.05);
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    /* 일반 모바일 환경(768px 미만): content-container 프레임 1개만 표시 */
    @media (max-width: 767px) {
      .frame-container:not(#content-container) {
        display: none !important;
      }
      #content-container {
        flex: 1 1 auto !important;
        width: 100% !important;
      }
      /* 프레임이 1개뿐이므로 순서 변경 핸들/너비 조절 바는 의미가 없어 숨김 */
      #content-container .drag-handle,
      #content-container .frame-resizer {
        display: none !important;
      }
    }

    /* PC 및 태블릿 환경(768px 이상): 3개 프레임 모두 표시 (기본 flex 레이아웃 그대로 사용) */
  </style>
  <script>
    // 가상 키보드 팝업 등으로 인해 프레임이 강제 새로고침되는 현상을 막기 위한 모드 저장용 변수
    let lastLayoutMode = window.innerWidth >= 768 ? 'wide' : 'mobile';
    let isResizing = false;

    function loadPage(page, element) {
      const version = '250605_1';
      
      // 상담일지는 별도 처리 (모바일/PC 모드에 따라 다른 프레임 사용)
      if (page === '상담일지.html') {
        if (window.innerWidth < 768) {
          // 모바일: content-frame 사용
          const contentFrame = document.getElementById('content-frame');
          if (contentFrame) {
            if (contentFrame.contentWindow) {
              contentFrame.contentWindow.location.replace(`${page}?v=${version}`);
            } else {
              contentFrame.setAttribute('src', `${page}?v=${version}`);
            }
          }
        } else {
          // PC/태블릿: consulting-frame 사용
          const consultingFrame = document.getElementById('consulting-frame');
          if (consultingFrame) {
            if (consultingFrame.contentWindow) {
              consultingFrame.contentWindow.location.replace(`${page}?v=${version}`);
            } else {
              consultingFrame.setAttribute('src', `${page}?v=${version}`);
            }
          }
        }
      } else {
        // 다른 페이지들: content-frame 사용
        const contentFrame = document.getElementById('content-frame');
        if (contentFrame) {
          if (contentFrame.contentWindow) {
            contentFrame.contentWindow.location.replace(`${page}?v=${version}`);
          } else {
            contentFrame.setAttribute('src', `${page}?v=${version}`);
          }
        }
      }
      
      if (element) {
        const buttons = document.querySelectorAll('.button-container button.nav-btn');
        buttons.forEach(btn => btn.classList.remove('active-nav'));
        element.classList.add('active-nav');
      }
    }
    
    // 프레임 순서 저장 함수
    function updateFrameOrder() {
      const containers = document.querySelectorAll('.frame-container');
      const order = Array.from(containers).map(container => container.id);
      localStorage.setItem('frame_order', JSON.stringify(order));
    }

    // 프레임 너비 저장 함수
    function updateFrameWidths() {
      const containers = document.querySelectorAll('.frame-container');
      const widths = Array.from(containers).map(container => {
        return {
          id: container.id,
          width: container.offsetWidth
        };
      });
      localStorage.setItem('frame_widths', JSON.stringify(widths));
    }

    // 프레임 설정 불러오기 함수
    function loadFrameSettings() {
      // 순서 복원
      const savedOrder = localStorage.getItem('frame_order');
      if (savedOrder) {
        try {
          const order = JSON.parse(savedOrder);
          const mainWrapper = document.querySelector('.main-wrapper');
          const containerMap = {};
          
          // 기존 컨테이너들을 맵에 저장
          document.querySelectorAll('.frame-container').forEach(container => {
            containerMap[container.id] = container;
          });
          
          // 순서대로 재배치
          order.forEach(id => {
            if (containerMap[id]) {
              mainWrapper.appendChild(containerMap[id]);
            }
          });
        } catch (e) {
          console.error('프레임 순서 복원 실패:', e);
        }
      }

      // 너비 복원
      const savedWidths = localStorage.getItem('frame_widths');
      if (savedWidths) {
        try {
          const widths = JSON.parse(savedWidths);
          widths.forEach(item => {
            const container = document.getElementById(item.id);
            if (container) {
              container.style.flex = `0 0 ${item.width}px`;
            }
          });
        } catch (e) {
          console.error('프레임 너비 복원 실패:', e);
        }
      }
    }

    function initPages() {
      const savedName = localStorage.getItem('calc_user_name');
      
      if (savedName) {
        proceedToApp(savedName);
      } else {
        document.getElementById('today-count').textContent = "이름 입력 필요";
      }

      initLongPressLink();
      initDragAndDrop();
      initFrameResizers();
      initTouchFeedback();
      initLongPressButtons();
      
      // 프레임 설정 불러오기
      loadFrameSettings();
      
      window.addEventListener('resize', () => {
        const savedName = localStorage.getItem('calc_user_name');
        if (savedName) {
          const currentMode = window.innerWidth >= 768 ? 'wide' : 'mobile';
          if (currentMode !== lastLayoutMode) {
            lastLayoutMode = currentMode;
            isResizing = true;
            updateFramesSrc();
            isResizing = false;
          }
        }
      }, false);
    }

    function updateFramesSrc() {
      const version = '250605_1';
      
      const contentFrame = document.getElementById('content-frame');
      const calcFrame = document.getElementById('calc-frame');
      const consultingFrame = document.getElementById('consulting-frame');

      const contentSrc = contentFrame.getAttribute('src') || '';
      const calcSrc = calcFrame.getAttribute('src') || '';
      const consultingSrc = consultingFrame.getAttribute('src') || '';

      if (contentSrc === '' || contentSrc.includes('main.html')) {
        if (contentFrame.contentWindow) contentFrame.contentWindow.location.replace(`DSR계산기Main.html?v=${version}`);
        else contentFrame.setAttribute('src', `DSR계산기Main.html?v=${version}`);
      }
      if (calcSrc === '') {
        if (calcFrame.contentWindow) calcFrame.contentWindow.location.replace(`계산기.html?v=${version}`);
        else calcFrame.setAttribute('src', `계산기.html?v=${version}`);
      }
      if (consultingSrc === '') {
        if (consultingFrame.contentWindow) consultingFrame.contentWindow.location.replace(`상담일지.html?v=${version}`);
        else consultingFrame.setAttribute('src', `상담일지.html?v=${version}`);
      }
    }

    function proceedToApp(userName) {
      document.getElementById('auth-section').style.display = 'none';
      
      const lockedElements = document.querySelectorAll('.locked-content');
      lockedElements.forEach(el => el.classList.remove('locked-content'));

      updateFramesSrc();
      startWorkerRecordAccess(userName);
    }

    function submitUserName() {
      const nameInput = document.getElementById('user-name-input');
      const name = nameInput.value.trim();
      
      if (!name) {
        alert("사용자 이름을 입력해주세요.");
        return;
      }

      localStorage.setItem('calc_user_name', name);
      proceedToApp(name);
    }

    function resetUserNameInput() {
      localStorage.removeItem('calc_user_name');

      const authSection = document.getElementById('auth-section');
      const nameInput = document.getElementById('user-name-input');
      const counterEl = document.getElementById('today-count');

      if (authSection) authSection.style.display = 'flex';
      if (nameInput) {
        nameInput.value = '';
        nameInput.focus();
      }
      if (counterEl) counterEl.textContent = "이름 입력 필요";
    }

    function initLongPressLink() {
      const longPressTarget = document.getElementById('today-count');
      let pressTimer = null;

      const startPress = () => {
        pressTimer = setTimeout(() => {
          resetUserNameInput();
          pressTimer = null;
        }, 1500);
      };

      const cancelPress = () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      };

      longPressTarget.addEventListener('mousedown', startPress);
      longPressTarget.addEventListener('touchstart', startPress, { passive: true });
      longPressTarget.addEventListener('mouseup', cancelPress);
      longPressTarget.addEventListener('mouseleave', cancelPress);
      longPressTarget.addEventListener('touchend', cancelPress);
      longPressTarget.addEventListener('touchcancel', cancelPress);
    }

    function initTouchFeedback() {
      const buttons = document.querySelectorAll('.button-container button');
      
      buttons.forEach(button => {
        button.addEventListener('touchstart', function(e) {
          this.classList.add('touch-active');
        }, { passive: true });

        button.addEventListener('touchend', function(e) {
          this.classList.remove('touch-active');
        }, { passive: true });

        button.addEventListener('touchcancel', function(e) {
          this.classList.remove('touch-active');
        }, { passive: true });

        button.addEventListener('mousedown', function(e) {
          if (e.pointerType !== 'touch') {
            this.classList.add('touch-active');
          }
        });

        button.addEventListener('mouseup', function(e) {
          this.classList.remove('touch-active');
        });

        button.addEventListener('mouseleave', function(e) {
          this.classList.remove('touch-active');
        });
      });
    }

    function initLongPressButtons() {
      const navButtons = document.querySelectorAll('.button-container button.nav-btn');
      
      navButtons.forEach(button => {
        let pressTimer = null;
        let showPopupTimer = null;

        const handlePressStart = () => {
          showPopupTimer = setTimeout(() => {
            showResetGuidePopup();
          }, 1000);
          
          pressTimer = setTimeout(() => {
            clearTimeout(showPopupTimer);
            resetFrame(button);
            pressTimer = null;
          }, 2000);
        };

        const handlePressEnd = () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
          if (showPopupTimer) {
            clearTimeout(showPopupTimer);
            showPopupTimer = null;
          }
        };

        button.addEventListener('mousedown', handlePressStart);
        button.addEventListener('touchstart', handlePressStart, { passive: true });
        
        button.addEventListener('mouseup', handlePressEnd);
        button.addEventListener('mouseleave', handlePressEnd);
        button.addEventListener('touchend', handlePressEnd);
        button.addEventListener('touchcancel', handlePressEnd);
      });
    }

    function showResetGuidePopup() {
      const existingPopup = document.getElementById('resetGuidePopup');
      if (existingPopup) existingPopup.remove();

      const popup = document.createElement('div');
      popup.id = 'resetGuidePopup';
      popup.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px 24px;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15);
        z-index: 200;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
        animation: slideIn 0.2s ease-out;
      `;
      
      popup.innerHTML = `
        <div style="font-size: 14px; color: #475569; line-height: 1.6;">
          <div style="margin-bottom: 8px; font-weight: 600;">2초간 누르면 초기화됩니다</div>
          <div style="font-size: 12px; color: #94a3b8;">계속 누르고 있으면 입력된 내용이 모두 삭제됩니다</div>
        </div>
      `;

      document.body.appendChild(popup);
      
      setTimeout(() => {
        if (popup.parentElement) {
          popup.style.opacity = '0';
          popup.style.transition = 'opacity 0.3s ease';
          setTimeout(() => popup.remove(), 300);
        }
      }, 1000);
    }

    function resetFrame(buttonElement) {
      const frameId = getFrameIdFromButton(buttonElement);
      if (!frameId) return;

      const frame = document.getElementById(frameId);
      if (!frame) return;

      const pageNames = {
        'content-frame': ['DSR', 'main', 'MCG', '상담'],
        'calc-frame': ['calculator'],
        'consulting-frame': ['consulting']
      };

      if (pageNames[frameId]) {
        const keys = Object.keys(localStorage);
        keys.forEach(key => {
          if (pageNames[frameId].some(name => key.includes(name))) {
            localStorage.removeItem(key);
          }
        });
      }

      try {
        if (frame.contentWindow && frame.contentWindow.resetAllFields) {
          frame.contentWindow.resetAllFields();
        } else {
          const version = '250605_1';
          const src = frame.getAttribute('src');
          if (src) {
            const baseUrl = src.split('?')[0];
            frame.setAttribute('src', `${baseUrl}?v=${version}&t=${Date.now()}`);
          }
        }
      } catch (e) {
        const version = '250605_1';
        const src = frame.getAttribute('src');
        if (src) {
          const baseUrl = src.split('?')[0];
          frame.setAttribute('src', `${baseUrl}?v=${version}&t=${Date.now()}`);
        }
      }
    }

    function getFrameIdFromButton(buttonElement) {
      const btnText = buttonElement.textContent.trim();
      
      if (btnText === '상담일지') {
        if (window.innerWidth < 768) {
          return 'content-frame';
        } else {
          return 'consulting-frame';
        }
      }
      
      const buttonMap = {
        'DTI 계산': 'content-frame',
        'DSR 계산': 'content-frame',
        'MCG 계산': 'content-frame',
      };
      return buttonMap[btnText] || null;
    }

    function getDeviceId() {
      let id = localStorage.getItem('calc_device_id');
      if (!id) {
        id = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
              const r = Math.random() * 16 | 0;
              const v = c === 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
        localStorage.setItem('calc_device_id', id);
      }
      return id;
    }

    function getEnvSummary() {
      const ua = navigator.userAgent;

      let os = 'Unknown';
      if (/Windows/i.test(ua)) os = 'Windows';
      else if (/Android/i.test(ua)) os = 'Android';
      else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
      else if (/Mac OS X/i.test(ua)) os = 'Mac';

      let browser = 'Unknown';
      if (/Edg\//i.test(ua)) browser = 'Edge';
      else if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) browser = 'Chrome';
      else if (/Firefox\//i.test(ua)) browser = 'Firefox';
      else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) browser = 'Safari';

      const deviceType = /Mobi|Android|iPhone|iPad/i.test(ua) ? 'Mobile' : 'PC';

      return `${os}·${browser}·${deviceType}`;
    }

    function startWorkerRecordAccess(userName) {
      if (window.Worker) {
        document.getElementById('today-count').textContent = `${userName} 기록중...`;

        const deviceId = getDeviceId();
        const envSummary = getEnvSummary();
        const ua = navigator.userAgent;

        const workerCode = `
          self.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'start') {
              const name = encodeURIComponent(e.data.name);
              const deviceId = encodeURIComponent(e.data.deviceId);
              const env = encodeURIComponent(e.data.env);
              const ua = encodeURIComponent(e.data.ua);
              const apiUrl = "https://script.google.com/macros/s/AKfycbwW_7x4agccYUUn2BoLTpcln8auXCqYATYay3bGFy_gzT4yvuSy2Ae005hwcEBJjCaOpg/exec?name=" + name + "&device_id=" + deviceId + "&env=" + env + "&ua=" + ua;
              
              fetch(apiUrl)
                .then(response => {
                  if (!response.ok) throw new Error("HTTP 에러");
                  return response.json(); 
                })
                .then(data => {
                  self.postMessage({ success: true, name: e.data.name });
                })
                .catch((error) => {
                  self.postMessage({ success: false, error: "통신 실패" });
                });
            }
          });
        `;
        const blob = new Blob([workerCode], { type: "application/javascript" });
        const worker = new Worker(URL.createObjectURL(blob));
        
        worker.addEventListener('message', (e) => {
          const counterEl = document.getElementById('today-count');
          if (counterEl) {
            if (e.data && e.data.success) {
              counterEl.textContent = `${e.data.name} ✔`;
            } else {
              counterEl.textContent = `연결실패`;
            }
          }
        });

        worker.postMessage({ type: "start", name: userName, deviceId: deviceId, env: envSummary, ua: ua });
      } else {
        console.warn("Web Worker를 지원하지 않는 브라우저입니다.");
      }
    }

    // 모바일 터치 및 PC 마우스 공용 프레임 순서 드래그 앤 드롭
    function initDragAndDrop() {
      const handles = document.querySelectorAll('.drag-handle');
      let activeHandle = null;
      let draggedContainer = null;
      let targetContainer = null;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      handles.forEach(handle => {
        handle.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;

          activeHandle = handle;
          draggedContainer = handle.closest('.frame-container');
          startX = e.clientX;
          startY = e.clientY;
          isDragging = false;
          targetContainer = null;

          handle.setPointerCapture(e.pointerId);
          document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'none');
        });

        handle.addEventListener('pointermove', (e) => {
          if (!draggedContainer || activeHandle !== handle) return;

          if (!isDragging) {
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 5) {
              isDragging = true;
              draggedContainer.classList.add('dragging');
            }
          }

          if (isDragging) {
            const elements = document.elementsFromPoint(e.clientX, e.clientY);
            const overContainer = elements.find(el => el.classList && el.classList.contains('frame-container'));

            document.querySelectorAll('.frame-container').forEach(c => c.classList.remove('drag-over'));

            if (overContainer && overContainer !== draggedContainer) {
              targetContainer = overContainer;
              targetContainer.classList.add('drag-over');
            } else {
              targetContainer = null;
            }
          }
        });

        const handlePointerEnd = (e) => {
          if (activeHandle === handle) {
            if (isDragging && draggedContainer && targetContainer && draggedContainer !== targetContainer) {
              const parent = draggedContainer.parentNode;
              const nextSibling = draggedContainer.nextSibling === targetContainer ? draggedContainer : draggedContainer.nextSibling;
              parent.insertBefore(draggedContainer, targetContainer);
              parent.insertBefore(targetContainer, nextSibling);
              
              // 드래그 후 프레임 순서가 변경되었으므로 iframe 내용을 다시 로드
              updateFramesSrc();
            }

            if (draggedContainer) draggedContainer.classList.remove('dragging');
            document.querySelectorAll('.frame-container').forEach(c => c.classList.remove('drag-over'));
            document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'auto');

            try {
              handle.releasePointerCapture(e.pointerId);
            } catch (err) {}

            activeHandle = null;
            draggedContainer = null;
            targetContainer = null;
            isDragging = false;
          }
        };

        handle.addEventListener('pointerup', handlePointerEnd);
        handle.addEventListener('pointercancel', handlePointerEnd);
      });
    }

    // 마우스/터치로 3개 프레임 간격 조절 (리사이저)
    function initFrameResizers() {
      let activeResizer = null;
      let leftContainer = null;
      let rightContainer = null;
      let startX = 0;
      let startLeftWidth = 0;
      let startRightWidth = 0;

      document.querySelectorAll('.frame-resizer').forEach(resizer => {
        resizer.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;

          leftContainer = resizer.closest('.frame-container');
          let next = leftContainer ? leftContainer.nextElementSibling : null;
          while (next && !next.classList.contains('frame-container')) {
            next = next.nextElementSibling;
          }
          rightContainer = next;

          if (!leftContainer || !rightContainer) return;

          activeResizer = resizer;
          startX = e.clientX;
          startLeftWidth = leftContainer.getBoundingClientRect().width;
          startRightWidth = rightContainer.getBoundingClientRect().width;

          resizer.classList.add('is-resizing');
          resizer.setPointerCapture(e.pointerId);

          document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'none');
          document.body.style.cursor = 'col-resize';

          document.querySelectorAll('.frame-container').forEach(fc => {
            fc.style.flex = `0 0 ${fc.getBoundingClientRect().width}px`;
          });

          e.preventDefault();
          e.stopPropagation();
        });

        resizer.addEventListener('pointermove', (e) => {
          if (!activeResizer || activeResizer !== resizer || !leftContainer || !rightContainer) return;

          const deltaX = e.clientX - startX;
          const minWidth = 80;

          let newLeftWidth = startLeftWidth + deltaX;
          let newRightWidth = startRightWidth - deltaX;

          if (newLeftWidth < minWidth) {
            newLeftWidth = minWidth;
            newRightWidth = startLeftWidth + startRightWidth - minWidth;
          } else if (newRightWidth < minWidth) {
            newRightWidth = minWidth;
            newLeftWidth = startLeftWidth + startRightWidth - minWidth;
          }

          leftContainer.style.flex = `0 0 ${newLeftWidth}px`;
          rightContainer.style.flex = `0 0 ${newRightWidth}px`;
        });

        const handleResizerEnd = (e) => {
          if (activeResizer === resizer) {
            resizer.classList.remove('is-resizing');
            document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'auto');
            document.body.style.cursor = '';

            try {
              resizer.releasePointerCapture(e.pointerId);
            } catch (err) {}

            activeResizer = null;
            leftContainer = null;
            rightContainer = null;
            
            // 리사이즈 후 프레임 너비 저장
            updateFrameWidths();
          }
        };

        resizer.addEventListener('pointerup', handleResizerEnd);
        resizer.addEventListener('pointercancel', handleResizerEnd);
      });
    }
  </script>
